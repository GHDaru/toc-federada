<style>

.term{padding:20px 0;border-bottom:1px solid var(--border)}
.term:last-child{border-bottom:none}
.term .term-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.term .term-name{font-size:18px;font-weight:700;letter-spacing:-.01em}
.term .term-id{font-family:var(--font-mono);font-size:12px;color:var(--faint);background:var(--surface-2);padding:2px 8px;border-radius:5px;border:1px solid var(--border)}
.term .term-def{color:var(--muted);font-size:14.5px;margin:0 0 10px;max-width:70ch}
.term .term-map{font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:0}
.term .term-map b{color:var(--accent)}
.phase-fail{border-left:3px solid var(--amber);background:rgba(176,107,0,.06);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px}
.chk{font-size:13px;color:var(--muted);margin-bottom:4px;list-style:none;padding-left:22px;position:relative}
.chk span.box{position:absolute;left:0;top:0}
.slab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 6px}
.kv-wide{display:grid;grid-template-columns:230px 1fr;gap:6px 14px;font-size:13.5px}
.kv-wide dt{color:var(--faint);font-weight:600}
.kv-wide dd{margin:0}
/* Página "Código" (adaptação 17). Tabela larga rola dentro do próprio contêiner: o corpo
   da página nunca rola na horizontal, nem num iframe estreito. */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:9px;background:var(--surface);margin:0 0 22px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-family:var(--font-mono);white-space:nowrap}
.tbl th.num{text-align:right}
.mono{font-family:var(--font-mono);font-size:12px}

</style>
</head>

<script>
const tt=document.getElementById("themeToggle");
const MOON_SVG='<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SUN_SVG='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';

<script>
const D = {"overview": {"eyebrow": "Visão geral", "title": "TOC Federada", "lede": "Este documento é a leitura da linhagem, não o plano do produto: descreve o problema que a aplicação existe para resolver, o que quatro gerações de protótipo entregaram e o que nunca saiu delas, os defeitos medidos que viram requisito ou decisão, e as perguntas que só o humano responde. O mapa de módulos está em <code>docs/produto/modulos.md</code>; a ordem de construção em <code>docs/produto/rounds.md</code> e <code>docs/roadmap.md</code>. Os números sobre o domínio — e não sobre a linhagem — saem da base sintética da Instituição Horizonte, em <code>docs/produto/dados/README.md</code>, medida pelo script <code>docs/produto/dados/medir-base.py</code> (ADR 0006).", "cards": [{"title": "📦 O que é", "content": "Os <b>Processos de Pensamento da Teoria das Restrições (TOC)</b> como ferramenta multiusuário — Árvore da Realidade Atual, Nuvem de Conflito, Árvore da Realidade Futura, Árvore de Pré-Requisitos, Árvore de Transição, Estratégia &amp; Táticas — costurados pela jornada dos cinco passos de focalização. Sucessora da linhagem TOC-Builder (quatro gerações de protótipo) e segunda aplicação candidata à federação da plataforma."}, {"title": "📐 Corpus de planejamento", "content": "12 specs · 8 módulos (M1–M8) · 15 ADRs · 359 RF · 114 RI · 105 RNF · 71 regras de negócio · 61 integrações. Números contados pelo gerador, não declarados."}, {"title": "🤝 Federação", "content": "Padrão APH (Aplicação ↔ Harness) Nível 2 (Operador), <code>mode: embedded</code>, <code>app_id: toc</code>, identidade por <code>POST /auth/introspect</code>, servida de eTLD+1 distinto do hospedeiro (ADR 0003). Assistência de inteligência artificial exclusivamente pela fundação, por catálogo de ações governadas (ADR 0007)."}, {"title": "🧱 O que já existe em código", "content": "49526 linhas de produção em 181 arquivos (<code>apps/api</code> + <code>apps/web</code>), com 1566 casos de teste escritos em 133 arquivos, 144 rotas HTTP publicadas, 9 migrações Alembic sobre 36 tabelas e 8 dos 8 módulos com código. Contado pelo gerador nos arquivos; que a suíte passe é afirmação do <code>qa-report.md</code> do ciclo, com a saída colada."}, {"title": "⚖️ Estado honesto", "content": "Nenhum ciclo foi <b>promovido</b>: o gate humano é indelegável e continua aberto em todos eles. O que existe é construção fechada do lado do agente, com 27 portões executáveis e 81 sabotagens que provam que os portões sabem reprovar, e 7 jornadas vivas com captura do build real (P6). O selo 🟡 PLANEJADO continua no requisito que ninguém mediu; 🟢 só com <code>arquivo:linha</code>."}], "callout": "<b>Barra:</b> honestidade de estado medida contra o corpus da irmã <b>gestaodeprioridades</b> (nenhuma contagem sem a saída colada — regra R1); clareza e densidade pela <b>régua Linear</b>."}, "taxonomy": {"categories": [{"key": "produto", "label": "Produto", "icon": "📦", "hint": "O domínio da TOC — o vocabulário que o usuário fala"}, {"key": "engenharia", "label": "Engenharia", "icon": "⚙️", "hint": "Padrão APH, DDD e hexagonal — a estrutura técnica"}, {"key": "metodologia", "label": "Metodologia", "icon": "📋", "hint": "Maestro — como um humano rege muitos agentes"}], "terms": [{"term": "Efeito Indesejável (UDE)", "id": "ude", "cat": "produto", "def": "Sintoma verificável e presente do sistema, escrito como fato observável — não como opinião, causa ou falta de solução. É a matéria-prima da Árvore da Realidade Atual.", "map": "Módulo <b>M2</b>, spec <code>005-arvore-da-realidade-atual</code>: os critérios formais de UDE viram <b>regra de domínio pura</b>, testável sem rede — saíram do prompt do modelo, onde a 4ª geração os deixava (<code>tocbuilderv3/constants.ts:109-137</code>).", "analogy": "O sintoma que o paciente relata — ainda não é o diagnóstico."}, {"term": "Árvore da Realidade Atual (ARA)", "id": "ara", "cat": "produto", "def": "Diagrama de causa e efeito que liga os efeitos indesejáveis às poucas causas raiz que os produzem, checado por suficiência causal.", "map": "Módulo <b>M2</b>, ciclo 005. É a ferramenta mais madura da linhagem TOC-Builder e a primeira reconstruída com desenvolvimento guiado por teste (TDD).", "analogy": "O mapa que sobe dos sintomas até a doença."}, {"term": "Nuvem de Conflito (NC)", "id": "nc", "cat": "produto", "def": "Modelo do dilema em cinco entidades — objetivo, duas necessidades e duas ações conflitantes — ligadas por sete arestas, cada uma carregando uma premissa.", "map": "Módulo <b>M3</b>, spec <code>007-nuvem-de-conflito</code>: as cinco entidades e as sete premissas são invariantes de domínio verificadas por teste, não desenho livre.", "analogy": "O nó da corda desenhado antes de tentar desatá-lo."}, {"term": "Premissa e Injeção", "id": "premissa-injecao", "cat": "produto", "def": "Premissa é a crença que sustenta uma aresta do conflito; injeção é a ideia que invalida uma premissa e evapora o conflito em vez de negociá-lo.", "map": "Épicos <b>E3.2</b> (premissas por aresta, injeção ligada à premissa que invalida) e <b>E4.1</b> — a injeção da nuvem é o que semeia a Árvore da Realidade Futura.", "analogy": "O prego escondido no pneu: achar é resolver, não empurrar o carro."}, {"term": "Obstáculo e Objetivo Intermediário (OI)", "id": "obstaculo-oi", "cat": "produto", "def": "Na Árvore de Pré-Requisitos, cada obstáculo entre o hoje e a meta ganha um objetivo intermediário que o supera; os OIs são então sequenciados por dependência.", "map": "Épico <b>E4.2</b>, spec <code>008-arvores-de-futuro-e-implementacao</code> — a metade da TOC que quatro gerações prometeram e nenhuma entregou.", "analogy": "As pedras do rio, colocadas na ordem em que se pisa."}, {"term": "Restrição e os cinco passos de focalização", "id": "restricao", "cat": "produto", "def": "A restrição é o elo que limita o desempenho do sistema inteiro; os cinco passos (identificar, explorar, subordinar, elevar, recomeçar) são o ciclo que a trata.", "map": "Módulo <b>M6</b>, spec <code>009-focalizacao</code>: a jornada guiada que costura as outras ferramentas. Inteiramente nova — zero ocorrências na linhagem.", "analogy": "O gargalo da garrafa: alargar qualquer outro ponto não faz sair mais água."}, {"term": "Padrão APH (Aplicação ↔ Harness)", "id": "aph", "cat": "engenharia", "def": "Norma da fronteira entre uma aplicação e o ambiente que a hospeda. O alvo aqui é o Nível 2 (Operador), com <code>mode: embedded</code>.", "map": "Módulo <b>M7</b>, ADR 0003. A norma vive em <code>GHDaru/protocolos</code> e é leitura; a aderência se autodeclara no ciclo 012, com evidência por requisito.", "analogy": "A tomada de três pinos: quem fabrica o aparelho não redefine o padrão."}, {"term": "Introspecção e embarque", "id": "introspeccao", "cat": "engenharia", "def": "Identidade obtida do hospedeiro por <code>POST /auth/introspect</code> (servidor a servidor) e embarque da aplicação por iframe com envelope de mensagens <code>ghd.*</code>.", "map": "Épicos <b>E7.1</b> e <b>E7.2</b>, spec <code>003-esqueleto-federado</code>. Nada de login próprio: é o princípio P2 do projeto, inegociável.", "analogy": "O crachá conferido na portaria — não impresso pelo visitante."}, {"term": "Manifesto e catálogo <code>toc.*</code>", "id": "manifesto", "cat": "engenharia", "def": "O manifesto declara o que a aplicação é e oferece; o catálogo lista, ação a ação, o que o modelo de linguagem pode enxergar e propor, com risco e capacidade exigida.", "map": "Épico <b>E7.3</b>, spec <code>006-acoes-governadas-e-snapshot</code>, contrato em <code>specs/006-acoes-governadas-e-snapshot/contracts/manifesto.json</code>.", "analogy": "O cardápio do restaurante: quem pede escolhe do cardápio, não da cozinha."}, {"term": "Proposta de ação (<code>action_proposal</code>) e snapshot", "id": "proposta", "cat": "engenharia", "def": "Todo verbo que muta estado nasce como proposta, aprovada fora do modelo por uma máquina de estados no servidor; o snapshot é a tela entregue como <b>dado sanitizado</b>, nunca como instrução.", "map": "Épicos <b>E7.4</b> e <b>E7.5</b>. Sem capacidade de escrita, as ações mutadoras somem do catálogo — portão executável do ciclo 006, com a contagem antes e depois na saída.", "analogy": "O pedido de compra que precisa de assinatura: quem digita não é quem autoriza."}, {"term": "Módulo, porta e adaptador", "id": "modulo", "cat": "engenharia", "def": "Módulo é um <i>bounded context</i> do Design Orientado a Domínio (DDD): vocabulário e modelo próprios. Porta é a interface do domínio; adaptador é a implementação na borda.", "map": "M1–M8 em <code>docs/produto/modulos.md</code>; a regra vira função de aptidão com <code>import-linter</code>, que falha a integração contínua se o domínio importar framework (princípio P3).", "analogy": "A tomada e o aparelho: o domínio não sabe qual usina gera a energia."}, {"term": "Spec (a partitura) e RF / RI / RNF", "id": "spec", "cat": "metodologia", "def": "A especificação é a fonte de verdade que <b>gera</b> o código. Os requisitos são funcionais (RF), de interface (RI) e não funcionais (RNF), escritos em forma EARS: “O SISTEMA DEVE …”, “QUANDO … O SISTEMA DEVE …”.", "map": "<code>specs/NNN-slug/spec.md</code>, formato fixado pelo ADR 0004 e conferido por <code>scripts/check-specs.sh</code>; régua de prontidão (DoR) com corte em 80 pontos.", "analogy": "A partitura: a orquestra executa, o maestro não toca cada nota."}, {"term": "ADR e “Princípios tocados”", "id": "adr", "cat": "metodologia", "def": "Architecture Decision Record — decisão datada e imutável, com contexto, alternativas numeradas e consequências. Todo ADR daqui declara quais princípios toca, com <code>nenhum</code> escrito por extenso quando for o caso.", "map": "<code>docs/adr/</code> mais uma linha em <code>docs/records/decisoes.jsonl</code>. Sucessão declarada nos dois textos e conferida por <code>scripts/check-adrs-sucessao.sh</code> (regra R5).", "analogy": "A ata da reunião: corrige-se com uma ata nova, nunca apagando a antiga."}, {"term": "Selo de confiança e lacuna (L-NN)", "id": "selo", "cat": "metodologia", "def": "🟢 confirmado com <code>arquivo:linha</code>; 🟡 planejado ou inferido; 🔴 lacuna. Cada lacuna vira uma linha L-NN com assunção e risco declarados.", "map": "Selo por requisito nas 12 specs e na matriz de rastreabilidade deste site. É a regra R1 em forma visível: afirmação factual só entra depois de executada, com a saída colada.", "analogy": "O selo de inspeção no extintor: sem data, não vale."}, {"term": "Jornada viva e gate humano", "id": "jornada", "cat": "metodologia", "def": "Jornada viva é a documentação de um fluxo com capturas geradas do build real por script versionado e avaliação heurística datada, no mesmo pull request. Gate humano é a aprovação indelegável do Product Steward.", "map": "Princípio P6 e skill <code>living-journey</code>. <code>docs/jornadas/</code> tem hoje apenas a convenção: sem build, jornada seria ficção.", "analogy": "A foto do prédio construído — não a maquete."}], "lede": "Os quinze termos que estruturam este projeto, definidos e mapeados ao uso real — agrupados em domínio (TOC), engenharia (APH, DDD, hexagonal) e metodologia (Maestro). A mesma linguagem ubíqua aparece na constituição, nas specs, no código, na interface e nos testes.", "callout": "<b>Barra:</b> nomenclatura alinhada ao <b>Atlassian Agile Coach + Product Guide</b> (hierarquia épico → feature → story, critérios de aceitação) e à linguagem ubíqua do Design Orientado a Domínio; clareza pela <b>régua Linear</b>. Regra local: sigla nunca nasce nua (princípio VIII do Maestro)."}, "workflow": {"lede": "O fluxo do método Maestro como este repositório o executa: <code>spec → plan (Constitution Check) → tasks → implement → DoD → revisão em contexto fresco → gate humano → merge</code>. Cada fase tem um <b>dono</b>, uma <b>métrica verificável</b>, critérios de entrada e de saída, e uma <b>aresta de falha</b> que diz a qual fase se volta e o que se refaz quando o portão fica vermelho.", "callout": "<b>Barra:</b> workflow julgado contra o <b>GitLab Product Handbook</b> (fonte única, portões explícitos, responsável nomeado por fase) e contra o modelo operacional instalado em <code>docs/governance/operating-model.md</code>, que é a norma de onde estas fases saem — não uma invenção deste site.", "phases": [{"n": 1, "title": "Spec", "icon": "📝", "owner": "Spec-agent · humano aprova", "goal": "Escrever a especificação que gera o código: o quê, por quê, requisitos em forma EARS, fontes com arquivo:linha, lacunas e dúvidas em aberto.", "entrada": ["Ciclo aberto com raia declarada (docs/roadmap.md)", "Módulo e épicos mapeados em docs/produto/modulos.md", "Apetite fixado — o tempo do ciclo é constante"], "saida": ["specs/NNN-slug/spec.md com as seções do ADR 0004", "RF / RI / RNF / RN / INT numerados e com selo", "## Fontes com F-NN (arquivo:linha) e ## Clarify com no máximo 5 dúvidas"], "metric": "scripts/check-specs.sh NNN verde; toda seção obrigatória presente; régua de prontidão (DoR) ≥ 80 pontos", "fail": {"to": 1, "action": "critério sem verificação executável, ou requisito sem fonte nem selo → reescrever a spec; nada de plano sobre spec vaga"}}, {"n": 2, "title": "Plan + Constitution Check", "icon": "🗺️", "owner": "plan-architect · Architect/Tech Lead humano aprova", "goal": "Decidir arquitetura do módulo e confrontar o plano com as duas constituições, linha a linha, antes de existir código.", "entrada": ["spec.md com o ## Clarify respondido ou o adiamento registrado", "ADRs que a spec consome ratificados"], "saida": ["plan.md com DUAS tabelas de Constitution Check (Maestro I–VIII e projeto P1–P7)", "Cinco artefatos condicionais declarados (research, data-model, contracts, checklist, ux-design) com justificativa", "Riscos GATE-<nome> ligados às lacunas L-NN da spec"], "metric": "scripts/check-specs.sh NNN acusa as duas tabelas, sem linha vazia; toda violação de princípio justificada por escrito ou removida", "fail": {"to": 1, "action": "princípio inegociável tocado sem alternativa → volta à Fase 1 para reduzir escopo, ou abre ADR novo que declare a decisão"}}, {"n": 3, "title": "Tasks", "icon": "🗂️", "owner": "plan-architect", "goal": "Decompor o plano em tarefas com dependência explícita e aceite que uma máquina consegue verificar.", "entrada": ["plan.md aprovado no gate humano do plano"], "saida": ["tasks.md com T-NN (Dep / Ref / Aceite executável)", "Cauda de fechamento não marcada: TAIL:review, TAIL:security, TAIL:mutation, TAIL:gate", "qa-report.md criado vazio, com a estrutura que a execução preenche"], "metric": "toda T-NN referencia um RF/RI/RNF e traz comando de aceite; a cauda existe e está desmarcada", "fail": {"to": 2, "action": "tarefa sem aceite executável ou sem referência → re-decompor o plano; se a ambiguidade for da spec, volta à Fase 1"}}, {"n": 4, "title": "Implement (TDD)", "icon": "🔨", "owner": "dev-implementer", "goal": "Implementar domínio puro primeiro, sempre com o teste que falha antes do código de produção (princípio P4).", "entrada": ["tasks.md aprovado", "Ciclo anterior promovido (dependência do roadmap)"], "saida": ["Teste vermelho no commit anterior ao verde", "Domínio e aplicação sem framework; efeito só por porta", "Traço OpenTelemetry, log correlacionado e métrica nascendo com a funcionalidade"], "metric": "import-linter verde na integração contínua (domínio não importa framework); suíte de domínio verde e sem rede", "fail": {"to": 3, "action": "quebrou o grafo de dependência das tarefas → re-decompor; se o requisito estiver errado, volta à Fase 1 — nunca se corrige requisito dentro do código"}}, {"n": 5, "title": "DoD", "icon": "✅", "owner": "qa-agent", "goal": "Provar, não declarar: cada função de aptidão executada, com a saída colada e o tamanho do que foi examinado.", "entrada": ["Implementação com a suíte verde localmente"], "saida": ["qa-report.md com comando, saída observada e código de saída por verificação", "Cobertura, mutação e portões locais (check-links, check-caminhos, encial, ciclo de migração (Alembic) e raio", "principios": "P3 (a porta de armazenamento é a forma hexagonal da", "path": "docs/adr/0002-stack-herdada-da-irma.md"}, {"n": "0003", "title": "Federação pelo Padrão APH: Nível 2 (Operador), <code>mode: embedded</code>, <code>app_id: toc</code>, identidade por introspecção, site distinto do hospedeiro", "status": "Aceita", "description": "1. Alvo de conformidade: Nível 2 (Operador) do padrão APH, lado aplicação do Anexo B — e a declaração de conformidade dirá sempre de qual lado e com que maturidade, porque o lado aplicação não tem suíte executável (ver consequência negativa). 2. <code>mode: embedded</code>: a aplicação roda em repositório, serviço e banco próprios e é embutida no shell do <code>ghdaru</code> por iframe. Nunca <code>internal</code> — <code>internal</code> es", "principios": "P2 (INEGOCIÁVEL) — este ADR (Architecture Decision Record,", "path": "docs/adr/0003-federacao-aph-nivel-2-embedded.md"}, {"n": "0004", "title": "Taxonomia de planejamento (Módulo ⊃ Épico ⊃ Feature ⊃ Story) e absorção da metodologia reversa sem instalar o framework", "status": "Aceita", "description": "1. Hierarquia: Módulo (M1–M8) ⊃ Épico (E\\&lt;m\\&gt;.\\&lt;n\\&gt;) ⊃ Feature (F\\&lt;m\\&gt;.\\&lt;n\\&gt;.\\&lt;k\\&gt;) ⊃ User Story (US-NN por módulo). O mapa de módulos vive em <code>docs/produto/modulos.md</code>; requisitos são numerados por spec (a numeração reinicia a cada spec, como no ECS). 2. Tipos de item, um por linha, na forma <code>SIGLA-NN: texto [fonte] selo</code>: RF (funcional, forma EARS: &quot;O SISTEMA DEVE …&quot; / *&quot;QUANDO \\&lt;gatilho\\&gt;, O SI", "principios": "P1 — a alternativa descartada (instalar o framework", "path": "docs/adr/0004-taxonomia-de-planejamento-e-absorcao-da-reversa.md"}, {"n": "0005", "title": "Escopo do domínio v1: processos de pensamento completos + focalização; DBR e contabilidade de ganho ficam fora", "status": "Aceita", "description": "1. Entram na v1 os processos de pensamento completos: Árvore da Realidade Atual (ARA) com validação formal de Efeitos Indesejáveis (UDEs), Nuvem de Conflito (NC) com premissas e injeções, Árvore da Realidade Futura (ARF), Árvore de Pré-Requisitos (APR), Árvore de Transição (AT) e Estratégia &amp; Táticas (S&amp;T) — módulos M1–M5 de <code>docs/produto/modulos.md</code>, incluindo o encadeamento entre ferramentas (UD", "principios": "nenhum", "path": "docs/adr/0005-escopo-do-dominio-v1.md"}, {"n": "0006", "title": "Base sintética desde o dia 1: nenhum dado real de pessoa em fixture, captura, spec ou exemplo", "status": "Aceita", "description": "1. Nenhum dado real de pessoa entra neste repositório — nem nome, nem enunciado de trabalho, nem data de desempenho, nem narrativa de conflito real — em fixture, captura de tela, spec, exemplo, teste ou documentação. A regra vale para dados da irmã, da linhagem TOC-Builder e de qualquer uso real da aplicação. 2. Toda base de exemplo é sintética e declaradamente fictícia: personas de papel (&quot;Facili", "principios": "P7 — o princípio fala de segredo técnico (chave,", "path": "docs/adr/0006-base-sintetica-desde-o-dia-1.md"}, {"n": "0007", "title": "Inteligência artificial somente pela fundação: sem SDK de provedor no produto, chave nunca no cliente, prompts versionados no servidor", "status": "Aceita", "description": "1. Nenhum SDK de provedor de modelo no produto — nem no cliente, nem no serviço. Zero dependência <code>@google/genai</code>, <code>openai</code>, <code>anthropic</code> ou equivalente nos manifestos de dependência desta aplicação. Função de aptidão: um grep de CI sobre <code>package.json</code>/<code>pyproject.toml</code> 🟡 PLANEJADO (ciclo 003). 2. Toda assistência de IA opera pela fundação, via catálogo de ações governadas (<code>toc.*</code>, ADR 0003): a ap", "principios": "P2 (INEGOCIÁVEL) — toda assistência passa pelo catálogo de", "path": "docs/adr/0007-ia-somente-pela-fundacao.md"}, {"n": "0008", "title": "Site de produto gerado por script versionado, nunca escrito à mão", "status": "Aceita", "description": "1. O site de produto é 100% gerado por script versionado neste repositório. Nenhuma página do site é editada à mão; mudança no site é mudança no gerador ou nas specs que ele lê. 2. O gerador é o <code>spec-to-code-docs</code> vendorizado em <code>tools/product-site/</code> 🟡 PLANEJADO (a vendorização é entrega deste ciclo 001), com atribuição à origem (<code>daruskills/spec-to-code-docs</code>) registrada no diretório vendorizado", "principios": "P6 — o site é rastreabilidade viva: uma projeção gerada das", "path": "docs/adr/0008-site-de-produto-gerado-por-script.md"}, {"n": "0009", "title": "A interface da aplicação decide proposta por <code>/toc/propostas</code>: mesma máquina de estados, mesmo traço, projeção estruturada", "status": "Aceita", "description": "1. A aceitação da geração assistida é a confirmação de uma proposta de ação, e nada mais. A tela não escreve no estado: ela cria a proposta no servidor (que nasce <code>proposed</code> e vai a <code>awaiting_approval</code>, porque a ação é <code>confirm</code>) e depois a confirma (<code>confirmed → executing → executed</code>). Quem escreve na Nuvem de Conflito é o executor do catálogo, depois da decisão, com traço correlacionado ao `prop", "principios": "P2 (INEGOCIÁVEL) — &quot;nada de segundo protocolo […] verbo", "path": "docs/adr/0009-superficie-de-proposta-para-a-interface-da-aplicacao.md"}, {"n": "0010", "title": "Trava otimista por versão lida: a escrita do agregado condiciona-se à versão que leu, e o perdedor recebe <code>409 VERSION_CONFLICT</code>", "status": "Aceita", "description": "1. O agregado guarda a versão que leu. <code>Projeto.versao_lida</code> (com <code>init=False</code>, <code>compare=False</code>, <code>repr=False</code>, como o contador <code>_profundidade_da_raiz</code>) é preenchido pelo adaptador ao reidratar e sincronizado por <code>Projeto.confirmar_gravacao()</code> depois do commit. <code>0</code> significa &quot;nunca foi gravado&quot;, e é ele que distingue inserção de atualização. Não é estado de negócio: é estado de sincronia com o repo", "principios": "P2 (INEGOCIÁVEL) — &quot;nada de segundo protocolo […] tela é", "path": "docs/adr/0010-trava-otimista-por-versao-lida.md"}, {"n": "0011", "title": "A confirmação de proposta é uma transição atômica no banco, e a <code>idempotency_key</code> deduplica de verdade", "status": "Aceita", "description": "1. A proposta passa a saber de que estado partiu. <code>PropostaDeAcao.estado_lido</code>, com <code>confirmar_gravacao()</code>, exatamente como <code>Projeto.versao_lida</code>. Não entra no construtor nem na comparação: é estado de sincronia com o repositório, não de negócio.", "principios": "P2 (INEGOCIÁVEL) — &quot;verbo mutador nasce <code>action_proposal</code>&quot;,", "path": "docs/adr/0011-trava-da-proposta-e-dedup-real-da-chave.md"}, {"n": "0012", "title": "O M4 nasce com o pacote de suficiência <b>extraído</b> e a referência cruzada como <b>agregado próprio</b>", "status": "Aceita", "description": "1. O pacote de suficiência causal é EXTRAÍDO, nunca copiado. O exame de elo, o conector E e as duas leituras saíram de <code>apps/api/src/toc_api/dominio/ara.py</code> para <code>apps/api/src/toc_api/dominio/suficiencia.py</code>, e a ARA e a ARF importam o mesmo objeto. A alternativa era duplicar as classes na ARF — mais rápido de escrever e indistinguível por um teste de comportamento no primeiro dia. Por isso a prov", "principios": "P2 (INEGOCIÁVEL) — as quatro ações <code>toc.*</code> do módulo nascem", "path": "docs/adr/0012-modulo-m4-suficiencia-compartilhada-e-referencia-como-agregado.md"}, {"n": "0013", "title": "A restrição tem taxonomia <b>fechada</b>, e uma decisão herdada &quot;mantida&quot; <b>volta à mesa</b> a cada recomeço", "status": "Aceita", "description": "### 1. <code>TipoDeRestricao</code> é um <code>enum</code> fechado de três valores", "principios": "P3 (as duas decisões são regra de domínio puro, testáveis", "path": "docs/adr/0013-taxonomia-fechada-da-restricao-e-heranca-que-volta-a-mesa.md"}, {"n": "0014", "title": "A categoria da linhagem é <b>portada como rótulo opcional</b>, e a transição de status da S&amp;T é <b>livre entre os quatro valores</b>", "status": "Aceita", "description": "### 1. <code>CategoriaDoPasso</code> é portada, como rótulo opcional de seis valores", "principios": "P3 (as duas decisões são regra de domínio puro —", "path": "docs/adr/0014-categoria-portada-e-transicao-de-status-livre-na-snt.md"}, {"n": "0015", "title": "A ação de catálogo é <b>declarada de uma ferramenta</b> e despacha pela <b>raiz dela</b>; a Árvore da Realidade Atual ganha as ações que a spec 005 já lhe prometia", "status": "Aceita", "description": "1. Toda ação do catálogo declara a ferramenta cuja raiz de agregado governa o projeto que ela toca. Campo novo <code>ferramenta</code> em <code>AcaoDoCatalogo</code> (o <code>ActionSpec</code> do §4.4 do Padrão APH). Invariante de domínio: ação <code>risk: confirm</code> sem <code>ferramenta</code> não entra no catálogo; o valor aceito é a genérica ou uma ferramenta cuja raiz se registrou em <code>registrar_raiz_de_ferramenta</code> — ferramenta que esquecer de ", "principios": "P2 (INEGOCIÁVEL) — a matéria é o catálogo <code>toc.*</code>, que é a", "path": "docs/adr/0015-acao-de-catalogo-pela-raiz-da-ferramenta.md"}], "principles": [{"id": "P1", "title": "Fronteira de escrita única", "hard": true, "d": "O agente escreve somente no repositório <code>GHDaru/toc-federada</code>. Os repositórios <code>GHDaru/maestro</code>, <code>GHDaru/protocolos</code>, <code>GHDaru/ghdaru</code>, <code>GHDaru/gestaodeprioridades</code>, a linhagem TOC-Builder e qualquer outro são fonte de leitura, nunca destino de escrita."}, {"id": "P2", "title": "Federada por contrato, nunca por atalho", "hard": true, "d": "Esta aplicação é a segunda aplicação candidata à federação da plataforma <code>ghdaru</code>. Pelo padrão APH — Aplicação ↔ Harness construímos para o Nível 2 (Operador) em repositório, serviço e banco próprios, <code>mode: embedded</code>, do lado aplicação do Anexo B — Federação (ADR 0003)."}, {"id": "P3", "title": "Domínio puro, efeitos na borda (DDD + Hexagonal)", "hard": false, "d": "Modelagem por Design Orientado a Domínio (DDD, do inglês Domain-Driven Design) sobre arquitetura hexagonal: domínio e aplicação puros (sem entrada e saída, sem framework, sem relógio); todo efeito entra por porta e é servido por adaptador na borda."}, {"id": "P4", "title": "Desenvolvimento guiado por teste (TDD)", "hard": false, "d": "Ciclo vermelho → verde → refatorar. Nenhuma linha de código de produção nasce sem um teste que falhe antes dela. Correção de defeito começa pelo teste que o reproduz."}, {"id": "P5", "title": "Observabilidade de nascença", "hard": false, "d": "Telemetria não é fase posterior. Toda funcionalidade nasce com:"}, {"id": "P6", "title": "Jornada viva com prova visual", "hard": false, "d": "Toda interface entrega jornada documentada no mesmo pull request: um documento por jornada, capturas de tela geradas do build real por script versionado (nunca coladas à mão) e avaliação heurística datada. Operacionalizado pela skill <code>living-journey</code>."}, {"id": "P7", "title": "Segredo nunca no cliente", "hard": true, "d": "Chave de provedor, credencial de banco, segredo de armazenamento e token de serviço vivem só no servidor, por variável de ambiente. Nunca no código, nunca no repositório, nunca no pacote entregue ao navegador."}], "metrics": [["Módulos (M1–M8)", "8"], ["Specs (ciclos 001–012)", "12"], ["ADRs", "15"], ["Princípios do projeto (P1–P7)", "7"], ["Requisitos funcionais (RF)", "359"], ["Requisitos de interface (RI)", "114"], ["Requisitos não funcionais (RNF)", "105"], ["Regras de negócio (RN)", "71"], ["Integrações (INT)", "61"], ["Total RF + RI + RNF", "578"], ["Fontes declaradas (F-NN)", "176"], ["Lacunas declaradas (L-NN)", "58"], ["Dúvidas em aberto (## Clarify)", "55" function renderOverview(c){
  const o = D.overview;
  const cards = o.cards.map(k=>`<div class="card"><p class="card-title">${k.title}</p><p class="muted" style="font-size:13.5px;margin:0">${k.content}</p></div>`).join("");
  const st = D.stack;
  const stackRows = Object.keys(st).filter(k=>st[k]).map(k=>`<dt>${k.charAt(0).toUpperCase()+k.slice(1)}</dt><dd>${st[k]}</dd>`).join("");
  c.innerHTML = `
    <p class="eyebrow">${o.eyebrow}</p>
    <h1>${o.title}</h1>
    <p class="lede">${o.lede}</p>
    <div class="callout">${o.callout}</div>
    <div class="grid grid-2">${cards}</div>
    <h2>Decisões estruturais vigentes</h2>
    <p class="muted" style="font-size:13.5px">Lidas de <code>docs/governance/constitution.md</code>. Trocar qualquer linha exige um ADR novo que suceda o anterior (regra R5).</p>
    <div class="card"><dl class="kv-wide">${stackRows}</dl></div>
    <p class="faint" style="font-size:12px">Gerado de: <code>${D.generated_from}</code></p>`;
}

function renderTaxonomy(c){
  const t = D.taxonomy;
  let html = "";
  for(const cat of t.categories){
    const terms = t.terms.filter(x=>x.cat===cat.key);
    html += `<h2 style="margin-top:36px">${cat.icon} ${cat.label} <span class="faint" style="font-size:13px;font-weight:400">— ${cat.hint} · ${terms.length} termos</span></h2>`;
    for(const x of terms){
      html += `<div class="term"><div class="term-head"><span class="term-name">${x.term}</span><span class="term-id">${x.id}</span></div><p class="term-def">${x.def}</p><p class="term-map">${x.map}</p><p class="faint" style="font-size:12px;margin:6px 0 0;font-style:italic">↳ ${x.analogy}</p></div>`;
    }
  }
  c.innerHTML = `<p class="eyebrow">Nomenclatura</p><h1>Taxonomia de produto</h1><p class="lede">${t.lede}</p><div class="callout">${t.callout}</div>${html}`;
}

function renderWorkflow(c){
  const w = D.workflow;
  const chk = items => items.map(i=>`<li class="chk"><span class="box">☐</span>${i}</li>`).join("");
  const phases = w.phases.map(p=>`<div class="card" style="margin-bottom:14px"><p class="card-title"><span style="font-size:18px">${p.icon}</span> Fase ${p.n} — ${p.title} <span class="pill muted" style="margin-left:auto">${p.owner}</span></p><p class="muted" style="font-size:14px;margin:0 0 14px">${p.goal}</p><div class="grid grid-2" style="margin-bottom:14px"><div><p class="slab">Entrada (critérios)</p><ul style="margin:0;padding:0">${chk(p.entrada)}</ul></div><div><p class="slab">Saída (verificável)</p><ul style="margin:0;padding:0">${chk(p.saida)}</ul></div></div><p style="font-size:13px;margin:0 0 10px"><span class="pill ok">Métrica</span> <span class="muted mono" style="font-size:12px">${p.metric}</span></p><div class="phase-fail"><span class="pill wip">Se gate vermelho</span> <span class="muted"> → volta à <b>Fase ${p.fail.to}</b>: ${p.fail.action}</span></div></div>`).join("");
  c.innerHTML = `<p class="eyebrow">Engenharia</p><h1>Workflow reproduzível</h1><p class="lede">${w.lede}</p><div class="callout">${w.callout}</div>${phases}`;
}

function renderAdrs(c){
  const rows = D.adrs.map(a=>`<div class="card"><p class="card-title">ADR ${a.n} <span class="pill ok">${a.status||""}</span></p><p style="font-size:13.5px;font-weight:650;margin:0 0 6px">${a.title||""}</p><p class="muted" style="font-size:12.5px;margin:0 0 8px;line-height:1.5">${a.description||""}</p><p class="faint" style="font-size:11.5px;margin:0"><b>Princípios tocados:</b> ${a.principios||"—"}</p><p class="faint" style="font-size:11px;margin:6px 0 0"><a href="../../${a.path}">${a.path}</a></p></div>`).join("");
  c.innerHTML = `<p class="eyebrow">Engenharia</p><h1>Registros de decisão (ADRs)</h1><p class="lede">Decisões datadas e imutáveis: corrigem-se com um ADR novo que declare a sucessão nos dois textos, nunca reescrevendo o antigo — e um <i>guard hook</i> recusa a reescrita. Todo ADR daqui declara os <b>princípios tocados</b>, com <code>nenhum</code> escrito por extenso quando for o caso.</p><div class="callout"><b>Barra:</b> formato herdado do corpus da irmã <b>gestaodeprioridades</b> — contexto, decisão numerada, <b>alternativas descartadas com número real executado</b>, consequências com pelo menos uma negativa, e "o que este ADR não decide".</div><div class="grid grid-2">${rows}</div>`;
}

function renderPrinciples(c){
  const rows = D.principles.map(p=>`<div class="card"><p class="card-title">${p.id} — ${p.title} ${p.hard?'<span class="pill wip">INEGOCIÁVEL</span>':'<span class="pill muted">negociável por ADR</span>'}</p><p class="muted" style="font-size:13px;margin:0">${p.d}</p></div>`).join("");
  c.innerHTML = `<p class="eyebrow">Engenharia</p><h1>Princípios do projeto (P1–P7)</h1><p class="lede">A constituição própria deste repositório, lida de <code>docs/governance/constitution.md</code>. Ela não substitui a constituição do método (princípios I–VIII do Maestro): as duas valem, e todo <code>plan.md</code> traz as <b>duas</b> tabelas de Constitution Check — um plano com só a primeira está incompleto.</p><div class="callout"><b>Barra:</b> um princípio só existe se algo o reprova. Cada P tem função de aptidão executável em <code>scripts/</code>; princípio sem portão é retórica.</div><div class="grid grid-2">${rows}</div>`;
}

function renderArtifacts(c){
  let html = `<p class="eyebrow">Engenharia</p><h1>Artefatos</h1><p class="lede">O que este repositório carrega além das specs: as skills que comandam o comportamento dos agentes, os portões executáveis e as jornadas vivas.</p><div class="callout"><b>Barra:</b> um artefato só existe se for insumo consumido com função forçante (princípio VI do Maestro). Documento que ninguém lê e nenhum portão confere é peso morto, e sai.</div>`;
  if(D.skills.length){ html += `<h2>Skills (${D.skills.length})</h2><div class="grid grid-2">` + D.skills.map(s=>`<div class="card"><p class="card-title">${s.name}</p><p class="muted" style="font-size:12.5px;margin:0">${s.description}</p><p class="faint" style="font-size:11px;margin:6px 0 0"><a href="../../${s.path}">${s.path}</a></p></div>`).join("") + `</div>`; }
  if(D.scripts.length){ html += `<h2>Portões executáveis (${D.scripts.length})</h2><div class="grid grid-2">` + D.scripts.map(s=>`<div class="card"><p class="card-title"><code>${s.name}</code> <span class="pill muted" style="margin-left:auto">${s.type}</span></p><p class="muted" style="font-size:12.5px;margin:0">${s.description||"—"}</p></div>`).join("") + `</div>`; }
  html += `<h2>Jornadas vivas (${D.journeys.length})</h2>`;
  if(D.journeys.length){ html += D.journeys.map(j=>`<div class="card"><p class="card-title">${j.name}</p><p class="muted" style="font-size:13px;margin:0">${j.steps} passos</p></div>`).join(""); }
  else { html += `<div class="callout"><b>Zero — e é decisão, não atraso.</b> ${D.journeys_note}</div>`; }
  c.innerHTML = html;
}

function renderCodigo(c){
  const cb = D.codebase || {};
  const n = D.counts || {};
  const prod = cb.producao || {}, tst = cb.testes || {};
  const cel = (v,k,s)=>`<div class="mcell"><div class="mv">${v}</div><div class="mk">${k}</div><div class="faint" style="font-size:10px;margin-top:2px">${s||""}</div></div>`;
  const topo = `<div class="mgrid" style="grid-template-columns:repeat(5,1fr)">
    ${cel(prod.linhas||0,"linhas de produção",(prod.arquivos||0)+" arquivos")}
    ${cel(tst.casos||0,"casos de teste escritos",(tst.arquivos||0)+" arquivos")}
    ${cel((cb.rotas||[]).length,"rotas HTTP","= operações do OpenAPI")}
    ${cel((cb.migracoes||[]).length,"migrações Alembic",(cb.tabelas||0)+" tabelas")}
    ${cel((n.modulos_com_codigo||0)+"/"+(n.modules||0),"módulos com código","mapa declarado")}
  </div>`;

  const linhaCamada = x=>`<tr><td><b>${x.nome}</b><div class="faint" style="font-size:11.5px">${x.papel}</div></td><td class="mono">${x.prefixo}</td><td class="num">${x.arquivos}</td><td class="num">${x.linhas}</td></tr>`;
  const tabela = (titulo, linhas, cabecalho) => `<h3>${titulo}</h3><div class="tblwrap"><table class="tbl"><thead><tr>${cabecalho}</tr></thead><tbody>${linhas}</tbody></table></div>`;

  const camadas = tabela("Serviço — <code>apps/api</code>", (cb.camadas_api||[]).map(linhaCamada).join(""),
    "<th>Camada</th><th>Caminho</th><th class='num'>Arquivos</th><th class='num'>Linhas</th>");
  const web = tabela("Interface — <code>apps/web</code>", (cb.camadas_web||[]).map(linhaCamada).join(""),
    "<th>Pasta</th><th>Caminho</th><th class='num'>Arquivos</th><th class='num'>Linhas</th>");

  const suites = tabela("Suítes de teste", (cb.suites||[]).map(s=>`<tr><td><b>${s.nome}</b><div class="faint" style="font-size:11.5px">${s.papel}</div></td><td class="mono">${s.prefixo}</td><td class="num">${s.arquivos}</td><td class="num">${s.casos}</td></tr>`).join(""),
    "<th>Suíte</th><th>Caminho</th><th class='num'>Arquivos</th><th class='num'>Casos escritos</th>");

  const mods = tabela("Código por módulo (M1–M8)", Object.keys(cb.modulos||{}).sort().map(k=>{
      const m = cb.modulos[k];
      return `<tr><td><b>${k}</b></td><td class="num">${m.arquivos}</td><td class="num">${m.linhas}</td><td class="num">${m.api}</td><td class="num">${m.web}</td></tr>`;
    }).join(""),
    "<th>Módulo</th><th class='num'>Arquivos</th><th class='num'>Linhas</th><th class='num'>apps/api</th><th class='num'>apps/web</th>");

  const migr = tabela("Migrações (nunca <code>create_all</code>)", (cb.migracoes||[]).map(m=>`<tr><td class="mono">${m.id}</td><td>${m.nome}</td><td class="mono">${m.anterior||"—"}</td></tr>`).join(""),
    "<th>Revisão</th><th>Arquivo</th><th>Anterior</th>");

  const porMetodo = cb.rotas_por_metodo||{};
  const rotasResumo = Object.keys(porMetodo).map(k=>`<span class="pill muted">${k} ${porMetodo[k]}</span>`).join(" ");
  const rotas = tabela(`Rotas publicadas (${(cb.rotas||[]).length}) ${rotasResumo}`,
    (cb.rotas||[]).map(r=>`<tr><td class="mono"><b>${r.metodo}</b></td><td class="mono">${r.caminho}</td><td class="faint mono" style="font-size:11px">${r.arquivo}</td></tr>`).join(""),
    "<th>Método</th><th>Caminho</th><th>Arquivo</th>");

  const naoAtrib = (cb.nao_atribuidos||[]);
  const sobra = naoAtrib.length ? `<div class="callout warn" style="margin-top:18px"><b>Não atribuídos a módulo nenhum: ${naoAtrib.length}.</b> São os arquivos de amarração que não pertencem a uma ferramenta — <code>__init__.py</code> de pacote, declaração de ambiente do Vite, configuração de teste. Estão aqui em vez de sumirem no arredondamento: ${naoAtrib.map(x=>`<code>${x}</code>`).join(" · ")}</div>` : "";

  c.innerHTML = `<p class="eyebrow">Engenharia</p><h1>Código</h1>
  <p class="lede">O que existe hoje em <code>apps/api</code> e <code>apps/web</code>, contado pelo gerador ao ler os arquivos — nenhum número digitado. A atribuição de arquivo a módulo é um <b>mapa declarado</b> em <code>tools/product-site/generate.py</code> (<code>_MAPA_DE_CODIGO</code>); o que não casa nenhum padrão aparece ao pé da página, em vez de sumir.</p>
  <div class="callout"><b>Barra:</b> o gerador conta o que está <b>escrito</b>, nunca o que passou. "1514 casos escritos" não é "1514 testes verdes": quem prova execução é o <code>qa-report.md</code> do ciclo, com a saída colada e o código de saída (regra R1). E <code>it.each</code> conta como <b>uma</b> declaração aqui e vira N casos na execução — por isso o número do site e o do relatório do executor não têm de bater.</div>
  ${topo}${camadas}${web}${suites}${mods}${migr}${rotas}${sobra}
  <p class="faint" style="font-size:12px;margin-top:18px">${cb.nota||""}</p>`;
}

function renderMetrics(c){
  const rows = D.metrics.map(([k,v])=>`<dt>${k}</dt><dd><strong>${v}</strong></dd>`).join("");
  c.innerHTML = `<p class="eyebrow">Métricas</p><h1>Estado quantificado</h1><p class="lede">Todos os números desta página são <b>contados pelo gerador</b> ao ler o repositório — nenhum é digitado à mão. Reexecutar <code>tools/product-site/generate.py</code> reproduz esta tabela ou o site diverge do commitado, que é o portão do ciclo 012.</p><div class="callout"><b>Barra:</b> regra R1 do projeto — número só entra em documento depois de executado, com a saída colada. As linhas de código, teste, rota e migração vêm da varredura de <code>apps/api</code> e <code>apps/web</code>; o detalhe por camada está em <a href="#codigo">Código</a>.</div><div class="card"><dl class="kv-wide">${rows}</dl></div>`;
}

go(location.hash.slice(1)||"overview");
</script>
</body>
</html>
