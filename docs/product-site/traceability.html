<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOC Federada — Rastreabilidade</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>

/* Cores próprias dos dois grupos novos (RN, INT) e das lacunas. Ficam aqui, e não no
   `templates/styles.css`, porque aquele arquivo é a régua de design mantida byte a byte
   idêntica à origem. Ao contrário de --green/--amber/--blue, estes tokens têm variante
   escura, para que RN e INT não fiquem ilegíveis no tema escuro. */
:root{--rn-c:#7c3aed;--int-c:#b45309;--lac-c:#c0392b}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --rn-c:#a78bfa;--int-c:#f0b429;--lac-c:#f87171} }
[data-theme="dark"]{--rn-c:#a78bfa;--int-c:#f0b429;--lac-c:#f87171}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.grid-3{grid-template-columns:1fr}}
.pill.rf{background:rgba(91,91,214,.12);color:var(--accent)}
.pill.ri{background:rgba(15,118,110,.14);color:#0f766e}
.pill.rnf{background:rgba(43,108,176,.12);color:var(--blue)}
.pill.rn{background:rgba(124,58,237,.13);color:var(--rn-c)}
.pill.int{background:rgba(180,83,9,.13);color:var(--int-c)}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;text-align:center}
.stat-tile .num{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.stat-tile .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.req-row{display:grid;grid-template-columns:74px 1fr 132px;gap:8px 12px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.req-row:last-child{border-bottom:none}
.req-row .req-id{font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.req-row.ri .req-id{color:#0f766e}
.req-row.rnf .req-id{color:var(--blue)}
.req-row.rn .req-id{color:var(--rn-c)}
.req-row.int .req-id{color:var(--int-c)}
.req-row.lac .req-id{color:var(--lac-c)}
.req-row .req-desc{color:var(--ink);line-height:1.45}
.req-row .req-group{display:block;font-size:10.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.req-row .req-src{font-size:10.5px;color:var(--faint);font-family:var(--font-mono);text-align:right;white-space:normal}
.req-row .req-src a,.req-row .req-src span.ext{color:var(--faint);text-decoration:none;border-bottom:1px dotted var(--border-strong);cursor:help}
.req-row .req-src a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.st-pill{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.02em;vertical-align:middle;margin-right:3px}
.st-pill.ok{background:rgba(26,122,76,.15);color:var(--green)}
.st-pill.wip{background:rgba(176,107,0,.15);color:var(--amber)}
.st-pill.na{background:var(--surface-2);color:var(--faint)}
.fwd-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0 10px;font-size:11px}
.fwd-label{color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
.fwd-link{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);text-decoration:none;white-space:nowrap}
.fwd-link:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.fwd-link.todo{color:var(--faint);border-style:dashed}
.fwd-link.pending{color:var(--amber)}
.fwd-arrow{color:var(--faint);font-size:10px}
.fwd-ac{font-size:11px;color:var(--muted);font-style:italic;margin-left:8px}
.module-section{margin-bottom:36px}
.module-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.module-header .m-id{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:7px}
.module-header .m-name{font-size:18px;font-weight:700;letter-spacing:-.01em}
.module-header .m-links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.module-header .m-links a{font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
.source-list{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.9}
.source-list .src-tag{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;margin-right:6px;display:inline-block;margin-bottom:2px;color:var(--muted);text-decoration:none;cursor:help}
.source-list .src-tag:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.req-table{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.req-table .rt-head{display:grid;grid-template-columns:74px 1fr 132px;gap:10px 14px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.req-table .rt-head .rt-src{text-align:right}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-chip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted);font-family:inherit}
.filter-chip:hover{border-color:var(--accent);color:var(--ink)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-box{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;font-family:inherit;margin-bottom:16px}
.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* ── Lacunas declaradas (L-NN) ── */
.lac-table{border-left:3px solid var(--lac-c)}
.lac-table .rt-head{color:var(--lac-c)}
.req-row.lac .req-desc{line-height:1.5}
.lac-where{display:block;font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.04em;margin-bottom:3px;font-family:var(--font-mono)}
.lac-where a{color:var(--faint);border-bottom:1px dotted var(--border-strong)}
.lac-where a:hover{color:var(--accent);text-decoration:none;border-bottom-color:var(--accent)}
.lac-ev{margin-top:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--muted)}
.lac-ev-lbl{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-right:7px}
.lac-src{margin-top:6px;font-size:10.5px;color:var(--faint);font-family:var(--font-mono)}
.lac-empty{font-size:12.5px;color:var(--muted);padding:10px 2px 4px;line-height:1.5}
.risk-pill{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.risk-pill.risk-hi{background:rgba(192,57,43,.15);color:var(--lac-c)}
.risk-pill.risk-mid{background:rgba(176,107,0,.16);color:var(--amber)}
.risk-pill.risk-lo{background:rgba(26,122,76,.14);color:var(--green)}
.risk-pill.risk-na{background:var(--surface-2);color:var(--faint)}
.lac-panel{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--lac-c);border-radius:10px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:28px}
.lac-panel h3{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.lac-panel .lac-lede{font-size:13px;color:var(--muted);margin:0 0 14px;max-width:78ch;line-height:1.55}
.lac-bars{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lac-bar{flex:1 1 150px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.lac-bar .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
.lac-bar .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-top:1px}
.lac-bar.hi .n{color:var(--lac-c)} .lac-bar.mid .n{color:var(--amber)} .lac-bar.lo .n{color:var(--green)}
.lac-top{list-style:none;padding:0;margin:0 0 12px}
.lac-top li{font-size:13px;color:var(--ink);padding:8px 0;border-top:1px solid var(--border);line-height:1.5}
.lac-top li .tag{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--lac-c);margin-right:8px}

</style>
</head>

<script>

<script>
const D = {"modules": [{"id": "001", "name": "Fundação e planejamento (ciclo documental)", "specNum": "001", "specPath": "specs/001-fundacao-e-planejamento/spec.md", "modules": [], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE apresentar no <code>CLAUDE.md</code>, antes do bloco instalado do método, a identidade do produto, a ordem de leitura das duas constituições, o resumo P1–P7, as regras R1–R5 herdadas, a stack e a nota de base sintética — preservando intacto o bloco <code>## Method: Maestro</code> gerado pelo instalador", "s": "F-05, F-06", "seal": "🟡", "group": "Identidade e governança"}, {"id": "RF-02", "d": "O SISTEMA DEVE ter constituição de projeto versionada (v1.0.0) com exatamente sete princípios <code>P1.</code>–<code>P7.</code>, marcando como INEGOCIÁVEL a fronteira de escrita, a federação por contrato e o segredo fora do cliente, e declarando o alcance do P2 no próprio texto", "s": "F-02, F-03, F-04", "seal": "🟡", "group": "Identidade e governança"}, {"id": "RF-03", "d": "O SISTEMA DEVE ter a convenção de mensagens externas (<code>mensagens/README.md</code>) com o formato <code>NNN-para-&lt;repo&gt;-&lt;assunto&gt;.md</code>, para que o P1 tenha caminho de saída que não seja o chat", "s": "", "seal": "🟡", "group": "Identidade e governança"}, {"id": "RF-04", "d": "O SISTEMA DEVE ter licença MIT (copyright 2026 GHDaru) e avisos de terceiros cobrindo o método Maestro, a taxonomia absorvida de <code>sandeco/reversa</code> e o gerador do site de <code>GHDaru/daruskills</code>", "s": "", "seal": "🟡", "group": "Identidade e governança"}, {"id": "RF-05", "d": "Toda decisão estrutural desta fundação DEVE existir como ADR — 0001 a 0008 — com Status/Data/Ciclo/Decisor, campo &quot;Princípios tocados&quot; (com <code>nenhum</code> por extenso quando for o caso), alternativas descartadas com número executado (R1), ao menos uma consequência negativa e a seção &quot;O que este ADR NÃO decide&quot;", "s": "", "seal": "🟡", "group": "Registro de decisões"}, {"id": "RF-06", "d": "QUANDO um ADR for aceito, O SISTEMA DEVE tê-lo no índice <code>docs/adr/README.md</code> e no índice <code>docs/records/decisoes.jsonl</code> (via <code>scripts/record-decision.sh</code>, nunca à mão)", "s": "", "seal": "🟡", "group": "Registro de decisões"}, {"id": "RF-07", "d": "O SISTEMA DEVE registrar em <code>docs/produto/visao.md</code> o que o produto é, extraído da linhagem com evidência por <code>arquivo:linha</code>, incluindo os defeitos que os princípios existem para impedir", "s": "F-01", "seal": "🟡", "group": "Produto e planejamento"}, {"id": "RF-08", "d": "O SISTEMA DEVE mapear os oito módulos M1–M8 em <code>docs/produto/modulos.md</code>, cada um com bounded context e origem (linhagem 🟢, planejado 🟡, lacuna 🔴)", "s": "", "seal": "🟡", "group": "Produto e planejamento"}, {"id": "RF-09", "d": "O SISTEMA DEVE declarar em <code>docs/roadmap.md</code> os ciclos 001–012, com raia, entrega, portões por ciclo e a seção &quot;O que o ciclo NNN não pode começar sem&quot; — nenhum código de produção antes do ciclo 004", "s": "", "seal": "🟡", "group": "Produto e planejamento"}, {"id": "RF-10", "d": "O SISTEMA DEVE ter as doze pastas <code>specs/001</code> a <code>specs/012</code>, cada uma com <code>spec.md</code>, <code>plan.md</code>, <code>tasks.md</code> e <code>qa-report.md</code>; as specs de módulo seguem o formato do brief §7 (taxonomia Módulo⊃Épico⊃Feature⊃Story, famílias RF/RI/RNF/RN/INT/F/L, EARS, selos, Clarify ≤ 5) e todo plano carrega duas tabelas de Constitution Check", "s": "", "seal": "🟡", "group": "Produto e planejamento"}, {"id": "RF-11", "d": "O SISTEMA DEVE ter os portões deste projeto executáveis e não lenientes: <code>scripts/check-caminhos.sh</code> (regra R4 — caminho citado entre crases existe), <code>scripts/check-adrs-sucessao.sh</code> (regra R5 — sucessão declarada nos dois ADRs + índices) e <code>scripts/check-specs.sh</code> (régua DoR ≥ 80)", "s": "", "seal": "🟡", "group": "Portões e site"}, {"id": "RF-12", "d": "O SISTEMA DEVE gerar <code>docs/product-site/</code> exclusivamente pelo gerador vendorizado em <code>tools/product-site/</code> (ADR 0008) — nunca HTML escrito à mão — com navegação por módulos, rastreabilidade e roadmap", "s": "", "seal": "🟡", "group": "Portões e site"}], "ris": [], "rnfs": [{"id": "RNF-01", "d": "Toda a documentação do projeto DEVE estar em português; a superfície instalável do Maestro permanece em inglês e intocada", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "Em cada documento, a primeira ocorrência de cada sigla DEVE vir por extenso (Princípio VIII do método)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Nenhum arquivo DEVE conter dado real de pessoa; toda persona e toda base de exemplo é sintética (ADR 0006), o que mantém o repositório apto a ser aberto", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "Todo caminho relativo citado DEVE resolver — verificado por <code>scripts/check-links.sh</code> e <code>scripts/check-caminhos.sh</code> (a segunda cobre o que a primeira apaga: caminhos entre crases)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Todo número afirmado em documento DEVE ter sido executado, com a saída colada (regra R1)", "s": "", "seal": "🟡", "group": ""}], "rns": [], "ints": [], "sources": [{"tag": "F-01", "path": "/home/user/tocbuilderv3/services/geminiService.ts", "rel": "/home/user/tocbuilderv3/services/geminiService.ts", "lines": "16", "desc": "`const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });` — a violação canônica de segredo no cliente; fundamenta P7 e o ADR 0007.", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/geminiService.ts:16 — const ai = new GoogleGenAI({ apiKey: process.env.API_KEY }); — a violação canônica de segredo no cliente; fundamenta P7 e o ADR 0007."}, {"tag": "F-02", "path": "/home/user/protocolos/padrao/padrao-aph.md", "rel": "/home/user/protocolos/padrao/padrao-aph.md", "lines": "53", "desc": "`| **Nível 2** | Operador | age sobre a aplicação com governança | ...` — o nível-alvo da federação (ADR 0003).", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/padrao-aph.md:53 — | Nível 2 | Operador | age sobre a aplicação com governança | ... — o nível-alvo da federação (ADR 0003)."}, {"tag": "F-03", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "107", "desc": "o manifesto declara **modo de integração** `internal`/`embedded`/`headless`, sem números — fundamenta `mode: embedded`.", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:107 — o manifesto declara modo de integração internal/embedded/headless, sem números — fundamenta mode: embedded."}, {"tag": "F-04", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "111", "desc": "`endpoints.validate_token` → **`endpoints.introspect`** — fundamenta identidade por introspecção, nunca validação booleana.", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:111 — endpoints.validate_token → endpoints.introspect — fundamenta identidade por introspecção, nunca validação booleana."}, {"tag": "F-05", "path": "", "rel": "", "lines": "", "desc": "`/home/user/gestaodeprioridades/CLAUDE.md:48` (R1) a `:84` (R5) — as cinco regras de retrospectiva herdadas pelo ADR 0001.", "seal": "🟢", "internal": false, "t": " — /home/user/gestaodeprioridades/CLAUDE.md:48 (R1) a :84 (R5) — as cinco regras de retrospectiva herdadas pelo ADR 0001."}, {"tag": "F-06", "path": "", "rel": "", "lines": "", "desc": "saída de `scripts/check-install.sh` neste repositório, 2026-09-03 — `✓ method installed and coherent: layers present, AI instructed, every skill visible.` — código de saída 0.", "seal": "🟢", "internal": false, "t": " — saída de scripts/check-install.sh neste repositório, 2026-09-03 — ✓ method installed and coherent: layers present, AI instructed, every skill visible. — código de saída 0."}], "chain": [{"label": "spec.md", "href": "specs/001-fundacao-e-planejamento/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/001-fundacao-e-planejamento/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/001-fundacao-e-planejamento/tasks.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/001-fundacao-e-planejamento/qa-report.md", "state": "pending"}, {"label": "código do ciclo 001", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "A fundação ainda não embarcou nenhuma aplicação federada de ponta a ponta (a irmã relatou bloqueio nos schemas de manifesto em <code>mensagens/005</code> de lá) — assunção: o embarque real acontece no ciclo 003 contra a ghdaru real, e o roadmap o trata como a aptidão mais importante (&quot;a junta fecha&quot;) — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-02", "d": "O lado aplicação do APH Nível 2 não tem suíte de conformidade executável (a norma o declara: <code>padrao-aph.md:17</code>) — assunção: nossa conformidade será autodeclaração auditável por matriz de aderência (ciclo 012), dita como tal — risco médio.", "risco": "médio", "cmds": [], "paths": ["<code>padrao-aph.md:17</code>"], "s": ""}, {"id": "L-03", "d": "ARF, AT e S&amp;T nunca foram entregues em nenhuma geração da linhagem: não há implementação de referência a extrair, só as skills de domínio e a literatura TOC — assunção: as specs de M4/M5 nascem 🟡 PLANEJADO com regras de negócio derivadas da literatura, validadas pela Facilitadora TOC sintética nas jornadas — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}]}, {"id": "002", "name": "Protótipo de interfaces (ciclo planejado)", "specNum": "002", "specPath": "specs/002-prototipo-de-interfaces/spec.md", "modules": [], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE entregar <code>ux-design.md</code> declarando, para cada objeto de tela, o papel semântico, os estados obrigatórios e o <code>ai_visible</code> — com padrão não visível e justificativa escrita em cada <code>sim</code> — antes de qualquer componente existir", "s": "", "seal": "🟡", "group": "Semântica e prova"}, {"id": "RF-02", "d": "O SISTEMA DEVE entregar um protótipo navegável que satisfaça as quatro condições cumulativas do protótipo descartável: fora do diretório da aplicação (em <code>prototipo/</code>), sem regra de domínio, sem persistência de dado real nem fala com a fundação, apagado ou reescrito no round implementado", "s": "F-01", "seal": "🟡", "group": "Semântica e prova"}, {"id": "RF-03", "d": "QUANDO o protótipo estiver construído, O SISTEMA DEVE gerar as capturas a partir do build real do protótipo, por script versionado — nunca coladas à mão (P6); rodar o script de novo sobre o mesmo build DEVE regenerar as imagens byte-idênticas", "s": "", "seal": "🟡", "group": "Semântica e prova"}, {"id": "RF-04", "d": "O SISTEMA DEVE entregar um documento por jornada prototipada, com avaliação heurística datada, e nenhuma captura órfã — toda imagem citada por exatamente uma jornada (aptidão do round 002)", "s": "", "seal": "🟡", "group": "Semântica e prova"}, {"id": "RF-05", "d": "O SISTEMA DEVE atualizar <code>docs/jornadas/README.md</code> marcando quais jornadas planejadas (J-01..J-06) ganharam versão de protótipo — sem promovê-las a jornada viva, que exige build de produção", "s": "", "seal": "🟡", "group": "Semântica e prova"}, {"id": "RF-06", "d": "O SISTEMA DEVE carregar o protótipo exclusivamente de fixture sintética versionada (personas fictícias, &quot;Instituição Horizonte&quot;) — nenhum dado real de pessoa (ADR 0006)", "s": "", "seal": "🟡", "group": "Conteúdo prototipado"}, {"id": "RF-07", "d": "O SISTEMA DEVE prototipar as telas de M1–M3: lista de projetos, canvas com vista tabular, ARA com UDEs e estado de validação, NC com cinco entidades, sete premissas e uma injeção — e nada dos módulos M4–M6 (rounds 008–010)", "s": "", "seal": "🟡", "group": "Conteúdo prototipado"}, {"id": "RF-08", "d": "QUANDO a mesma tela existir em modo autônomo e em modo embarcado, O SISTEMA DEVE demonstrá-la nas duas larguras — mesa e iframe estreito — com os mesmos dados", "s": "", "seal": "🟡", "group": "Conteúdo prototipado"}, {"id": "RF-09", "d": "O SISTEMA DEVE consumir identidade de exibição e tema por adaptador falso que devolva o envelope do handshake conforme o guia da fundação, para que a troca pelo ambiente real no ciclo 003 seja configuração, não reescrita", "s": "F-05", "seal": "🟡", "group": "Conteúdo prototipado"}], "ris": [{"id": "RI-01", "d": "O canvas DEVE permitir criar, mover, editar e excluir nós por manipulação direta, e desenhar arestas causais entre eles — a forma que a linhagem provou", "s": "F-02", "seal": "🟡", "group": "Canvas (E1.2)"}, {"id": "RI-02", "d": "Toda aresta causal DEVE ser lida como &quot;se causa, então efeito&quot;: direcionada, com a seleção revelando origem e destino", "s": "", "seal": "🟡", "group": "Canvas (E1.2)"}, {"id": "RI-03", "d": "O canvas DEVE degradar com dignidade em iframe estreito — largura de referência 420px, herdada da prova da irmã até medição própria no ciclo 003 (L-01): navegação por pan/zoom no lugar de barra de rolagem dupla, ações primárias alcançáveis", "s": "F-06", "seal": "🟡", "group": "Canvas (E1.2)"}, {"id": "RI-04", "d": "A vista tabular DEVE projetar os mesmos nós e arestas do canvas como linhas de edição rápida — o &quot;Painel de Entidades&quot; que a linhagem acertou — sem ser uma segunda fonte de verdade", "s": "F-02", "seal": "🟡", "group": "Vista tabular equivalente (E1.3)"}, {"id": "RI-05", "d": "A alternância canvas ⇄ vista tabular DEVE preservar seleção e edição em curso da sessão; no iframe estreito, a vista tabular é a projeção primária", "s": "", "seal": "🟡", "group": "Vista tabular equivalente (E1.3)"}, {"id": "RI-06", "d": "A aplicação DEVE ter tema próprio claro e escuro como conjuntos de variáveis CSS (tokens) — o padrão e a identidade em modo autônomo. A linhagem não tem tema algum para herdar: a medição deu zero ocorrências, então este requisito nasce sem referência, por decisão", "s": "F-07", "seal": "🟡", "group": "Tema claro/escuro herdado do hospedeiro, com fallback"}, {"id": "RI-07", "d": "QUANDO embarcada, a aplicação DEVE aplicar os <code>theme.tokens</code> recebidos do hospedeiro por cima do tema próprio; o conjunto é parcial por design e o fallback próprio cobre obrigatoriamente todo token ausente. 🟢 na norma, 🟡 no protótipo", "s": "F-04", "seal": "", "group": "Tema claro/escuro herdado do hospedeiro, com fallback"}, {"id": "RI-08", "d": "A escolha claro/escuro DEVE seguir o hospedeiro quando embarcada e a preferência do sistema quando autônoma — nunca um seletor próprio que brigue com o de quem hospeda", "s": "", "seal": "🟡", "group": "Tema claro/escuro herdado do hospedeiro, com fallback"}, {"id": "RI-09", "d": "Embarcada, a aplicação DEVE renderizar apenas o conteúdo: sem cabeçalho de navegação próprio, menu global, rodapé ou seletor de inquilino — quem navega é o hospedeiro. 🟢 na norma, 🟡 no protótipo", "s": "F-05, F-09", "seal": "", "group": "Modo embarcado só-conteúdo"}, {"id": "RI-10", "d": "O protótipo DEVE demonstrar o modo só-conteúdo dentro de um iframe real (casca de hospedeiro simulada localmente), não apenas como página estreita", "s": "", "seal": "🟡", "group": "Modo embarcado só-conteúdo"}, {"id": "RI-11", "d": "A tela da ARA DEVE mostrar cada UDE com seu estado de validação formal — válida, pendente ou recusada — com os estados vindos da fixture, nunca de cálculo do protótipo (condição 2 de)", "s": "F-01", "seal": "🟡", "group": "ARA e NC (M2, M3)"}, {"id": "RI-12", "d": "A tela da NC DEVE posicionar as cinco entidades (A, B, C, D, D′) na forma canônica e dar acesso às premissas por cada uma das sete arestas; uma injeção DEVE aparecer ligada à premissa que invalida", "s": "F-03", "seal": "🟡", "group": "ARA e NC (M2, M3)"}, {"id": "RI-13", "d": "A visão conflito+solução (E3.4, os dois diagramas lado a lado) é prototipada se o apetite couber — é o &quot;sai primeiro&quot; declarado do round 002; cortá-la não reprova o ciclo, escondê-la sim", "s": "", "seal": "🟡", "group": "ARA e NC (M2, M3)"}, {"id": "RI-14", "d": "As ações primárias DEVEM ser alcançáveis por teclado com foco visível, e o contraste dos dois temas DEVE passar o mínimo do checklist de interface — protótipo inacessível valida a forma errada", "s": "", "seal": "🟡", "group": "Acessibilidade mínima do protótipo"}], "rnfs": [{"id": "RNF-01", "d": "Nenhum dado real de pessoa em fixture, captura, jornada ou exemplo — base sintética integral (ADR 0006), verificável por inspeção da fixture e grep de nomes", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "Nenhum segredo no cliente e nenhuma chamada a provedor de modelo a partir do navegador (P7; ADR 0007) — a violação canônica que isto proíbe está em", "s": "F-08", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "As capturas DEVEM ser determinísticas: dados fixos, relógio congelado no build de captura, mesma viewport — é o que torna &quot;regenera byte-idêntica&quot; possível", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "O protótipo DEVE ser leve o bastante para buildar e capturar em máquina local sem serviço externo — sem banco, sem rede, sem fila", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Interface do protótipo em português (língua-fonte da linguagem ubíqua); a internacionalização real é E8.3, ciclo 011", "s": "", "seal": "🟡", "group": ""}], "rns": [], "ints": [{"id": "INT-01", "d": "Nenhuma integração real neste ciclo. Identidade de exibição, tema e handshake vêm de adaptador falso que devolve o envelope <code>ghd.handshake</code> no formato do guia da fundação — mesmo corpo, origem local. A troca pelo hospedeiro real é o ciclo 003", "s": "F-05", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "Nada de introspecção, manifesto, catálogo <code>toc.*</code> ou <code>action_proposal</code> — ciclos 003 e 006. O protótipo não mostra o ciclo propor → confirmar → executar porque o catálogo que o governa ainda não tem spec executada (L-03); a irmã prototipou o dela no ciclo equivalente porque o catálogo dela nascia no mesmo ciclo — o nosso nasce no 006", "s": "", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/gestaodeprioridades/docs/adr/0005-codigo-de-producao-versus-prototipo.md", "rel": "/home/user/gestaodeprioridades/docs/adr/0005-codigo-de-producao-versus-prototipo.md", "lines": "29-34", "desc": "as quatro condições cumulativas do protótipo descartável (\"vive em `prototipo/` … não implementa regra de domínio … não persiste dado real … é apagado ou reescrito\") — a fronteira herdada que o RF-02 executa.", "seal": "🟢", "internal": false, "t": "/home/user/gestaodeprioridades/docs/adr/0005-codigo-de-producao-versus-prototipo.md:29-34 — as quatro condições cumulativas do protótipo descartável (&quot;vive em prototipo/ … não implementa regra de domínio … não persiste dado real … é apagado ou reescrito&quot;) — a fronteira herdada que o RF-02 executa."}, {"tag": "F-02", "path": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md", "rel": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md", "lines": "22-25", "desc": "\"Canvas Visual Interativo … Painel de Entidades: uma visão alternativa em formato de 'datatable'\" — a dupla canvas+tabela que funciona na linhagem; fundamenta RI-01, RI-04.", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md:22-25 — &quot;Canvas Visual Interativo … Painel de Entidades: uma visão alternativa em formato de &#x27;datatable&#x27;&quot; — a dupla canvas+tabela que funciona na linhagem; fundamenta RI-01, RI-04."}, {"tag": "F-03", "path": "", "rel": "", "lines": "", "desc": "`/home/user/tocbuilderv3/types.ts:69` (`id: 'A' | 'B' | 'C' | 'D' | 'D_PRIME'`) e `:73` (`id: 'A_B' | 'A_C' | 'B_D' | 'C_D_PRIME' | 'D_C' | 'D_PRIME_B' | 'D_D_PRIME'`) — as cinco entidades e as sete arestas com premissa da NC; fundamenta RI-12.", "seal": "🟢", "internal": false, "t": " — /home/user/tocbuilderv3/types.ts:69 (id: &#x27;A&#x27; | &#x27;B&#x27; | &#x27;C&#x27; | &#x27;D&#x27; | &#x27;D_PRIME&#x27;) e :73 (id: &#x27;A_B&#x27; | &#x27;A_C&#x27; | &#x27;B_D&#x27; | &#x27;C_D_PRIME&#x27; | &#x27;D_C&#x27; | &#x27;D_PRIME_B&#x27; | &#x27;D_D_PRIME&#x27;) — as cinco entidades e as sete arestas com premissa da NC; fundamenta RI-12."}, {"tag": "F-04", "path": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "rel": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "lines": "200-202", "desc": "\"`theme.tokens` traz `nome → cor` … é **parcial por design**, seu `fallback` obrigatório cobre o resto\" — fundamenta RI-07.", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md:200-202 — &quot;theme.tokens traz nome → cor … é parcial por design, seu fallback obrigatório cobre o resto&quot; — fundamenta RI-07."}, {"tag": "F-05", "path": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "rel": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "lines": "187-204", "desc": "o handshake `ghd.ready`/`ghd.handshake` com `targetOrigin` dirigido e tema no payload — o envelope que o adaptador falso do RF-09 reproduz.", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md:187-204 — o handshake ghd.ready/ghd.handshake com targetOrigin dirigido e tema no payload — o envelope que o adaptador falso do RF-09 reproduz."}, {"tag": "F-06", "path": "/home/user/gestaodeprioridades/specs/002-prototipo-de-interfaces/tasks.md", "rel": "/home/user/gestaodeprioridades/specs/002-prototipo-de-interfaces/tasks.md", "lines": "29-30", "desc": "\"a tabela … Provada em 420px\" — a largura de iframe estreito que a irmã provou; herdada como referência do RI-03 até medição própria (L-01).", "seal": "🟢", "internal": false, "t": "/home/user/gestaodeprioridades/specs/002-prototipo-de-interfaces/tasks.md:29-30 — &quot;a tabela … Provada em 420px&quot; — a largura de iframe estreito que a irmã provou; herdada como referência do RI-03 até medição própria (L-01)."}, {"tag": "F-07", "path": "", "rel": "", "lines": "", "desc": "medição executada em 2026-09-03 na linhagem: `cd /home/user/tocbuilderv3 && grep -rn -i -E \"theme|darkMode|dark-mode\" --include='*.ts' --include='*.tsx' --include='*.html' . | wc -l` → saída: `0` — a linhagem não tem tema algum; o RI-06 nasce sem referência.", "seal": "🟢", "internal": false, "t": " — medição executada em 2026-09-03 na linhagem: cd /home/user/tocbuilderv3 &amp;&amp; grep -rn -i -E &quot;theme|darkMode|dark-mode&quot; --include=&#x27;.ts&#x27; --include=&#x27;.tsx&#x27; --include=&#x27;.html&#x27; . | wc -l → saída: 0 — a linhagem não tem tema algum; o RI-06 nasce sem referência."}, {"tag": "F-08", "path": "/home/user/tocbuilderv3/services/geminiService.ts", "rel": "/home/user/tocbuilderv3/services/geminiService.ts", "lines": "16", "desc": "cliente de provedor de modelo inicializado no navegador — a violação canônica que o RNF-02 proíbe (mesma fonte F-01 da spec 001).", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/geminiService.ts:16 — cliente de provedor de modelo inicializado no navegador — a violação canônica que o RNF-02 proíbe (mesma fonte F-01 da spec 001)."}, {"tag": "F-09", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "159", "desc": "\"**B.8.1** Embarcada, a aplicação **DEVE** renderizar **apenas o conteúdo**: sem o seu próprio cabeçalho de navegação…\" — a norma do modo só-conteúdo; fundamenta RI-09.", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:159 — &quot;B.8.1 Embarcada, a aplicação DEVE renderizar apenas o conteúdo: sem o seu próprio cabeçalho de navegação…&quot; — a norma do modo só-conteúdo; fundamenta RI-09."}], "chain": [{"label": "spec.md", "href": "specs/002-prototipo-de-interfaces/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/002-prototipo-de-interfaces/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/002-prototipo-de-interfaces/tasks.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/002-prototipo-de-interfaces/qa-report.md", "state": "pending"}, {"label": "código do ciclo 002", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "Não medimos a largura real do iframe na fundação — os 420px são a prova da irmã [F-06], não a nossa. Assunção: 420px como referência de estreito até o embarque real do ciclo 003 medir; se divergir, as capturas estreitas regeneram (são de protótipo). Risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": "F-06"}, {"id": "L-02", "d": "A lista de <code>theme.tokens</code> que um inquilino da fundação realmente define não é conhecida — a interseção depende do <code>theme.tokens_used</code> do nosso manifesto, que só existe no ciclo 003. Assunção: o adaptador falso entrega um conjunto mínimo plausível e o fallback cobre o resto, como a norma manda [F-04]. Risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": "F-04"}, {"id": "L-03", "d": "O catálogo <code>toc.*</code> não existe ainda (ciclo 006), então o protótipo não valida a interface do ciclo propor → confirmar → executar — que a irmã validou cedo no protótipo dela. Assunção: a forma dessa interface é prototipável no próprio ciclo 006, sobre build real, com o custo de uma rodada de ajuste a mais. Risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}]}, {"id": "003", "name": "Esqueleto federado (M7/M8 — recorte E7.1, E7.2, E8.1, E8.2, E8.5)", "specNum": "003", "specPath": "specs/003-esqueleto-federado/spec.md", "modules": ["M7", "M8"], "rfs": [{"id": "RF-01", "d": "QUANDO iniciar sem qualquer um dos quatro parâmetros de admissão do §B.4 (<code>HOST_ORIGIN</code>, <code>HOST_BASE_URL</code>, <code>APP_ID</code>, <code>EMBED_URL</code>), O SISTEMA DEVE recusar-se a subir com erro categorizado que nomeia qual faltou (códigos no <code>specs/003-esqueleto-federado/contracts/parametros-de-admissao.md</code>)", "s": "F-07, F-09", "seal": "🟡", "group": "F7.1.1 — Admissão com falha rápida"}, {"id": "RF-02", "d": "O SISTEMA DEVE ler os parâmetros de admissão exclusivamente de configuração (variável de ambiente), nunca de mensagem do canal nem de payload — origem descoberta em runtime é origem dita, e o §B.2.3 proíbe conferir contra o que o remetente escolheu", "s": "F-07, F-06", "seal": "🟡", "group": "F7.1.1 — Admissão com falha rápida"}, {"id": "RF-03", "d": "QUANDO iniciar sem <code>DATABASE_URL</code> ou sem a credencial de introspecção (<code>TOC_APP_CREDENTIAL</code>), O SISTEMA DEVE recusar-se a subir com os códigos próprios do contrato — estes dois são exigência nossa, além dos quatro do §B.4, e o contrato os declara como tal", "s": "", "seal": "🟡", "group": "F7.1.1 — Admissão com falha rápida"}, {"id": "RF-04", "d": "QUANDO recusar-se a subir, O SISTEMA DEVE terminar com código de saída diferente de zero, com o código de recusa na última linha do log estruturado, sem abrir porta nem responder requisição — subir pela metade é não-conformidade nomeada (§B.4.1)", "s": "F-07", "seal": "🟡", "group": "F7.1.1 — Admissão com falha rápida"}, {"id": "RF-05", "d": "O SISTEMA DEVE tratar mudança de qualquer parâmetro de admissão como reconfiguração (novo deploy), nunca como descoberta em runtime (§B.4.2)", "s": "", "seal": "🟡", "group": "F7.1.1 — Admissão com falha rápida"}, {"id": "RF-06", "d": "QUANDO receber o grant no <code>ghd.handshake</code>, O SISTEMA DEVE trocá-lo imediatamente por identidade em <code>POST {HOST_BASE_URL}/auth/introspect</code>, servidor a servidor, com a credencial da aplicação no cabeçalho <code>Authorization: Bearer</code> — o grant nunca é validado no navegador", "s": "F-08, F-11, F-12", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-07", "d": "O SISTEMA NÃO DEVE construir identidade a partir do payload do handshake: o payload é dado, e a identidade só existe depois de uma resposta <code>active: true</code> da introspecção (§B.6.2, §B.9.5)", "s": "F-08", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-08", "d": "O SISTEMA DEVE guardar o Principal (usuário, <code>tenant_id</code>, <code>capabilities</code>, <code>expires_at</code>) e descartar o grant após a troca — o grant é de uso único com TTL ≤ 120 s, e a segunda introspecção do mesmo token responde <code>active: false</code> por desenho", "s": "F-10, F-13", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-09", "d": "QUANDO a introspecção responder <code>{active: false}</code>, O SISTEMA NÃO DEVE renderizar dado algum e DEVE apresentar o estado <code>GRANT_INATIVO</code> com a ação &quot;recarregar pelo shell&quot; — sem distinguir expirado de consumido de inexistente, porque a resposta não distingue (§B.6.5)", "s": "F-08", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-10", "d": "QUANDO a introspecção estiver indisponível (falha de rede ou resposta 5xx), O SISTEMA DEVE falhar fechado: estado <code>FUNDACAO_INDISPONIVEL</code>, nenhum dado renderizado, nunca presumir o grant válido", "s": "", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-11", "d": "QUANDO o hospedeiro responder 401 à credencial da aplicação, O SISTEMA DEVE registrar o evento e sinalizar necessidade de rotação da credencial — sem retry automático, porque o 401 é uniforme por desenho e não diz qual é o caso", "s": "F-11", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-12", "d": "O SISTEMA DEVE derivar toda autorização exclusivamente das <code>capabilities</code> da resposta de introspecção — nunca de texto de modelo, de tela ou de payload do canal (P2, autorização fora do modelo de linguagem)", "s": "", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-13", "d": "QUANDO <code>expires_at</code> do Principal passar, O SISTEMA DEVE encerrar a sessão embarcada e exigir novo embarque — sem renovar credencial por conta própria, porque não há rota para isso e inventá-la seria segundo protocolo (P2)", "s": "", "seal": "🟡", "group": "F7.1.2 — Introspecção"}, {"id": "RF-14", "d": "Toda mensagem emitida no canal DEVE ser um objeto com exatamente os quatro campos <code>{protocol: &quot;ghd&quot;, v: 1, type, payload}</code> — o contraexemplo é o envelope <code>{tipo, versao, payload}</code> do protótipo da irmã, com o qual &quot;a junta não fecharia&quot; (palavras da norma)", "s": "F-01, F-02", "seal": "🟡", "group": "F7.2.1 — Envelope e handshake"}, {"id": "RF-15", "d": "QUANDO montar embarcada, O SISTEMA DEVE emitir <code>ghd.ready</code> com payload <code>{app_id: &quot;toc&quot;}</code> antes de qualquer outra mensagem — a aplicação fala primeiro (§B.2.2)", "s": "F-01", "seal": "🟡", "group": "F7.2.1 — Envelope e handshake"}, {"id": "RF-16", "d": "QUANDO receber mensagem cujo <code>protocol</code> não seja <code>&quot;ghd&quot;</code> ou cujo <code>v</code> não seja <code>1</code>, O SISTEMA DEVE ignorá-la sem efeito e sem resposta — responder já confirma presença (§B.2.1)", "s": "F-01", "seal": "🟡", "group": "F7.2.1 — Envelope e handshake"}, {"id": "RF-17", "d": "QUANDO receber <code>type</code> desconhecido em envelope válido, O SISTEMA DEVE ignorá-lo sem efeito — evolução aditiva (§B.2.5); quebrar por mensagem nova é defeito", "s": "", "seal": "🟡", "group": "F7.2.1 — Envelope e handshake"}, {"id": "RF-18", "d": "QUANDO não receber <code>ghd.handshake</code> dentro da janela declarada (6 s, a mesma do laboratório — §B.3.2), O SISTEMA DEVE apresentar o estado &quot;sem canal&quot; — honesto, não fatal ([DÚVIDA] 2 do Clarify decide se há modo anônimo além dele)", "s": "", "seal": "🟡", "group": "F7.2.1 — Envelope e handshake"}, {"id": "RF-19", "d": "QUANDO receber <code>ghd.resource_changed</code>, O SISTEMA DEVE recarregar apenas os seus próprios dados (a lista de projetos, neste ciclo) — o sinal não carrega escopo e não se deriva escopo de payload (§B.9.2, lido pelo espelho da aplicação)", "s": "", "seal": "🟡", "group": "F7.2.1 — Envelope e handshake"}, {"id": "RF-20", "d": "QUANDO receber qualquer mensagem do canal, O SISTEMA DEVE verificar nesta ordem: (1) <code>ev.source === window.parent</code>; (2) <code>ev.origin</code> igual a <code>HOST_ORIGIN</code> da configuração; (3) só então olhar o conteúdo — a trava dupla do §B.2.3, que no protótipo da irmã existia pela metade (<code>ev.source === parent</code> não existe lá, registro da própria norma)", "s": "F-03, F-05", "seal": "🟡", "group": "F7.2.2 — Verificação de fonte e origem"}, {"id": "RF-21", "d": "O SISTEMA NÃO DEVE aceitar <code>ev.origin === &quot;null&quot;</code> em caso algum, e NÃO DEVE ler a origem esperada de campo de payload — o contraexemplo <code>payload.host_origin</code> é circular e está registrado na norma", "s": "F-06", "seal": "🟡", "group": "F7.2.2 — Verificação de fonte e origem"}, {"id": "RF-22", "d": "Todo <code>postMessage</code> emitido DEVE usar <code>HOST_ORIGIN</code> como <code>targetOrigin</code>; <code>&quot;&quot;</code> é proibido inclusive para o <code>ghd.ready</code> — o contraexemplo é o protótipo da irmã postando <code>ghd.ready</code> com <code>&quot;&quot;</code> tendo <code>HOST_ORIGIN</code> em mãos", "s": "F-04", "seal": "🟡", "group": "F7.2.2 — Verificação de fonte e origem"}, {"id": "RF-23", "d": "QUANDO descartar mensagem (fonte ou origem não admitida), O SISTEMA DEVE registrar o descarte em log estruturado (origem ofensora truncada, sem payload) e contá-lo em métrica — e NÃO DEVE responder", "s": "", "seal": "🟡", "group": "F7.2.2 — Verificação de fonte e origem"}, {"id": "RF-24", "d": "O SISTEMA DEVE saber que está embarcado por sinal explícito na URL de embarque (parâmetro declarado no manifesto), nunca por heurística de <code>window.parent !== window</code> (§B.8.2)", "s": "F-17", "seal": "🟡", "group": "F7.2.3 — Modo conteúdo e tema"}, {"id": "RF-25", "d": "Embarcado, O SISTEMA DEVE renderizar apenas conteúdo: sem cabeçalho de navegação próprio, menu global, rodapé ou seletor de inquilino — quem navega é o hospedeiro (§B.8.1)", "s": "F-17", "seal": "🟡", "group": "F7.2.3 — Modo conteúdo e tema"}, {"id": "RF-26", "d": "QUANDO o handshake trouxer <code>theme.tokens</code>, O SISTEMA DEVE aplicá-los como variáveis CSS por lista de permissão (só os tokens que o manifesto declara consumir) e DEVE cobrir todo token ausente com o tema próprio — tokens são parciais por desenho (§B.4.3)", "s": "F-18", "seal": "🟡", "group": "F7.2.3 — Modo conteúdo e tema"}, {"id": "RF-27", "d": "Embarcado e identificado, O SISTEMA DEVE listar os projetos sintéticos do tenant do Principal — a entrega visível do round 003: leitura, sob identidade real, sem ferramenta ainda", "s": "", "seal": "🟡", "group": "F7.2.3 — Modo conteúdo e tema"}, {"id": "RF-28", "d": "O SISTEMA DEVE usar PostgreSQL Neon em projeto próprio, conectado por <code>DATABASE_URL</code> — nenhuma tabela, esquema ou <code>Base.metadata</code> compartilhado com a fundação", "s": "F-19", "seal": "🟡", "group": "F8.1.1 — Banco e migrações próprios"}, {"id": "RF-29", "d": "Toda mudança de esquema DEVE nascer como migração Alembic com <code>upgrade</code> e <code>downgrade</code>; o <code>downgrade</code> DEVE ser testado — aplicado e revertido num banco limpo sem resíduo (portão da raia infra)", "s": "", "seal": "🟡", "group": "F8.1.1 — Banco e migrações próprios"}, {"id": "RF-30", "d": "O SISTEMA DEVE escolher o backend de persistência por configuração (<code>DATABASE_URL</code>: Postgres × in-memory para teste), atrás de porta — o padrão comprovado da fundação, lido e não copiado", "s": "F-19", "seal": "🟡", "group": "F8.1.1 — Banco e migrações próprios"}, {"id": "RF-31", "d": "Toda consulta de repositório DEVE ser filtrada pelo <code>tenant_id</code> do Principal; não DEVE existir método de leitura sem parâmetro de tenant — e o teste de isolamento consulta com dois principais de tenants distintos e prova a não-interseção", "s": "", "seal": "🟡", "group": "F8.1.2 — Isolamento por tenant"}, {"id": "RF-32", "d": "Todo endpoint do serviço DEVE nascer com span OTel; requisição sem traço é defeito, não pendência (P5)", "s": "", "seal": "🟡", "group": "F8.2.1 — Observabilidade de nascença"}, {"id": "RF-33", "d": "A chamada de introspecção DEVE ter span próprio, correlacionado ao traço da requisição de embarque — o traço de ponta a ponta é parte da aptidão &quot;a junta fecha&quot;", "s": "", "seal": "🟡", "group": "F8.2.1 — Observabilidade de nascença"}, {"id": "RF-34", "d": "Todo log DEVE ser estruturado e carregar o <code>trace_id</code> da requisição; falha de admissão (RF-04) e descarte de mensagem (RF-23) DEVEM aparecer em log e métrica", "s": "F-04, F-23", "seal": "🟡", "group": "F8.2.1 — Observabilidade de nascença"}, {"id": "RF-35", "d": "QUANDO não houver coletor OTel configurado, O SISTEMA DEVE operar com exportador nulo — observabilidade ausente degrada o diagnóstico, nunca o serviço", "s": "", "seal": "🟡", "group": "F8.2.1 — Observabilidade de nascença"}, {"id": "RF-36", "d": "A interface e o serviço DEVEM ser publicados em site cujo eTLD+1 é distinto do hospedeiro (§B.1.2) — Vercel e Railway conforme o ADR 0002; o endereço passa pelo portão humano antes de entrar no manifesto", "s": "F-16", "seal": "🟡", "group": "F8.5.1 — Deploy e CI"}, {"id": "RF-37", "d": "O manifesto DEVE declarar <code>mode: embedded</code>, <code>app_id: toc</code>, <code>url</code> e <code>origin</code> em <code>https</code> na mesma origem do deploy, e ser submetido à rota real de administração da fundação — sujeito ao bloqueio externo L-01 (schemas mutuamente exclusivos quando a irmã mediu)", "s": "F-14", "seal": "🟡", "group": "F8.5.1 — Deploy e CI"}, {"id": "RF-38", "d": "A CI DEVE rodar, em todo pull request: a suíte de testes, as funções de aptidão do projeto (<code>check-caminhos.sh</code>, <code>check-adrs-sucessao.sh</code>, <code>check-specs.sh</code>, <code>check-links.sh</code>) e o lint de arquitetura (<code>import-linter</code>) — vermelho bloqueia merge", "s": "", "seal": "🟡", "group": "F8.5.1 — Deploy e CI"}, {"id": "RF-39", "d": "O procedimento de rollback de deploy (interface e serviço) DEVE estar documentado e ensaiado uma vez dentro do ciclo, com a saída do ensaio colada no <code>qa-report.md</code> (raia infra: reversibilidade é entrega, não intenção)", "s": "", "seal": "🟡", "group": "F8.5.1 — Deploy e CI"}], "ris": [{"id": "RI-01", "d": "Cada estado de fronteira — &quot;aguardando handshake&quot;, &quot;sem canal&quot;, <code>GRANT_INATIVO</code>, <code>FUNDACAO_INDISPONIVEL</code> — DEVE ter tela própria com nome do estado, explicação de uma frase e ação disponível; nunca um frame em branco", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "As telas de erro NÃO DEVEM expor detalhe interno (URL de introspecção, stack, conteúdo de payload): código categorizado + ação, e o resto vai para o traço", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "Embarcada, a única tela de conteúdo deste ciclo é a lista de projetos: nome, ferramenta e última atualização, sob o tema do inquilino", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "O tema próprio (fallback) DEVE cobrir claro e escuro; token do inquilino ausente nunca deixa elemento sem cor definida (mesma régua do ciclo 002)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "O foco de teclado NÃO DEVE ficar preso dentro do frame; a troca para estado de erro DEVE ser anunciada a leitor de tela (<code>aria-live</code>)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "Toda string visível DEVE viver em arquivo de mensagens (português como língua-fonte) — preparação para o E8.3, que consolida i18n no ciclo 011", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "A jornada de embarque (feliz + três estados de falha) DEVE ter captura gerada por script versionado a partir do build embarcado real, com avaliação heurística datada (P6)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "Modo autônomo (fora de iframe, para desenvolvimento) DEVE existir e ser visivelmente distinto do embarcado — com aviso &quot;modo de desenvolvimento, sem identidade da fundação&quot; — para ninguém confundir a casca local com a junta real", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "O grant NUNCA aparece em log, traço, URL ou armazenamento — redigido em toda saída; a verificação é um grep negativo sobre os logs do teste de embarque", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "A credencial da aplicação (<code>TOC_APP_CREDENTIAL</code>) vive só no servidor, por variável de ambiente — nunca no bundle, nunca no navegador (P7; a violação canônica da linhagem está medida em)", "s": "F-20", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Fail-closed em todo caminho de erro da fronteira: exceção não tratada na admissão, na introspecção ou no canal resulta em negação, nunca em acesso", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "Nenhum dado real de pessoa em fixture, log de exemplo ou captura (ADR 0006) — o portão é grep das personas proibidas sobre <code>fixtures/</code> e <code>docs/jornadas/</code>", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Adaptadores de fronteira (canal, introspecção) com teste de fluxo feliz e de cada fluxo de erro — a cobertura dos caminhos de recusa é a que importa aqui", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "Tempo do <code>ghd.ready</code> à lista renderizada: medido e registrado pelo traço OTel em todo embarque; alvo proposto ≤ 3 s em rede de referência, a fixar no gate (L-06 — não há baseline antes da primeira medição real)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "Reinício do hospedeiro invalida embarques em voo (grants em memória lá — L-03): O SISTEMA DEVE tratar o caso como <code>GRANT_INATIVO</code> comum, sem tratamento especial e sem abrir chamado como se fosse defeito nosso", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "A aplicação DEVE funcionar sob o sandbox mínimo do hospedeiro (<code>allow-scripts allow-same-origin</code>) sem pedir permissão adicional neste ciclo", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-09", "d": "Segredos ausentes do repositório: nenhum valor de <code>TOC_APP_CREDENTIAL</code> ou <code>DATABASE_URL</code> em arquivo versionado — o portão é grep por prefixo (<code>ghd_</code>, <code>postgres://</code>) sobre a árvore", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-10", "d": "O pipeline de CI DEVE terminar em menos de 10 minutos — acima disso o portão deixa de ser rodado antes do push, e portão que não roda não protege", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "Projeto sintético é somente leitura neste ciclo: nenhuma escrita vinda do hospedeiro, nenhuma ação de mutação exposta — escrita e catálogo nascem juntos no ciclo 006, com a FSM de proposta (round 003, &quot;Fora&quot;)", "s": "", "seal": "🟡", "group": ""}], "ints": [{"id": "INT-01", "d": "<code>POST /auth/introspect</code> da fundação — a fronteira de identidade. Contrato: corpo <code>{token}</code>, credencial da aplicação em <code>Authorization: Bearer</code>, três respostas possíveis (sessão ativa · grant ativo sem <code>role</code> · <code>{active:false}</code> e só), todas com status de sucesso. Rota real medida: 🟢. Consumo: RF-06..RF-11", "s": "F-12, F-06, F-11", "seal": "", "group": ""}, {"id": "INT-02", "d": "Canal <code>postMessage</code> <code>ghd.*</code> — vocabulário consumido neste ciclo: emite <code>ghd.ready</code>; recebe <code>ghd.handshake</code> e <code>ghd.resource_changed</code>. <code>ghd.action_result</code> só nasce quando houver ação (ciclo 006). Envelope e travas: RF-14..RF-23", "s": "F-14, F-23", "seal": "", "group": ""}, {"id": "INT-03", "d": "Admissão — os quatro parâmetros do §B.4 + credencial, entregues pela Administradora do tenant a partir do bloco &quot;Contrato de admissão&quot; do painel da fundação; manifesto submetido a <code>POST /admin/federated</code> (sujeito a L-01/L-02). Contrato nosso: <code>specs/003-esqueleto-federado/contracts/parametros-de-admissao.md</code>", "s": "", "seal": "", "group": ""}, {"id": "INT-04", "d": "Exportação OTel — OTLP por variável de ambiente; sem coletor, exportador nulo (RF-35)", "s": "F-35", "seal": "", "group": ""}, {"id": "INT-05", "d": "O que este ciclo NÃO integra (declarado para ninguém procurar): catálogo <code>toc.*</code>, snapshot, registro de telas e wire SSE — tudo no ciclo 006 (<code>specs/006-acoes-governadas-e-snapshot/spec.md</code>)", "s": "", "seal": "", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "44-50", "desc": "§B.2.1: envelope de exatamente quatro campos `{protocol:\"ghd\", v:1, type, payload}`; mensagem que não case `protocol` e `v` é ignorada sem resposta — uso: RF-14..RF-16", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:44-50 — §B.2.1: envelope de exatamente quatro campos {protocol:&quot;ghd&quot;, v:1, type, payload}; mensagem que não case protocol e v é ignorada sem resposta — uso: RF-14..RF-16"}, {"tag": "F-02", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "52", "desc": "o contraexemplo do envelope: a irmã implementou `{tipo, versao, payload}` (`prototipo/adaptadores.js:129`) e \"hoje a junta não fecharia\" — uso: RF-14, DoD 7", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:52 — o contraexemplo do envelope: a irmã implementou {tipo, versao, payload} (prototipo/adaptadores.js:129) e &quot;hoje a junta não fecharia&quot; — uso: RF-14, DoD 7"}, {"tag": "F-03", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "56", "desc": "§B.2.3: ordem de verificação (1) `event.source`, (2) `event.origin` por igualdade com origem de configuração, (3) conteúdo — uso: RF-20", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:56 — §B.2.3: ordem de verificação (1) event.source, (2) event.origin por igualdade com origem de configuração, (3) conteúdo — uso: RF-20"}, {"tag": "F-04", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "62", "desc": "defeito real registrado: `prototipo/adaptadores.js` posta `ghd.ready` com `parent.postMessage(pronto, \"*\")` tendo `HOST_ORIGIN` em mãos — uso: RF-22", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:62 — defeito real registrado: prototipo/adaptadores.js posta ghd.ready com parent.postMessage(pronto, &quot;&quot;) tendo HOST_ORIGIN em mãos — uso: RF-22"}, {"tag": "F-05", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "23", "desc": "tabela de proveniência: o protótipo da irmã verifica só `ev.origin`; \"`ev.source === parent` **não existe**\" — uso: RF-20", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:23 — tabela de proveniência: o protótipo da irmã verifica só ev.origin; &quot;ev.source === parent não existe&quot; — uso: RF-20"}, {"tag": "F-06", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "58", "desc": "caso real da origem lida de `payload.host_origin` (circular) e `event.origin === \"null\"` nunca aceitável — uso: RF-02, RF-21", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:58 — caso real da origem lida de payload.host_origin (circular) e event.origin === &quot;null&quot; nunca aceitável — uso: RF-02, RF-21"}, {"tag": "F-07", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "85-93", "desc": "§B.4: tabela dos parâmetros de admissão (4 linhas com \"recusa de subir\" — contado por `grep -c 'recusa de subir'` = `4`) e §B.4.1: recusar subir nomeando qual faltou — uso: RF-01..RF-04", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:85-93 — §B.4: tabela dos parâmetros de admissão (4 linhas com &quot;recusa de subir&quot; — contado por grep -c &#x27;recusa de subir&#x27; = 4) e §B.4.1: recusar subir nomeando qual faltou — uso: RF-01..RF-04"}, {"tag": "F-08", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "123-139", "desc": "§B.6: grant de uso único e vida curta; a aplicação não confia na credencial (§B.6.2); as três respostas da introspecção (§B.6.3, linhas 129-133); `{active:false}` sem distinção (§B.6.5) — uso: RF-06..RF-09", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:123-139 — §B.6: grant de uso único e vida curta; a aplicação não confia na credencial (§B.6.2); as três respostas da introspecção (§B.6.3, linhas 129-133); {active:false} sem distinção (§B.6.5) — uso: RF-06..RF-09"}, {"tag": "F-09", "path": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "rel": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "lines": "152-167", "desc": "§4.3 do guia: os quatro parâmetros por configuração, nunca por mensagem; \"recuse subir com erro categorizado que diga qual faltou\" — uso: RF-01, RF-02", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md:152-167 — §4.3 do guia: os quatro parâmetros por configuração, nunca por mensagem; &quot;recuse subir com erro categorizado que diga qual faltou&quot; — uso: RF-01, RF-02"}, {"tag": "F-10", "path": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "rel": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "lines": "196-199", "desc": "\"O token é um grant de USO ÚNICO (`ghdg_…`, TTL 120 s) — troque-o IMEDIATAMENTE por identidade via `POST /auth/introspect` (…) guarde o principal, não o token\" — uso: RF-06, RF-08", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md:196-199 — &quot;O token é um grant de USO ÚNICO (ghdg_…, TTL 120 s) — troque-o IMEDIATAMENTE por identidade via POST /auth/introspect (…) guarde o principal, não o token&quot; — uso: RF-06, RF-08"}, {"tag": "F-11", "path": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "rel": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "lines": "116-147", "desc": "contrato do introspect com `Authorization: Bearer ghd_<credencial>` (spec 047 da fundação), 401 uniforme e seu tratamento sem retry cego — uso: RF-06, RF-11", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md:116-147 — contrato do introspect com Authorization: Bearer ghd_&lt;credencial&gt; (spec 047 da fundação), 401 uniforme e seu tratamento sem retry cego — uso: RF-06, RF-11"}, {"tag": "F-12", "path": "/home/user/ghdaru/apps/api/src/ghdaru_api/http/auth_router.py", "rel": "/home/user/ghdaru/apps/api/src/ghdaru_api/http/auth_router.py", "lines": "139", "desc": "`@router.post(\"/auth/introspect\")`: a rota existe na fundação real, com autenticação de chamador (`_calling_app`, 401 uniforme) — uso: INT-01", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/apps/api/src/ghdaru_api/http/auth_router.py:139 — @router.post(&quot;/auth/introspect&quot;): a rota existe na fundação real, com autenticação de chamador (_calling_app, 401 uniforme) — uso: INT-01"}, {"tag": "F-13", "path": "/home/user/ghdaru/apps/api/tests/identity/test_embed_grant.py", "rel": "/home/user/ghdaru/apps/api/tests/identity/test_embed_grant.py", "lines": "44", "desc": "`assert EMBED_GRANT_TTL <= timedelta(seconds=120)` (\"vida curta é requisito, não acaso\") — uso: RF-08", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/apps/api/tests/identity/test_embed_grant.py:44 — assert EMBED_GRANT_TTL &lt;= timedelta(seconds=120) (&quot;vida curta é requisito, não acaso&quot;) — uso: RF-08"}, {"tag": "F-14", "path": "/home/user/gestaodeprioridades/mensagens/005-para-ghdaru-embarque-da-prioridades.md", "rel": "/home/user/gestaodeprioridades/mensagens/005-para-ghdaru-embarque-da-prioridades.md", "lines": "14-23", "desc": "\"Os dois schemas de manifesto são mutuamente exclusivos\" · \"REJEITADO · 4 erros\" — a medição da irmã que fundamenta L-01 — uso: RF-37, L-01", "seal": "🟢", "internal": false, "t": "/home/user/gestaodeprioridades/mensagens/005-para-ghdaru-embarque-da-prioridades.md:14-23 — &quot;Os dois schemas de manifesto são mutuamente exclusivos&quot; · &quot;REJEITADO · 4 erros&quot; — a medição da irmã que fundamenta L-01 — uso: RF-37, L-01"}, {"tag": "F-15", "path": "/home/user/gestaodeprioridades/specs/002-prototipo-de-interfaces/contracts/parametros-de-admissao.md", "rel": "/home/user/gestaodeprioridades/specs/002-prototipo-de-interfaces/contracts/parametros-de-admissao.md", "lines": "", "desc": "o contrato de admissão da irmã, modelo do nosso (códigos de recusa por parâmetro, erros de fronteira) — uso: contracts/", "seal": "🟢", "internal": false, "t": "/home/user/gestaodeprioridades/specs/002-prototipo-de-interfaces/contracts/parametros-de-admissao.md — o contrato de admissão da irmã, modelo do nosso (códigos de recusa por parâmetro, erros de fronteira) — uso: contracts/"}, {"tag": "F-16", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "38", "desc": "§B.1.2: servida de site distinto (eTLD+1) do hospedeiro; recusa como estado honesto — uso: RF-36", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:38 — §B.1.2: servida de site distinto (eTLD+1) do hospedeiro; recusa como estado honesto — uso: RF-36"}, {"tag": "F-17", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "159-161", "desc": "§B.8.1 (só conteúdo) e §B.8.2 (sinal explícito, nunca heurística de `window.parent`) — uso: RF-24, RF-25", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:159-161 — §B.8.1 (só conteúdo) e §B.8.2 (sinal explícito, nunca heurística de window.parent) — uso: RF-24, RF-25"}, {"tag": "F-18", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "97", "desc": "§B.4.3: tokens de tema parciais por desenho; tema padrão obrigatório para o que não vier — uso: RF-26", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:97 — §B.4.3: tokens de tema parciais por desenho; tema padrão obrigatório para o que não vier — uso: RF-26"}, {"tag": "F-19", "path": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "rel": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "lines": "39-41", "desc": "\"seu banco e migrações são seus (não compartilhe `Base.metadata`)\"; factory por `DATABASE_URL` (`persistence/factory.py` como referência) — uso: RF-28, RF-30", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md:39-41 — &quot;seu banco e migrações são seus (não compartilhe Base.metadata)&quot;; factory por DATABASE_URL (persistence/factory.py como referência) — uso: RF-28, RF-30"}, {"tag": "F-20", "path": "/home/user/ghdaru/apps/api/src/ghdaru_api/identity/adapters/in_memory.py", "rel": "/home/user/ghdaru/apps/api/src/ghdaru_api/identity/adapters/in_memory.py", "lines": "58-60", "desc": "grants de embed em repositório in-memory declaradamente protótipo (\"sobreviver a restart não é requisito\") — uso: RNF-07, L-03", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/apps/api/src/ghdaru_api/identity/adapters/in_memory.py:58-60 — grants de embed em repositório in-memory declaradamente protótipo (&quot;sobreviver a restart não é requisito&quot;) — uso: RNF-07, L-03"}], "chain": [{"label": "spec.md", "href": "specs/003-esqueleto-federado/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/003-esqueleto-federado/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/003-esqueleto-federado/tasks.md", "state": "ok"}, {"label": "data-model.md", "href": "specs/003-esqueleto-federado/data-model.md", "state": "ok"}, {"label": "contracts/parametros-de-admissao.md", "href": "specs/003-esqueleto-federado/contracts/parametros-de-admissao.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/003-esqueleto-federado/qa-report.md", "state": "pending"}, {"label": "código do ciclo 003", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "Os dois schemas de manifesto eram mutuamente exclusivos quando a irmã mediu (golden da fundação × normativo do Anexo B, 4 erros na validação cruzada — [F-14]) — assunção: re-medição na abertura do ciclo; se persistir, o ciclo entrega tudo menos o registro do manifesto, com mensagem nossa referenciando a da irmã — risco alto (é o único item da aptidão central que não depende só de nós).", "risco": "alto", "cmds": [], "paths": [], "s": "F-14"}, {"id": "L-02", "d": "A fatia de federação da fundação é desligada por padrão (<code>FEDERATION_MANIFESTS_ENABLED</code> — <code>ghdaru/apps/api/src/ghdaru_api/http/manifest_loader.py:28</code> 🟢; sem ela, tudo responde 404) — assunção: ligar é do operador da fundação e será pedido na abertura do ciclo — risco médio.", "risco": "médio", "cmds": [], "paths": ["<code>ghdaru/apps/api/src/ghdaru_api/http/manifest_loader.py:28</code>"], "s": ""}, {"id": "L-03", "d": "Grants de embarque vivem em memória no hospedeiro ([F-20]) — assunção: reinício do host invalida embarques em voo e a aplicação trata como <code>GRANT_INATIVO</code> comum (RNF-07); aceitável para leitura — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": "F-20"}, {"id": "L-04", "d": "A autenticação do chamador da introspecção é 🧪 na norma (§B.6.6), mas a fundação já a implementa (spec 047 — [F-11], [F-12]) — assunção: seguimos a implementação real da fundação; se a norma fechar a cláusula com forma diferente, o adaptador de introspecção absorve a mudança — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": "F-11, F-12"}, {"id": "L-05", "d": "Ambiente de teste da fundação não confirmado (quinta linha da tabela do §B.4: &quot;DEVE ser oferecido&quot;, mas não impede subir) — assunção: sem ele, o ensaio da junta acontece direto no ambiente real com tenant de teste — risco médio (vai ao Clarify).", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-06", "d": "Não há baseline de desempenho do embarque — assunção: o alvo ≤ 3 s do RNF-06 é proposto, não medido; a primeira medição real o calibra no gate — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}]}, {"id": "004", "name": "Núcleo de diagramas (M1 — Núcleo de Diagramas Lógicos)", "specNum": "004", "specPath": "specs/004-nucleo-de-diagramas/spec.md", "modules": ["M1"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE criar projeto com nome, descrição do problema e tipo de ferramenta, persistindo-o no banco próprio associado ao (inquilino, usuário) da introspecção", "s": "F-04, F-11", "seal": "🟡", "group": "CRUD de projetos"}, {"id": "RF-02", "d": "O SISTEMA DEVE listar os projetos ativos visíveis ao usuário autenticado, ordenados por última alteração, sem jamais incluir projeto de outro inquilino", "s": "", "seal": "🟡", "group": "CRUD de projetos"}, {"id": "RF-03", "d": "O SISTEMA DEVE abrir um projeto devolvendo metadados, nós e arestas num único carregamento consistente", "s": "F-03", "seal": "🟡", "group": "CRUD de projetos"}, {"id": "RF-04", "d": "O SISTEMA DEVE permitir editar nome e descrição do problema de um projeto existente, registrando o evento de domínio correspondente", "s": "", "seal": "🟡", "group": "CRUD de projetos"}, {"id": "RF-05", "d": "QUANDO o usuário recarregar a página, O SISTEMA DEVE reapresentar o projeto exatamente como persistido — a correção do defeito D-07 da linhagem, cuja &quot;persistência&quot; era um vetor em memória", "s": "F-04, F-09", "seal": "🟡", "group": "CRUD de projetos"}, {"id": "RF-06", "d": "QUANDO o usuário excluir um projeto, O SISTEMA DEVE marcá-lo <code>excluido</code> com carimbo de data — nunca remover a linha — e retirá-lo das listagens padrão", "s": "F-05", "seal": "🟡", "group": "Exclusão suave e restauração"}, {"id": "RF-07", "d": "O SISTEMA DEVE listar os projetos excluídos do usuário (lixeira) com data de exclusão e ação de restauração", "s": "", "seal": "🟡", "group": "Exclusão suave e restauração"}, {"id": "RF-08", "d": "QUANDO o usuário restaurar um projeto excluído, O SISTEMA DEVE devolvê-lo ao estado <code>ativo</code> com nós, arestas e histórico intactos, registrando <code>ProjetoRestaurado</code>", "s": "", "seal": "🟡", "group": "Exclusão suave e restauração"}, {"id": "RF-09", "d": "QUANDO o usuário pedir exclusão definitiva, O SISTEMA DEVE exigir confirmação explícita que nomeie o projeto (o efeito falha o 3º teste do item 8 — irreversível) antes de remover", "s": "F-12", "seal": "🟡", "group": "Exclusão suave e restauração"}, {"id": "RF-10", "d": "O SISTEMA DEVE recusar qualquer mutação sobre projeto no estado <code>excluido</code>, exceto restauração e exclusão definitiva", "s": "", "seal": "🟡", "group": "Exclusão suave e restauração"}, {"id": "RF-11", "d": "O SISTEMA DEVE criar nó com título e descrição na posição indicada pelo gesto, persistindo-o e registrando <code>NoAdicionado</code>", "s": "F-01", "seal": "🟡", "group": "Nós no canvas"}, {"id": "RF-12", "d": "O SISTEMA DEVE permitir editar título e descrição de um nó, inline no canvas e pelo formulário, aplicando na hora sob o item 8 (alvo único nomeado pelo gesto, valor literal no controle, reversível na sessão)", "s": "F-12", "seal": "🟡", "group": "Nós no canvas"}, {"id": "RF-13", "d": "QUANDO o usuário arrastar um nó, O SISTEMA DEVE persistir a posição final e tratar o arrasto inteiro como um único episódio de desfazer", "s": "F-13", "seal": "🟡", "group": "Nós no canvas"}, {"id": "RF-14", "d": "O SISTEMA DEVE permitir recolher e expandir um nó, persistindo o estado por projeto", "s": "F-01", "seal": "🟡", "group": "Nós no canvas"}, {"id": "RF-15", "d": "QUANDO o usuário excluir um nó, O SISTEMA DEVE remover também as arestas incidentes no mesmo comando, declarando o raio (&quot;remove também N arestas&quot;) no controle antes do gesto e no evento de domínio depois dele", "s": "F-06", "seal": "🟡", "group": "Nós no canvas"}, {"id": "RF-16", "d": "O SISTEMA DEVE garantir por teste de domínio que excluir um nó remove exatamente aquele nó e suas arestas incidentes — o teste que teria pego o filtro invertido da linhagem, que apagava todos os nós menos o excluído", "s": "F-06", "seal": "🟡", "group": "Nós no canvas"}, {"id": "RF-17", "d": "O SISTEMA DEVE criar aresta dirigida entre dois nós do projeto, pelo gesto de ligação no canvas ou pelo formulário da tabela", "s": "F-02", "seal": "🟡", "group": "Arestas causais"}, {"id": "RF-18", "d": "O SISTEMA DEVE recusar aresta duplicada (mesmo par origem→destino) e auto-laço, com mensagem que diga a regra violada", "s": "", "seal": "🟡", "group": "Arestas causais"}, {"id": "RF-19", "d": "O SISTEMA DEVE permitir editar o rótulo de uma aresta e excluí-la, com os eventos correspondentes", "s": "", "seal": "🟡", "group": "Arestas causais"}, {"id": "RF-20", "d": "O SISTEMA DEVE validar, em toda mutação de aresta, que origem e destino existem no projeto — no domínio, não só na interface", "s": "", "seal": "🟡", "group": "Arestas causais"}, {"id": "RF-21", "d": "O SISTEMA DEVE classificar cada tipo de ação por política declarada no servidor (aplica-com-desfazer | exige-confirmação | nasce-proposta), resolvendo o portão por tipo de ação, nunca por origem alegada pelo cliente", "s": "F-12", "seal": "🟡", "group": "Edição direta, desfazer e reverter"}, {"id": "RF-22", "d": "O SISTEMA DEVE manter, por sessão de edição de projeto, uma pilha de desfazer sem teto declarado, onde cada entrada é um episódio (arrasto = 1, edição de texto confirmada = 1, exclusão de nó com cascata = 1)", "s": "F-13, F-17", "seal": "🟡", "group": "Edição direta, desfazer e reverter"}, {"id": "RF-23", "d": "QUANDO o usuário acionar desfazer, O SISTEMA DEVE aplicar a operação inversa do último episódio como mutação nova, registrando evento compensatório correlacionado — nunca apagando o evento original", "s": "F-13", "seal": "🟡", "group": "Edição direta, desfazer e reverter"}, {"id": "RF-24", "d": "QUANDO a sessão terminar (fechar ou recarregar), O SISTEMA DEVE descartar a pilha de desfazer — e o que já foi gravado passa a se recuperar por &quot;reverter&quot;, ação de domínio nomeada, nunca por um &quot;desfazer&quot; ressuscitado", "s": "F-13", "seal": "🟡", "group": "Edição direta, desfazer e reverter"}, {"id": "RF-25", "d": "O SISTEMA DEVE oferecer, no histórico de um nó ou projeto, a ação &quot;Reverter &lt;campo&gt; para &lt;valor&gt;&quot;, que aplica como mutação nova com evento compensatório", "s": "F-13", "seal": "🟡", "group": "Edição direta, desfazer e reverter"}, {"id": "RF-26", "d": "O SISTEMA DEVE registrar traço para toda mutação, em qualquer caminho (canvas, tabela, API, desfazer, reverter) — traço ausente é defeito de aceite, não detalhe", "s": "F-12", "seal": "🟡", "group": "Edição direta, desfazer e reverter"}, {"id": "RF-27", "d": "O SISTEMA DEVE apresentar painel de entidades com abas de nós e arestas, cada uma com contagem no título da aba", "s": "F-08", "seal": "🟡", "group": "Vista tabular equivalente"}, {"id": "RF-28", "d": "O SISTEMA DEVE oferecer na tabela as mesmas operações do canvas — criar, editar, excluir nó; criar, editar, excluir aresta — com o mesmo efeito de domínio, o mesmo traço e a mesma pilha de desfazer", "s": "F-08", "seal": "🟡", "group": "Vista tabular equivalente"}, {"id": "RF-29", "d": "QUANDO um nó for criado pela tabela, O SISTEMA DEVE atribuir posição automática no canvas que não sobreponha nós existentes", "s": "", "seal": "🟡", "group": "Vista tabular equivalente"}, {"id": "RF-30", "d": "O SISTEMA DEVE manter canvas e tabela consistentes na mesma sessão: mutação em uma vista aparece na outra sem recarregar", "s": "F-08", "seal": "🟡", "group": "Vista tabular equivalente"}, {"id": "RF-31", "d": "O SISTEMA DEVE oferecer, em cada linha de nó, a ação de focar que centraliza e destaca o nó no canvas", "s": "F-08", "seal": "🟡", "group": "Vista tabular equivalente"}, {"id": "RF-32", "d": "O SISTEMA DEVE exportar o projeto num JSON com versão de esquema declarada, metadados, nós e arestas — em ordem canônica, tal que duas exportações do mesmo estado sejam byte-idênticas", "s": "F-16", "seal": "🟡", "group": "Exportação e importação JSON"}, {"id": "RF-33", "d": "O SISTEMA DEVE validar o arquivo importado contra o esquema declarado — estrutura, tipos, referências de aresta a nó — antes de criar qualquer coisa", "s": "F-10", "seal": "🟡", "group": "Exportação e importação JSON"}, {"id": "RF-34", "d": "QUANDO a validação falhar, O SISTEMA DEVE recusar a importação inteira com relato por item (o quê, onde, por quê), sem criar nem alterar nada", "s": "F-10", "seal": "🟡", "group": "Exportação e importação JSON"}, {"id": "RF-35", "d": "QUANDO a validação passar, O SISTEMA DEVE criar um projeto novo com identificadores novos e relatar o mapeamento e as contagens — nunca substituir projeto existente em silêncio", "s": "F-10", "seal": "🟡", "group": "Exportação e importação JSON"}, {"id": "RF-36", "d": "O SISTEMA DEVE garantir o ciclo de ida e volta: exportar um projeto e importar o arquivo produz um projeto cujo novo export é estruturalmente idêntico (a menos de identificadores e carimbos)", "s": "", "seal": "🟡", "group": "Exportação e importação JSON"}], "ris": [{"id": "RI-01", "d": "A lista de projetos apresenta nome, tipo de ferramenta, data de última alteração e ações (abrir, editar, excluir), com estado vazio que orienta a criação do primeiro projeto", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "A lixeira é uma vista separada da lista, com data de exclusão e ações de restaurar e excluir definitivamente — esta última com confirmação que nomeia o projeto", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "O canvas oferece pan, zoom e &quot;ajustar à tela&quot;; navegação nunca entra na pilha de desfazer", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "A edição de título de nó é inline no canvas (Enter confirma, Esc cancela); descrição e campos longos abrem em painel lateral, não em modal bloqueante", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "O controle de exclusão de nó com arestas mostra o raio (&quot;remove também N arestas&quot;) antes do clique final, no próprio controle", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "O desfazer é acessível por atalho de teclado (Ctrl/Cmd+Z) e por botão visível com o nome do episódio que vai desfazer (ex.: &quot;Desfazer: mover nó&quot;)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "O painel de entidades é redimensionável por arrasto e mantém a largura escolhida durante a sessão", "s": "F-08", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "As tabelas de nós e arestas mostram contagem na aba, têm cabeçalho fixo ao rolar e estado vazio com ação de criação", "s": "F-08", "seal": "🟡", "group": ""}, {"id": "RI-09", "d": "A importação apresenta o relato de validação na própria tela — lista de problemas com item e motivo, ou resumo do que entrou — nunca <code>alert()</code> do navegador", "s": "F-1
