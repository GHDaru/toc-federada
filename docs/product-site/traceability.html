on_proposal</code> — aceitar registra a restrição com referência de origem; recusar deixa a análise intacta (ADR 0007; FSM do ciclo 006)", "s": "F-05", "seal": "🟡", "group": "Assistência via catálogo (corte de apetite: sai primeiro)"}, {"id": "RF-20", "d": "O SISTEMA DEVE funcionar por inteiro — E6.1 e E6.2 — com o catálogo ausente ou desligado: a jornada guiada é estática e completa por construção; a sugestão é aceleradora, nunca dependência (o round 009 a solta primeiro no corte de apetite, F-04)", "s": "F-04", "seal": "🟡", "group": "Assistência via catálogo (corte de apetite: sai primeiro)"}, {"id": "RF-21", "d": "QUANDO a capability de escrita não estiver presente na introspecção, O SISTEMA DEVE omitir do catálogo a ação mutadora deste módulo, mantendo o restante da jornada funcional", "s": "", "seal": "🟡", "group": "Assistência via catálogo (corte de apetite: sai primeiro)"}], "ris": [{"id": "RI-01", "d": "O mapa da jornada apresenta os cinco passos como trilha sequencial nomeada — identificar, explorar, subordinar, elevar, recomeçar — com estado distinguível por forma e rótulo, nunca só por cor; o passo atual é o foco visual da tela", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "O painel do passo tem três camadas na mesma superfície: o herdado (topo, somente leitura), o trabalho do passo (notas, vínculos), e a decisão de conclusão (rodapé, ação explícita)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "O vínculo de ferramenta aparece como cartão com tipo, nome do projeto, estado e navegação direta; criar vínculo oferece primeiro as combinações canônicas do passo (RN-06), com o caminho não-canônico visível mas de segundo nível", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "A linha do tempo dos ciclos (RF-17) apresenta os ciclos em ordem cronológica com restrição e desfecho; ciclo fechado é visualmente distinto e abre somente leitura", "s": "F-17", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "O julgamento das decisões herdadas (RF-16) apresenta cada decisão do ciclo anterior com os dois vereditos de mesmo peso visual — <code>mantida</code> e <code>revogada</code> — e justificativa obrigatória; o contador de pendências é visível do mapa da jornada", "s": "F-16", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "A proposta de <code>toc.suggest_constraint</code> (RF-19) apresenta as candidatas com o nó de origem e o racional em pré-visualização; aceitar e recusar têm o mesmo peso visual; a bandeja de propostas é a do ciclo 006, nunca uma própria", "s": "F-19", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "A listagem de análises (RF-03) mostra passo atual e restrição vigente como colunas de primeira classe, ordenáveis", "s": "F-03", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "Toda superfície do módulo respeita tema do hospedeiro com fallback, modo só-conteúdo e operação por teclado, herdados dos ciclos 002/003; textos por i18n pt/en, inclusive os nomes canônicos dos cinco passos e dos tipos de restrição", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "A ordem canônica dos passos, a unicidade de restrição e ciclo aberto, a imutabilidade de ciclo fechado e o bloqueio por herança pendente são domínio puro testável sem rede, sem banco e sem modelo — a suíte de domínio roda offline por construção (P3, P4)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "A fronteira hexagonal é verificada por <code>import-linter</code>: o pacote de domínio do M6 não importa framework, HTTP, banco nem cliente de IA — o build falha na violação", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Toda mutação do módulo emite traço OTel correlacionado e log estruturado; mutações originadas de proposta aceita carregam o identificador da proposta (P5)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "O vínculo de ferramenta valida existência e tenant do projeto referenciado no servidor ao ser criado; vínculo cujo destino foi depois arquivado degrada para &quot;referência a projeto arquivado&quot; legível — nunca erro opaco, nunca dado órfão silencioso", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Abrir o mapa da jornada de uma análise com 5 ciclos e 30 vínculos renderiza em menos de 1 segundo no percentil 95, medido na jornada viva", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "A fixture de demonstração e a jornada usam exclusivamente a análise sintética da &quot;Instituição Horizonte&quot; — grep negativo de nome real de pessoa no CI (ADR 0006)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "Nenhum prompt, chave ou cliente de provedor no repositório do produto — grep de CI herdado dos ciclos anteriores (P7, ADR 0007)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "Textos dos passos, tipos de restrição, vereditos e avisos saem do mecanismo de i18n com chave estável ligada à regra (RN-NN) — rastreabilidade spec ↔ código ↔ tela", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "Os cinco passos são fixos, nomeados e ordenados — <code>identificar</code> → <code>explorar</code> → <code>subordinar</code> → <code>elevar</code> → <code>recomecar</code> — e todo ciclo os instancia todos, na criação; não se cria, exclui nem reordena passo. A conclusão avança um passo por vez", "s": "F-02, F-04", "seal": "🟡", "group": ""}, {"id": "RN-02", "d": "Uma análise tem no máximo um ciclo aberto; abrir ciclo novo exige fechar o atual pelo recomeço (RF-15) — não existe &quot;fechar sem recomeçar&quot; nem dois ciclos correndo", "s": "F-15", "seal": "🟡", "group": ""}, {"id": "RN-03", "d": "Um ciclo tem no máximo uma restrição vigente. Mudar o alvo da análise não é editar a restrição — é evidência de que a restrição anterior quebrou ou foi mal identificada, e o caminho é o recomeço, que preserva a anterior no ciclo fechado", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-04", "d": "Histórico é apêndice, nunca sobrescrita: ciclo fechado é somente leitura no domínio; decisões de passo não se apagam (reabrir registra novo evento, RF-10); a linha do tempo cresce, nunca encolhe. É o portão executável do roadmap: &quot;&#x27;recomeçar&#x27; reabre sem apagar histórico&quot; (F-06)", "s": "F-10, F-06", "seal": "🟡", "group": ""}, {"id": "RN-05", "d": "A inércia não pode virar a restrição: no recomeço, toda decisão de exploração e subordinação do ciclo anterior herda com veredito <code>pendente</code>, e o passo <code>subordinar</code> do novo ciclo não conclui com pendência — manter é decisão tão explícita quanto revogar, com justificativa (RF-16)", "s": "F-16, F-04", "seal": "🟡", "group": ""}, {"id": "RN-06", "d": "As combinações canônicas passo × ferramenta são: <code>identificar</code>→ARA; <code>explorar</code>→NC, ARF; <code>subordinar</code>→NC; <code>elevar</code>→APR, AT. Fora delas o vínculo exige justificativa e carrega aviso — o método educa, o dado obedece ao grupo (o mesmo desenho de aviso não bloqueante dos módulos M2/M3)", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-07", "d": "O passo <code>recomecar</code> não tem decisão de conclusão própria: o seu ato é o recomeço (RF-15) ou o encerramento declarado da análise (a restrição não limita mais e não há nova — a análise arquiva-se pelo M1)", "s": "F-15", "seal": "🟡", "group": ""}], "ints": [{"id": "INT-01", "d": "O M6 consome do M1 (ciclo 004) projeto, tenant/usuário, exclusão suave, exportação/importação e listagem; consome da junta 003 identidade (<code>POST /auth/introspect</code>), isolamento por inquilino e OTel. Nada disso é reimplementado", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "Vínculo com o M2 (ARA): o passo <code>identificar</code> cria/vincula projetos ARA; a restrição pode nascer de um nó de causa raiz com referência de origem (RF-06). A ARA não conhece o M6 — a referência vive na análise, e a navegação de volta resolve por consulta, não por acoplamento no agregado da ARA", "s": "F-06", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "Vínculo com o M3 (NC): os passos <code>explorar</code> e <code>subordinar</code> criam/vinculam projetos NC para os conflitos que emergem (RF-14) — reusando a criação de NC do ciclo 007 tal como está; nenhum campo novo no M3", "s": "F-14", "seal": "🟡", "group": ""}, {"id": "INT-04", "d": "Vínculo com o M4 (ARF/APR/AT): o passo <code>explorar</code> pode vincular ARF; o passo <code>elevar</code> cria/vincula APR e AT (RF-14), mostrando o andamento dos planos (obstáculos → OIs) do jeito que o M4 os expõe", "s": "F-14", "seal": "🟡", "group": ""}, {"id": "INT-05", "d": "<code>toc.suggest_constraint</code> — catálogo <code>toc.*</code>, mutadora (registra restrição); entrada: identificador da ARA vinculada; saída: candidatas a restrição (nó + racional), uma <code>action_proposal</code> por candidata na FSM do ciclo 006 (RF-19); capability ausente a omite (RF-21)", "s": "F-19, F-21", "seal": "🟡", "group": ""}, {"id": "INT-06", "d": "Telas deste módulo entram no registro de telas do E7.5 com identificador estável (<code>toc.foco_jornada</code>, <code>toc.foco_passo</code>, <code>toc.foco_linha_do_tempo</code>), no formato do ciclo 006; descrição do sistema, notas e decisões marcam <code>ai_visible</code> campo a campo para o snapshot sanitizado — texto de usuário é sempre camada não-confiável (item 7 da constituição)", "s": "", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "", "rel": "", "lines": "", "desc": "linhagem TOC-Builder (4 gerações) — prova de ausência, executada em 2026-09-03: `grep -rniE \"focaliza|five focusing|cinco passos\" TOC-Builder TOC-Builder-APP TOC-Builder-V2 tocbuilderv3 --include=\"*.ts\" --include=\"*.tsx\" --include=\"*.md\" | wc -l` → `0` — os cinco passos nunca existiram na linhagem, nem a palavra; este módulo não tem código-fonte de origem", "seal": "🟢", "internal": false, "t": " — linhagem TOC-Builder (4 gerações) — prova de ausência, executada em 2026-09-03: grep -rniE &quot;focaliza|five focusing|cinco passos&quot; TOC-Builder TOC-Builder-APP TOC-Builder-V2 tocbuilderv3 --include=&quot;.ts&quot; --include=&quot;.tsx&quot; --include=&quot;.md&quot; | wc -l → 0 — os cinco passos nunca existiram na linhagem, nem a palavra; este módulo não tem código-fonte de origem"}, {"tag": "F-02", "path": "docs/adr/0005-escopo-do-dominio-v1.md", "rel": "docs/adr/0005-escopo-do-dominio-v1.md", "lines": "", "desc": "decisão 2: a focalização entra na v1 como módulo novo, \"é o que transforma um editor de diagramas em uma aplicação de TOC\"; o grep de 9 diretórios com saída `0` está colado no próprio ADR; DBR e contabilidade de ganho fora (decisão 3)", "seal": "🟢", "internal": true, "t": "docs/adr/0005-escopo-do-dominio-v1.md — decisão 2: a focalização entra na v1 como módulo novo, &quot;é o que transforma um editor de diagramas em uma aplicação de TOC&quot;; o grep de 9 diretórios com saída 0 está colado no próprio ADR; DBR e contabilidade de ganho fora (decisão 3)"}, {"tag": "F-03", "path": "", "rel": "", "lines": "", "desc": "`docs/produto/visao.md` §6, defeito D-09 — \"Os cinco passos de focalização não existem na linhagem — nem a palavra\", com o console da medição colado", "seal": "🟢", "internal": false, "t": " — docs/produto/visao.md §6, defeito D-09 — &quot;Os cinco passos de focalização não existem na linhagem — nem a palavra&quot;, com o console da medição colado"}, {"tag": "F-04", "path": "docs/produto/rounds.md", "rel": "docs/produto/rounds.md", "lines": "", "desc": "Round 009: aptidão executável (cinco passos com estado herdado; recomeçar reabre apontando a nova restrição \"sem apagar a jornada anterior (histórico é apêndice, não sobrescrita)\"); **sai primeiro** a sugestão assistida; **nunca sai** o registro da restrição", "seal": "🟢", "internal": true, "t": "docs/produto/rounds.md — Round 009: aptidão executável (cinco passos com estado herdado; recomeçar reabre apontando a nova restrição &quot;sem apagar a jornada anterior (histórico é apêndice, não sobrescrita)&quot;); sai primeiro a sugestão assistida; nunca sai o registro da restrição"}, {"tag": "F-05", "path": "", "rel": "", "lines": "", "desc": "`docs/governance/constitution.md` itens 4 (verbo mutador nasce proposta), 7 (tela é dado) e 8 (manipulação direta sob três testes; FSM uma só e do servidor) — a moldura da única ação assistida do módulo", "seal": "🟢", "internal": false, "t": " — docs/governance/constitution.md itens 4 (verbo mutador nasce proposta), 7 (tela é dado) e 8 (manipulação direta sob três testes; FSM uma só e do servidor) — a moldura da única ação assistida do módulo"}, {"tag": "F-06", "path": "docs/roadmap.md", "rel": "docs/roadmap.md", "lines": "", "desc": "Ciclo 009: os dois portões (teste dos cinco passos com estado herdado; jornada sintética com captura por passo) e as duas pré-condições (\"O ciclo 008 promovido\"; \"ADR 0005 inalterado\")", "seal": "🟢", "internal": true, "t": "docs/roadmap.md — Ciclo 009: os dois portões (teste dos cinco passos com estado herdado; jornada sintética com captura por passo) e as duas pré-condições (&quot;O ciclo 008 promovido&quot;; &quot;ADR 0005 inalterado&quot;)"}, {"tag": "F-07", "path": "docs/produto/modulos.md", "rel": "docs/produto/modulos.md", "lines": "", "desc": "M6: épicos E6.1/E6.2, dependências (jornada de M2 e M4; registro só de M1)", "seal": "🟢", "internal": true, "t": "docs/produto/modulos.md — M6: épicos E6.1/E6.2, dependências (jornada de M2 e M4; registro só de M1)"}], "chain": [{"label": "spec.md", "href": "specs/009-focalizacao/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/009-focalizacao/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/009-focalizacao/tasks.md", "state": "ok"}, {"label": "data-model.md", "href": "specs/009-focalizacao/data-model.md", "state": "ok"}, {"label": "contracts/acoes-catalogo.md", "href": "specs/009-focalizacao/contracts/acoes-catalogo.md", "state": "ok"}, {"label": "contracts/rest-api.md", "href": "specs/009-focalizacao/contracts/rest-api.md", "state": "ok"}, {"label": "ux-design.md", "href": "specs/009-focalizacao/ux-design.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/009-focalizacao/qa-report.md", "state": "pending"}, {"label": "código do ciclo 009", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "A taxonomia de tipos de restrição (<code>fisica</code> | <code>politica</code> | <code>de_mercado</code>) não tem precedente na linhagem (que nunca teve restrição) nem norma no corpus. Assunção: os três tipos clássicos da literatura TOC bastam para a v1, como enum fechado com evento — ampliar é migração aditiva pequena; risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-02", "d": "O desenho das DecisoesHerdadas assume que as decisões &quot;de exploração e subordinação&quot; são as que geram inércia — as de identificar e elevar morrem com o ciclo. Assunção: é a leitura direta do quinto passo do método (&quot;não deixe a inércia virar a restrição do sistema&quot;: o que sobrevive por inércia são regras de operação); risco baixo (incluir os demais passos na herança é mudança de filtro, não de modelo).", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-03", "d": "A navegação de volta (da ARA/NC/APR para a análise que a vinculou) resolve por consulta ao M6, sem campo novo nos módulos M2–M4. Assunção: consulta indexada basta para a escala da v1 e evita acoplamento reverso; se o custo aparecer, um índice materializado resolve sem tocar nos agregados das ferramentas; risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-04", "d": "<code>toc.suggest_constraint</code> não tem precedente em nenhuma geração (a linhagem não tinha restrição para sugerir). Assunção: candidatas derivadas dos nós de causa raiz da ARA são um primeiro recorte útil; o round já a marca &quot;sai primeiro&quot; — o risco de errar o desenho é pago com o corte, não com o ciclo; risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-05", "d": "O ciclo 002 (protótipo de interfaces) cobriu RIs de M1–M3; as telas de jornada do M6 podem não ter <code>ux-design.md</code> prévio. Assunção: o desenho nasce neste ciclo sob o mesmo processo (papel semântico → ux-design → jornada viva), no mesmo pull request; risco médio — é o único módulo de superfície nova sem protótipo anterior, e o apetite do ciclo paga esse desenho.", "risco": "médio", "cmds": [], "paths": [], "s": ""}]}, {"id": "010", "name": "Estratégia &amp; Táticas (M5 — Estratégia &amp; Táticas)", "specNum": "010", "specPath": "specs/010-estrategia-e-taticas/spec.md", "modules": ["M5"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE permitir criar projeto do tipo S&amp;T com meta global obrigatória, herdando do M1 listagem, isolamento por inquilino, exclusão suave, restauração e exportação/importação sem reimplementação", "s": "F-03", "seal": "🟡", "group": "Projeto S&amp;T com meta global"}, {"id": "RF-02", "d": "O SISTEMA DEVE permitir editar a meta global com evento próprio (<code>MetaGlobalEditada</code>)", "s": "", "seal": "🟡", "group": "Projeto S&amp;T com meta global"}, {"id": "RF-03", "d": "QUANDO um projeto S&amp;T for excluído, O SISTEMA DEVE aplicar a exclusão suave do M1 arquivando os passos junto; a restauração devolve a árvore inteira com premissas e status", "s": "", "seal": "🟡", "group": "Projeto S&amp;T com meta global"}, {"id": "RF-04", "d": "O SISTEMA DEVE permitir adicionar passo como raiz ou como filho de um passo existente, em posição escolhida entre os irmãos (padrão: última) — e o número hierárquico do passo DEVE ser derivado da posição pela função pura de numeração, nunca informado pelo usuário (RN-01; o contraexemplo é o campo digitado sem validação do v3, F-05)", "s": "F-05", "seal": "🟡", "group": "Passos com numeração derivada"}, {"id": "RF-05", "d": "O SISTEMA DEVE apresentar a numeração no formato hierárquico da linhagem — 1, 1.1, 1.1.2 (F-03) — em todo lugar onde o passo aparece: nó, ficha, tabela, exportação", "s": "F-03", "seal": "🟡", "group": "Passos com numeração derivada"}, {"id": "RF-06", "d": "O SISTEMA NÃO DEVE expor, em nenhum formulário ou API de escrita, campo de número de passo — numeração é saída, nunca entrada (RN-01)", "s": "", "seal": "🟡", "group": "Passos com numeração derivada"}, {"id": "RF-07", "d": "QUANDO um passo for inserido, movido ou excluído, O SISTEMA DEVE renumerar a subárvore afetada de forma determinística e sem lacuna — irmãos seguintes decrementam ou incrementam, descendentes recebem o prefixo novo (o portão executável do roadmap, F-12)", "s": "F-12", "seal": "🟡", "group": "Passos com numeração derivada"}, {"id": "RF-08", "d": "O SISTEMA DEVE permitir mover um passo com toda a sua subárvore para outro pai ou outra posição entre irmãos, preservando estratégia, tática, premissas e status de cada descendente; mover para dentro da própria subárvore é recusado no domínio (RN-04)", "s": "", "seal": "🟡", "group": "Passos com numeração derivada"}, {"id": "RF-09", "d": "QUANDO um passo com descendentes for excluído, O SISTEMA DEVE informar a contagem total no ato de confirmar (&quot;N passos serão excluídos&quot;) e remover exatamente a subárvore — nenhum passo fora dela é tocado (RN-05; o contraexemplo é o defeito de exclusão da linhagem, F-07)", "s": "F-07", "seal": "🟡", "group": "Passos com numeração derivada"}, {"id": "RF-10", "d": "O SISTEMA DEVE manter a estrutura como árvore estrita no domínio: cada passo tem no máximo um pai, não existe aresta como dado independente, e ciclo é impossível por construção (RN-04; o contraexemplo é o reuso de <code>AraEdge</code> com conexão livre do v3, F-03)", "s": "F-03", "seal": "🟡", "group": "Passos com numeração derivada"}, {"id": "RF-11", "d": "O SISTEMA DEVE manter, por passo, estratégia (o quê) e tática (como) como campos de texto distintos e editáveis, com a estratégia obrigatória para criar o passo e a tática podendo nascer vazia (pendência, não bloqueio). [F-03; L-01]", "s": "F-03", "seal": "🟡", "group": "Estratégia, tática e premissas"}, {"id": "RF-12", "d": "O SISTEMA DEVE manter, por passo, as três premissas lógicas como campos de texto opcionais — paralela, de necessidade ao pai, de suficiência dos filhos — os mesmos três campos do modelo da linhagem (F-03, F-04), promovidos de opcionais esquecidos a cidadãos com leitura dirigida e pendência visível (RN-02)", "s": "F-03, F-04", "seal": "🟡", "group": "Estratégia, tática e premissas"}, {"id": "RF-13", "d": "O SISTEMA DEVE apresentar cada premissa com a leitura dirigida montada dos textos atuais: a de necessidade contra o pai (&quot;Para alcançar &lt;estratégia do pai&gt;, é necessário &lt;estratégia do passo&gt; porque &lt;premissa&gt;&quot;) e a de suficiência contra os filhos nomeados — a paralela lê-se sozinha, como pressuposto de contexto", "s": "", "seal": "🟡", "group": "Estratégia, tática e premissas"}, {"id": "RF-14", "d": "O SISTEMA DEVE computar as pendências lógicas da árvore por função pura (PendenciasDaArvore): passo não-raiz sem premissa de necessidade, passo com filhos sem premissa de suficiência, passo sem tática — apresentadas como pendência com salto direto, nunca como trava de gravação (RN-02, RN-06)", "s": "", "seal": "🟡", "group": "Estratégia, tática e premissas"}, {"id": "RF-15", "d": "O SISTEMA DEVE permitir editar estratégia, tática e premissas por manipulação direta na ficha do passo e pela vista tabular, aplicando na hora com traço — os três testes do item 8 da constituição valem", "s": "", "seal": "🟡", "group": "Estratégia, tática e premissas"}, {"id": "RF-16", "d": "O SISTEMA DEVE manter o status de cada passo entre os quatro valores da linhagem — <code>nenhum</code>, <code>validado</code>, <code>nao_validado</code>, <code>em_execucao</code> (F-03) — com mudança registrando autor e data por evento (RN-03)", "s": "F-03", "seal": "🟡", "group": "Status e acompanhamento"}, {"id": "RF-17", "d": "O SISTEMA DEVE apresentar o painel de acompanhamento do projeto: contagem de passos por status, pendências lógicas (RF-14) e progresso — computados da mesma função pura, nunca de dado paralelo", "s": "F-14", "seal": "🟡", "group": "Status e acompanhamento"}, {"id": "RF-18", "d": "O SISTEMA DEVE permitir filtrar a árvore por status mantendo os ancestrais dos passos filtrados visíveis como contexto", "s": "", "seal": "🟡", "group": "Status e acompanhamento"}, {"id": "RF-19", "d": "O SISTEMA DEVE oferecer a vista tabular indentada da árvore — número, estratégia, tática, premissas (presença), status — com paridade de edição com a ficha do passo (o padrão de paridade do M1/M3)", "s": "", "seal": "🟡", "group": "Vista tabular, desfazer e exportação"}, {"id": "RF-20", "d": "O SISTEMA DEVE cobrir toda mutação do módulo (passo, premissas, status, mover, excluir subárvore) pelo desfazer de sessão herdado do M1, sem exceção nova — inclusive a exclusão de subárvore inteira", "s": "", "seal": "🟡", "group": "Vista tabular, desfazer e exportação"}, {"id": "RF-21", "d": "O SISTEMA DEVE exportar e importar o projeto S&amp;T completo pelo E1.4 do M1 — meta global, passos com posição estrutural (pai + ordem), estratégia, tática, premissas e status — sem perda em ida e volta; a numeração NÃO é exportada como dado: deriva na importação, e divergência entre estrutura e numeração é impossível por construção (RN-01)", "s": "", "seal": "🟡", "group": "Vista tabular, desfazer e exportação"}], "ris": [{"id": "RI-01", "d": "A árvore S&amp;T desenha-se da estrutura, de cima para baixo — meta global no topo, raízes na primeira linha, filhos abaixo dos pais — com layout calculado: o usuário ordena e move passos, não arruma caixas (as <code>pos_x</code>/<code>pos_y</code> livres da linhagem não são portadas — F-03)", "s": "F-03", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "O nó do passo apresenta número, estratégia (truncada com título completo acessível) e status — o status distinguível por forma e rótulo, nunca só por cor (a paleta por status da linhagem, F-09, é referência de intenção, não de contraste)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "A ficha do passo apresenta as três premissas nas posições de leitura: a de necessidade visualmente ligada ao pai (acima), a de suficiência ligada aos filhos nomeados (abaixo), a paralela ao lado — a ficha ensina o método pela disposição (F-06: o v3 já tinha os três campos, empilhados sem leitura)", "s": "F-06", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "Adicionar passo é ação contextual do nó (&quot;adicionar filho&quot;, &quot;adicionar irmão abaixo&quot;) — nunca formulário com campo de número (RF-06)", "s": "F-06", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "Mover passo oferece arrastar na árvore e comando explícito na ficha (&quot;mover para…&quot;), com pré-visualização da renumeração antes de confirmar", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "A confirmação de exclusão de subárvore mostra a contagem (RF-09) e o primeiro nível do que cai — desfazer de sessão anunciado na própria confirmação", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "O painel de acompanhamento (RF-17) apresenta contagens por status como filtros acionáveis e as pendências lógicas com salto direto ao passo", "s": "F-17", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "A vista tabular indentada (RF-19) preserva a hierarquia visual por indentação e mantém a numeração como primeira coluna, ordenação estrutural fixa", "s": "F-19", "seal": "🟡", "group": ""}, {"id": "RI-09", "d": "Toda superfície do módulo respeita tema do hospedeiro com fallback, modo só-conteúdo e operação por teclado, herdados dos ciclos 002/003; textos por i18n pt/en, inclusive os quatro status e os rótulos das três premissas", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "A função de numeração, a renumeração por mutação estrutural, as invariantes de árvore estrita e as PendenciasDaArvore são domínio puro testável sem rede, sem banco e sem modelo — a suíte de domínio roda offline por construção (P3, P4)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "A fronteira hexagonal é verificada por <code>import-linter</code>: o pacote de domínio do M5 não importa framework, HTTP, banco nem cliente de IA — o build falha na violação", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Toda mutação do módulo emite traço OTel correlacionado e log estruturado (P5)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "Abrir uma árvore S&amp;T de 100 passos em 5 níveis renderiza em menos de 1 segundo no percentil 95; mover uma subárvore de 20 passos renumera e responde em menos de 500 milissegundos — medidos na jornada viva", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "A numeração é determinística: duas execuções sobre a mesma estrutura devolvem os mesmos números — propriedade coberta por teste (inclusive baseado em propriedades, se a suíte do M1 já o usar)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "A fixture de demonstração e a jornada usam exclusivamente a S&amp;T sintética da &quot;Instituição Horizonte&quot; — grep negativo de nome real de pessoa no CI (ADR 0006)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "Nenhum prompt, chave ou cliente de provedor no repositório do produto — grep de CI herdado dos ciclos anteriores (P7, ADR 0007); este módulo não declara nenhuma ação de catálogo (INT-04)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "Textos de status, rótulos de premissa e leituras dirigidas saem do mecanismo de i18n com chave estável ligada à regra (RN-NN) — rastreabilidade spec ↔ código ↔ tela", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "Numeração é derivada, nunca dado: raízes numeram 1..n pela ordem; filhos de um passo X numeram X.1..X.m pela ordem; a função é determinística e sem lacuna, e toda mutação estrutural renumera a subárvore afetada. Não existe campo de número editável nem persistido como verdade. [F-05 é o contraexemplo; F-12 fixa o portão]", "s": "F-05, F-12", "seal": "🟡", "group": ""}, {"id": "RN-02", "d": "As três premissas têm papel estrutural fixo: paralela (pressuposto de contexto — lê-se sozinha), necessidade ao pai (não se aplica a raiz; pendência quando ausente em passo não-raiz), suficiência dos filhos (só significa algo com filhos; pendência quando há filhos e está ausente). São os três campos do modelo da linhagem, com semântica agora normativa. 🟢 (os três campos existem verbatim em <code>tocbuilderv3/types.ts:293-295</code> e desde a 1ª geração em <code>TOC-Builder/types.ts:243-245</code>; a semântica estrutural é 🟡)", "s": "F-03, F-04", "seal": "", "group": ""}, {"id": "RN-03", "d": "Status do passo é um dos quatro valores da linhagem — <code>nenhum</code>, <code>validado</code>, <code>nao_validado</code>, <code>em_execucao</code> — com transição livre entre eles e evento com autor e data a cada mudança (restringir transições é [DÚVIDA] 2). 🟢 (os quatro valores verbatim em <code>tocbuilderv3/types.ts:270-275</code>, já em português; a política de transição é 🟡)", "s": "F-03", "seal": "", "group": ""}, {"id": "RN-04", "d": "A S&amp;T é árvore estrita: no máximo um pai por passo, ordem explícita entre irmãos, ciclo impossível por construção (mover para a própria subárvore é recusado no domínio). Não existe aresta como entidade. [F-03 é o contraexemplo]", "s": "F-03", "seal": "🟡", "group": ""}, {"id": "RN-05", "d": "Exclusão de passo é exclusão da subárvore inteira, com contagem informada antes de confirmar e evento <code>SubarvoreExcluida</code> com a contagem; passos fora da subárvore são invioláveis pela operação. [F-07 é o contraexemplo]", "s": "F-07", "seal": "🟡", "group": ""}, {"id": "RN-06", "d": "Pendência lógica informa e prioriza, nunca trava: árvore sem premissa grava-se — mas o painel diz onde ela ainda é organograma (&quot;S&amp;T sem premissa é organograma&quot;", "s": "", "seal": "", "group": ""}], "ints": [{"id": "INT-01", "d": "O M5 consome do M1 (ciclo 004) projeto, tenant/usuário, exclusão suave, desfazer de sessão, exportação/importação e vista tabular; consome da junta 003 identidade (<code>POST /auth/introspect</code>), isolamento por inquilino e OTel. Nada disso é reimplementado — é a única dependência técnica do módulo (F-12)", "s": "F-12", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "Telas deste módulo entram no registro de telas do E7.5 com identificador estável (<code>toc.snt_arvore</code>, <code>toc.snt_passo</code>, <code>toc.snt_tabela</code>, <code>toc.snt_acompanhamento</code>), no formato do ciclo 006; meta global, estratégia, tática e premissas marcam <code>ai_visible</code> campo a campo para o snapshot sanitizado — texto de usuário é sempre camada não-confiável (item 7 da constituição)", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "Importação da 4ª geração (execução: ciclo 011, E1.4 avançado): o export S&amp;T do <code>tocbuilderv3</code> traz <code>stepNumber</code> digitado e arestas livres (F-03, F-05); o importador do 011 reconstrói pai/ordem a partir de arestas e números, deriva a numeração e recusa com relato campo a campo quando a estrutura não fecha (inconsistência entre número digitado e aresta, número duplicado, ciclo). Este ciclo entrega o modelo que torna essa reconstrução possível; o importador é do 011 (L-04)", "s": "F-03, F-05", "seal": "🟡", "group": ""}, {"id": "INT-04", "d": "Nenhuma ação `toc. nasce neste ciclo — declaração explícita, não omissão: o round 010 não inclui assistência de IA para a S&amp;T, e vínculo automático com APR/AT está fora (F-11). Assistência futura entra por decisão nova sob o ADR 0007 e a FSM do ciclo 006", "s": "F-11", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/TOC-Builder/components/Sidebar.tsx", "rel": "/home/user/TOC-Builder/components/Sidebar.tsx", "lines": "44", "desc": "a S&T **habilitada** na 1ª geração: `{ id: 'snt', label: 'Árvore S&T', icon: <SnTIcon />, view: 'SNT_TREE' }` — sem flag `disabled`, ao contrário de NC/ARF/APR/AT nas linhas 45-48, todas `disabled: true`", "seal": "🟢", "internal": false, "t": "/home/user/TOC-Builder/components/Sidebar.tsx:44 — a S&amp;T habilitada na 1ª geração: { id: &#x27;snt&#x27;, label: &#x27;Árvore S&amp;T&#x27;, icon: &lt;SnTIcon /&gt;, view: &#x27;SNT_TREE&#x27; } — sem flag disabled, ao contrário de NC/ARF/APR/AT nas linhas 45-48, todas disabled: true"}, {"tag": "F-02", "path": "", "rel": "", "lines": "", "desc": "a regressão medida geração a geração, executada em 2026-09-03 (`grep -n \"'snt'\" <geração>/components/Sidebar.tsx`): `TOC-Builder-APP/components/Sidebar.tsx:44` sem `disabled` (2ª geração, habilitada); `TOC-Builder-V2/components/Sidebar.tsx:56` com `disabled: true` (3ª); `tocbuilderv3/components/Sidebar.tsx:58` com `disabled: true` (4ª) — habilitada→habilitada→desligada→desligada, sem decisão regis", "seal": "🟢", "internal": false, "t": " — a regressão medida geração a geração, executada em 2026-09-03 (grep -n &quot;&#x27;snt&#x27;&quot; &lt;geração&gt;/components/Sidebar.tsx): TOC-Builder-APP/components/Sidebar.tsx:44 sem disabled (2ª geração, habilitada); TOC-Builder-V2/components/Sidebar.tsx:56 com disabled: true (3ª); tocbuilderv3/components/Sidebar.tsx:58 com disabled: true (4ª) — habilitada→habilitada→desligada→desligada, sem decisão regis"}, {"tag": "F-03", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "270-311", "desc": "o modelo completo parado no código: `SnTStepStatus` com 4 valores em português (l.270-275; `sed -n '270,275p' types.ts | grep -c \"=\"` → `4`), `SnTStepCategory` com 6 valores (l.277-284; mesmo grep → `6`), `stepNumber: string; // e.g., \"1\", \"1.1\", \"1.1.2\"` digitado como texto livre (l.288), as **três premissas** `parallelAssumption` / `necessaryAssumptionToParent` / `sufficiencyOfChildrenAssumption", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:270-311 — o modelo completo parado no código: SnTStepStatus com 4 valores em português (l.270-275; sed -n &#x27;270,275p&#x27; types.ts | grep -c &quot;=&quot; → 4), SnTStepCategory com 6 valores (l.277-284; mesmo grep → 6), stepNumber: string; // e.g., &quot;1&quot;, &quot;1.1&quot;, &quot;1.1.2&quot; digitado como texto livre (l.288), as três premissas parallelAssumption / necessaryAssumptionToParent / sufficiencyOfChildrenAssumption"}, {"tag": "F-04", "path": "/home/user/TOC-Builder/types.ts", "rel": "/home/user/TOC-Builder/types.ts", "lines": "237-245", "desc": "o mesmo modelo já na **1ª geração**: `SnTStepNodeData` com `stepNumber` (l.239) e os três campos de premissa (l.243-245) — as três premissas não são invenção tardia, nasceram com a ferramenta", "seal": "🟢", "internal": false, "t": "/home/user/TOC-Builder/types.ts:237-245 — o mesmo modelo já na 1ª geração: SnTStepNodeData com stepNumber (l.239) e os três campos de premissa (l.243-245) — as três premissas não são invenção tardia, nasceram com a ferramenta"}, {"tag": "F-05", "path": "/home/user/tocbuilderv3/components/SnTStepEditorModal.tsx", "rel": "/home/user/tocbuilderv3/components/SnTStepEditorModal.tsx", "lines": "56-57", "desc": "o número digitado à mão: `if (!stepNumber.trim()) newErrors.stepNumber = \"O número do passo é obrigatório.\";` seguido do comentário `// Optionally, add validation for stepNumber format or uniqueness against existingStepNumbers` — obrigatório, texto livre, sem validação de formato nem unicidade; o RN-01 é a resposta", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/SnTStepEditorModal.tsx:56-57 — o número digitado à mão: if (!stepNumber.trim()) newErrors.stepNumber = &quot;O número do passo é obrigatório.&quot;; seguido do comentário // Optionally, add validation for stepNumber format or uniqueness against existingStepNumbers — obrigatório, texto livre, sem validação de formato nem unicidade; o RN-01 é a resposta"}, {"tag": "F-06", "path": "/home/user/tocbuilderv3/components/SnTStepEditorModal.tsx", "rel": "/home/user/tocbuilderv3/components/SnTStepEditorModal.tsx", "lines": "137-159", "desc": "as três premissas editáveis em três áreas de texto (`grep -c 'id=\"snt[A-Za-z]*Assumption\"' components/SnTStepEditorModal.tsx` → `3`: `sntParallelAssumption`, `sntNecessaryAssumption`, `sntSufficiencyAssumption`) — empilhadas, sem leitura dirigida contra pai e filhos; o RI-03 promove a disposição", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/SnTStepEditorModal.tsx:137-159 — as três premissas editáveis em três áreas de texto (grep -c &#x27;id=&quot;snt[A-Za-z]Assumption&quot;&#x27; components/SnTStepEditorModal.tsx → 3: sntParallelAssumption, sntNecessaryAssumption, sntSufficiencyAssumption) — empilhadas, sem leitura dirigida contra pai e filhos; o RI-03 promove a disposição"}, {"tag": "F-07", "path": "/home/user/tocbuilderv3/services/mockApiService.ts", "rel": "/home/user/tocbuilderv3/services/mockApiService.ts", "lines": "521", "desc": "o defeito de exclusão: `project.nodes = project.nodes.filter(n => n.id === nodeId);` — o filtro **mantém só o nó excluído** e descarta todos os outros passos do projeto (o predicado correto seria `!==`); excluir um passo destruía a árvore inteira. Vira o caso de teste da DoD 7", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/mockApiService.ts:521 — o defeito de exclusão: project.nodes = project.nodes.filter(n =&gt; n.id === nodeId); — o filtro mantém só o nó excluído e descarta todos os outros passos do projeto (o predicado correto seria !==); excluir um passo destruía a árvore inteira. Vira o caso de teste da DoD 7"}, {"tag": "F-08", "path": "/home/user/tocbuilderv3/services/mockApiService.ts", "rel": "/home/user/tocbuilderv3/services/mockApiService.ts", "lines": "417-580", "desc": "a superfície CRUD da linhagem: 10 funções S&T (`grep -c \"SnT.*= async\" services/mockApiService.ts` → `10` — criar/carregar/listar/excluir projeto, nó e aresta, atualizar detalhes) e **nenhuma delas calcula, valida ou renumera** numeração — a numeração era integralmente responsabilidade do usuário", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/mockApiService.ts:417-580 — a superfície CRUD da linhagem: 10 funções S&amp;T (grep -c &quot;SnT.= async&quot; services/mockApiService.ts → 10 — criar/carregar/listar/excluir projeto, nó e aresta, atualizar detalhes) e nenhuma delas calcula, valida ou renumera numeração — a numeração era integralmente responsabilidade do usuário"}, {"tag": "F-09", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "430-449", "desc": "`SNT_NODE_COLORS`: paleta por status (l.438-441) e por categoria (l.444-449) — a intenção visual de distinguir status na árvore, herdada como intenção (RI-02 exige forma e rótulo, nunca só cor)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts:430-449 — SNT_NODE_COLORS: paleta por status (l.438-441) e por categoria (l.444-449) — a intenção visual de distinguir status na árvore, herdada como intenção (RI-02 exige forma e rótulo, nunca só cor)"}, {"tag": "F-10", "path": "", "rel": "", "lines": "", "desc": "`docs/produto/visao.md` §6, defeito D-05 — \"A S&T é a única ferramenta que regrediu\", com as quatro linhas de Sidebar citadas e o veredito: \"Funcionalidade que regride sem decisão registrada é exatamente o que um ADR existe para impedir\"", "seal": "🟢", "internal": false, "t": " — docs/produto/visao.md §6, defeito D-05 — &quot;A S&amp;T é a única ferramenta que regrediu&quot;, com as quatro linhas de Sidebar citadas e o veredito: &quot;Funcionalidade que regride sem decisão registrada é exatamente o que um ADR existe para impedir&quot;"}, {"tag": "F-11", "path": "docs/produto/rounds.md", "rel": "docs/produto/rounds.md", "lines": "", "desc": "Round 010: aptidão executável (renumeração da subárvore por teste de domínio; três premissas persistidas e exibidas; jornada com captura), **fora** (vínculo automático com APR/AT), **sai primeiro** (E5.2), **nunca saem** (as três premissas — \"S&T sem premissa é organograma\")", "seal": "🟢", "internal": true, "t": "docs/produto/rounds.md — Round 010: aptidão executável (renumeração da subárvore por teste de domínio; três premissas persistidas e exibidas; jornada com captura), fora (vínculo automático com APR/AT), sai primeiro (E5.2), nunca saem (as três premissas — &quot;S&amp;T sem premissa é organograma&quot;)"}, {"tag": "F-12", "path": "docs/roadmap.md", "rel": "docs/roadmap.md", "lines": "", "desc": "Ciclo 010: portões (teste de renumeração; premissas persistidas; jornada de três níveis com captura) e a pré-condição única (\"O ciclo 004 promovido… a posição tardia é escolha de valor registrada\")", "seal": "🟢", "internal": true, "t": "docs/roadmap.md — Ciclo 010: portões (teste de renumeração; premissas persistidas; jornada de três níveis com captura) e a pré-condição única (&quot;O ciclo 004 promovido… a posição tardia é escolha de valor registrada&quot;)"}, {"tag": "F-13", "path": "docs/adr/0005-escopo-do-dominio-v1.md", "rel": "docs/adr/0005-escopo-do-dominio-v1.md", "lines": "", "desc": "alternativa descartada \"Cortar S&T da v1\": a ferramenta existe na linhagem (16 arquivos do `tocbuilderv3` citam `SnT`, medição colada lá) e cortá-la faria a sucessora nascer menor que o protótipo que aposenta", "seal": "🟢", "internal": true, "t": "docs/adr/0005-escopo-do-dominio-v1.md — alternativa descartada &quot;Cortar S&amp;T da v1&quot;: a ferramenta existe na linhagem (16 arquivos do tocbuilderv3 citam SnT, medição colada lá) e cortá-la faria a sucessora nascer menor que o protótipo que aposenta"}], "chain": [{"label": "spec.md", "href": "specs/010-estrategia-e-taticas/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/010-estrategia-e-taticas/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/010-estrategia-e-taticas/tasks.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/010-estrategia-e-taticas/qa-report.md", "state": "pending"}, {"label": "código do ciclo 010", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "A linhagem modelava um texto por passo (<code>strategyText</code>) mais uma categoria de 6 valores (F-03); o método S&amp;T pede estratégia e tática por passo. Assunção: estratégia e tática como campos distintos, e a categoria não portada — com os dois campos no passo, classificar o nó como &quot;Estratégia&quot; ou &quot;Tática&quot; perde a função, e VCD/BUILD/LEVERAGE são jargão sem uso registrado na linhagem além do enum e das cores (F-03, F-09). Risco baixo (adicionar uma classificação depois é campo opcional); a decisão vai a ADR se o gate a confirmar ([DÚVIDA] 1).", "risco": "baixo", "cmds": [], "paths": [], "s": "F-03, F-09"}, {"id": "L-02", "d": "A linhagem não restringia transições de status (nem registrava quem mudou). Assunção: transição livre entre os 4 valores com evento (RN-03) — impor FSM (ex.: <code>em_execucao</code> só depois de <code>validado</code>) travaria reuniões reais em que o plano executa antes de validar formalmente. Risco baixo; [DÚVIDA] 2.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-03", "d": "A linhagem não tinha ordem entre irmãos — os nós flutuavam por <code>pos_x</code>/<code>pos_y</code> (F-03) e o número digitado carregava a ordem implícita. Assunção: ordem ordinal explícita e persistida por irmão, fonte única da numeração (RN-01). Risco baixo — é a estrutura mínima que torna a numeração derivável.", "risco": "baixo", "cmds": [], "paths": [], "s": "F-03"}, {"id": "L-04", "d": "A importação dos exports S&amp;T da 4ª geração (ciclo 011, INT-03) vai encontrar <code>stepNumber</code> livre possivelmente inconsistente com as arestas. Assunção: o modelo deste ciclo (pai + ordem) é reconstruível de número + aresta na maioria dos casos, e o importador recusa com relato os demais — nunca importa estrutura ambígua em silêncio. Risco médio, pago no 011; o que este ciclo deve ao 011 é só o modelo estável.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-05", "d": "Múltiplas raízes são permitidas (numeradas 1..n), embora a prática canônica da S&amp;T seja uma raiz sob a meta global. Assunção: permitir e apontar pendência estilística custaria mais que aceitar — planos reais começam por listas de frentes. Risco baixo; [DÚVIDA] 3.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}]}, {"id": "011", "name": "Fundações da aplicação (M8 — Fundações da Aplicação)", "specNum": "011", "specPath": "specs/011-fundacoes-da-aplicacao/spec.md", "modules": ["M8"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE manter o dado desta aplicação em projeto PostgreSQL Neon próprio, que não compartilha unidade de restauração com nenhum outro produto da plataforma — restaurar esta aplicação NÃO DEVE rebobinar outro", "s": "F-11", "seal": "🟡", "group": "Unidade de restauração (F8.1.3)"}, {"id": "RF-02", "d": "O ciclo DEVE executar um ensaio de restauração a partir da cópia do provedor para um destino separado, subir a aplicação contra o destino restaurado e registrar a saída no <code>qa-report.md</code> — cópia não ensaiada não conta como apólice", "s": "F-11", "seal": "🟡", "group": "Unidade de restauração (F8.1.3)"}, {"id": "RF-03", "d": "O relatório do ensaio DEVE declarar o objetivo de ponto de recuperação e o de tempo de recuperação, o instante alvo, a duração medida e o que não volta com o banco (arquivos em armazenamento compatível com S3, índices reconstruídos)", "s": "F-11", "seal": "🟡", "group": "Unidade de restauração (F8.1.3)"}, {"id": "RF-04", "d": "O SISTEMA NÃO DEVE emitir DDL em nenhum caminho de execução — nem no arranque, nem sob condição; encontrando esquema incompatível, DEVE falhar no arranque imprimindo a diferença", "s": "F-13", "seal": "🟡", "group": "Unidade de restauração (F8.1.3)"}, {"id": "RF-05", "d": "A semeadura da base sintética DEVE ser comando explícito, jamais efeito colateral de tabela vazia, e NÃO DEVE existir caminho de execução que a dispare em produção", "s": "F-14", "seal": "🟡", "group": "Unidade de restauração (F8.1.3)"}, {"id": "RF-06", "d": "O SISTEMA DEVE manter toda cadeia visível ao usuário em dicionários versionados por idioma (<code>pt</code>, <code>en</code>), com o português como língua-fonte de toda chave", "s": "F-01, F-03", "seal": "🟡", "group": "Dicionário, língua-fonte e paridade (F8.3.1, F8.3.2, F8.3.4)"}, {"id": "RF-07", "d": "O SISTEMA NÃO DEVE conter literal visível fora do dicionário em componente, serviço ou mensagem de erro de interface; a verificação é função de aptidão da CI e imprime quantos arquivos e quantas cadeias examinou (regra R2)", "s": "F-03, F-04", "seal": "🟡", "group": "Dicionário, língua-fonte e paridade (F8.3.1, F8.3.2, F8.3.4)"}, {"id": "RF-08", "d": "A CI DEVE verificar paridade de chaves entre os dicionários: chave presente na língua-fonte e ausente na tradução é pendência declarada e listada; chave presente só na tradução é erro", "s": "F-15", "seal": "🟡", "group": "Dicionário, língua-fonte e paridade (F8.3.1, F8.3.2, F8.3.4)"}, {"id": "RF-09", "d": "QUANDO uma chave não for encontrada em desenvolvimento ou em teste, O SISTEMA DEVE lançar erro visível — nunca renderizar a chave crua na tela, que é o comportamento herdado que este requisito proíbe", "s": "F-12", "seal": "🟡", "group": "Dicionário, língua-fonte e paridade (F8.3.1, F8.3.2, F8.3.4)"}, {"id": "RF-10", "d": "QUANDO uma chave não for encontrada em produção, O SISTEMA DEVE cair para a cadeia da língua-fonte e registrar a ocorrência em log estruturado com a chave e a tela", "s": "F-12", "seal": "🟡", "group": "Dicionário, língua-fonte e paridade (F8.3.1, F8.3.2, F8.3.4)"}, {"id": "RF-11", "d": "O SISTEMA DEVE tratar termo de domínio da TOC como conceito com par declarado (por exemplo, Efeito Indesejável ↔ Undesirable Effect), publicado no glossário do produto — tradução de interface NÃO DEVE renomear conceito", "s": "", "seal": "🟡", "group": "Dicionário, língua-fonte e paridade (F8.3.1, F8.3.2, F8.3.4)"}, {"id": "RF-12", "d": "O SISTEMA DEVE resolver o idioma efetivo na ordem preferência da pessoa → idioma declarado pelo embarque → língua-fonte, e DEVE guardar o motivo da escolha para diagnóstico", "s": "", "seal": "🟡", "group": "Idioma efetivo e localização (F8.3.3, F8.3.5)"}, {"id": "RF-13", "d": "O SISTEMA DEVE persistir a preferência de idioma por (inquilino, usuário) no banco próprio — NÃO DEVE guardá-la apenas no navegador, como fazia a linhagem, onde a escolha morria com o dispositivo", "s": "F-16", "seal": "🟡", "group": "Idioma efetivo e localização (F8.3.3, F8.3.5)"}, {"id": "RF-14", "d": "QUANDO o embarque não declarar idioma e não houver preferência salva, O SISTEMA DEVE usar a língua-fonte e registrar a queda para o padrão em log estruturado", "s": "", "seal": "🟡", "group": "Idioma efetivo e localização (F8.3.3, F8.3.5)"}, {"id": "RF-15", "d": "O SISTEMA DEVE aplicar o idioma efetivo a toda a superfície — telas, mensagens de erro, textos de estado vazio, rótulos acessíveis e documentação embutida —, sem tela mista", "s": "", "seal": "🟡", "group": "Idioma efetivo e localização (F8.3.3, F8.3.5)"}, {"id": "RF-16", "d": "O SISTEMA DEVE formatar data, hora e número segundo o idioma efetivo, e ordenar listas alfabéticas pela colação correspondente", "s": "", "seal": "🟡", "group": "Idioma efetivo e localização (F8.3.3, F8.3.5)"}, {"id": "RF-17", "d": "O SISTEMA NÃO DEVE traduzir, reformatar ou reordenar conteúdo escrito por pessoa (título de nó, enunciado de UDE, premissa) nem identificador técnico", "s": "", "seal": "🟡", "group": "Idioma efetivo e localização (F8.3.3, F8.3.5)"}, {"id": "RF-18", "d": "O SISTEMA DEVE servir um acervo de documentação versionado no repositório, com ao menos um verbete por ferramenta registrada — ARA, NC, ARF, APR, AT e S&amp;T — mais o verbete da jornada de focalização", "s": "F-06, F-07", "seal": "🟡", "group": "Documentação embutida (E8.4)"}, {"id": "RF-19", "d": "O SISTEMA DEVE oferecer, de dentro de cada ferramenta, acesso ao verbete daquela ferramenta sem descarregar o trabalho em andamento", "s": "F-05", "seal": "🟡", "group": "Documentação embutida (E8.4)"}, {"id": "RF-20", "d": "O SISTEMA DEVE suportar âncoras: um controle de tela pode abrir a documentação diretamente no trecho correspondente", "s": "", "seal": "🟡", "group": "Documentação embutida (E8.4)"}, {"id": "RF-21", "d": "QUANDO o verbete não tiver tradução no idioma efetivo, O SISTEMA DEVE apresentá-lo na língua-fonte com aviso explícito de tradução pendente", "s": "", "seal": "🟡", "group": "Documentação embutida (E8.4)"}, {"id": "RF-22", "d": "Cada verbete DEVE citar a procedência da regra que descreve (spec do módulo e, quando houver, ADR), e as citações DEVEM resolver — conferido por função de aptidão", "s": "", "seal": "🟡", "group": "Documentação embutida (E8.4)"}, {"id": "RF-23", "d": "A CI DEVE falhar quando existir ferramenta registrada sem verbete, ou verbete órfão sem ferramenta, imprimindo as duas contagens", "s": "F-06", "seal": "🟡", "group": "Documentação embutida (E8.4)"}, {"id": "RF-24", "d": "O SISTEMA NÃO DEVE gerar texto de documentação em tempo de execução por modelo de linguagem: o acervo é conteúdo revisado e versionado (ADR 0007)", "s": "", "seal": "🟡", "group": "Documentação embutida (E8.4)"}, {"id": "RF-25", "d": "O SISTEMA DEVE aceitar, no fluxo de importação do M1, arquivos no formato exportado pela quarta geração da linhagem, reconhecendo-os por assinatura de conteúdo — nunca pelo nome do arquivo", "s": "F-08", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}, {"id": "RF-26", "d": "O SISTEMA DEVE converter o formato legado para o modelo canônico do M1 por serviço de domínio puro, testável sem rede e sem banco", "s": "", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}, {"id": "RF-27", "d": "O SISTEMA DEVE validar o arquivo legado inteiro antes de qualquer efeito e, na falha, recusar a importação completa com relato campo a campo (caminho do campo + motivo), sem criar nem alterar nada", "s": "F-09", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}, {"id": "RF-28", "d": "QUANDO a validação passar, O SISTEMA DEVE criar um projeto novo com identificadores novos e apresentar o relato com contagens por tipo de entidade — nunca substituir projeto existente", "s": "", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}, {"id": "RF-29", "d": "O SISTEMA DEVE descartar o histórico de conversa (<code>chatHistory</code>) presente no arquivo legado e declarar o descarte no relato, com a contagem de mensagens descartadas", "s": "F-08", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}, {"id": "RF-30", "d": "O SISTEMA DEVE recusar arquivo acima do teto de tamanho declarado em configuração, com código de erro categorizado, sem carregar o conteúdo na memória do serviço", "s": "", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}, {"id": "RF-31", "d": "O SISTEMA DEVE exportar um projeto multi-ferramenta num arquivo único, com seções por ferramenta e os vínculos de encadeamento entre elas, em ordem canônica e determinística", "s": "", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}, {"id": "RF-32", "d": "O SISTEMA DEVE garantir a ida e volta do formato consolidado: exportar, importar e exportar de novo produz arquivo estruturalmente idêntico, a menos de identificadores e carimbos de tempo — inclusive os vínculos entre ferramentas", "s": "", "seal": "🟡", "group": "Importação do formato legado e exportação consolidada (E1.4)"}], "ris": [{"id": "RI-01", "d": "O seletor de idioma é visível na superfície da aplicação, mostra o idioma efetivo e diz de onde ele veio (do embarque ou da minha escolha)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "Trocar de idioma não recarrega a página nem perde trabalho em andamento; o diagrama aberto permanece aberto", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "Nenhuma tela mistura idiomas: se o idioma efetivo é <code>en</code>, todo rótulo, estado vazio e mensagem de erro está em <code>en</code> — conferido por captura nos dois idiomas na jornada viva", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "A documentação embutida abre em painel lateral sobre a ferramenta (não em nova janela nem em modal bloqueante), com índice por tópico à esquerda e conteúdo à direita — a forma que a linhagem acertou", "s": "F-05", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "O painel de documentação tem ação explícita de fechar, devolve o foco ao controle de origem e é operável inteiramente por teclado", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "O verbete apresenta, além do texto, ao menos um exemplo sintético da &quot;Instituição Horizonte&quot; e a chamada para a ferramenta descrita quando a pessoa ainda não está nela", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "A tela de importação apresenta o relato na própria tela, com uma linha por problema (campo e motivo) ou o resumo do que entrou, incluindo a linha de descarte do histórico de conversa", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "A importação declara o formato reconhecido antes de aplicar (&quot;arquivo da geração anterior — será convertido&quot;), para a pessoa saber o que vai acontecer", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-09", "d": "A exportação consolidada mostra o que está sendo levado (ferramentas incluídas e número de vínculos) antes de gerar o arquivo", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-10", "d": "Toda superfície nova respeita o tema do hospedeiro com fallback e o modo só-conteúdo do ciclo 003, e funciona de 420 pixels de largura para cima", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-11", "d": "Datas, horas e números aparecem formatados pelo idioma efetivo em toda tela — inclusive nas listas e nos relatos de importação", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "Toda mutação nova (preferência de idioma, importação) emite traço OTel correlacionado e log estruturado com identificador de correlação — sem traço, não está pronta (P5)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "O domínio e a aplicação continuam sem framework, banco ou HTTP; o serviço de conversão do formato legado é domínio puro, e <code>import-linter</code> falha o build na violação (P3)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "A verificação de literal órfão e a de paridade de dicionários rodam na CI de todo pull request, e cada uma imprime o tamanho do que examinou (regra R2)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "A restauração ensaiada (RF-02) é executada uma vez dentro do ciclo, com saída colada; sem essa saída o ciclo não fecha — reversibilidade é entrega, não intenção", "s": "F-02", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Estrutura e dado evoluem em revisões separadas: nenhuma migração deste ciclo muda esquema e linhas ao mesmo tempo, e DDL destrutivo não viaja com o seu substituto — expandir → preencher → alternar leitura → parar de escrever → contrair", "s": "F-13", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "Toda migração deste ciclo tem <code>downgrade</code> testado em banco limpo, sem resíduo — o mesmo portão do ciclo 003", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "A importação de arquivo legado processa a validação sem bloquear o serviço para outros usuários e respeita o teto de tamanho configurado (RF-30)", "s": "F-30", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "Importar um arquivo legado de 200 nós e 300 arestas responde em menos de 5 segundos no percentil 95, medido no ciclo e registrado no <code>qa-report.md</code>", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-09", "d": "O acervo de documentação é servido com carregamento sob demanda por verbete, de modo que abri-lo não aumente o pacote inicial da aplicação em mais que o teto declarado em configuração", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-10", "d": "Nenhum segredo, chave ou credencial no cliente ou no repositório; as credenciais do ensaio de restauração vêm de variável de ambiente e não são impressas na saída colada (P7)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-11", "d": "Nenhum dado real de pessoa entra em fixture de importação, verbete de documentação ou captura de jornada — as fixtures são geradas por script a partir de personas fictícias (ADR 0006), e a CI roda a busca negativa", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-12", "d": "A cobertura de testes do domínio novo (conversão e validação do formato legado, resolução de idioma efetivo) é de no mínimo 85%, com os testes nascendo antes do código (P4)", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "A língua-fonte do produto é o português; toda chave existe primeiro nela, e a tradução é derivada — nunca o contrário", "s": "F-01", "seal": "🟡", "group": ""}, {"id": "RN-02", "d": "Termo de domínio da TOC é conceito, não rótulo: o par pt/en é declarado no glossário do produto e a interface usa o par, jamais uma tradução livre por tela", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-03", "d": "Conteúdo escrito por pessoa nunca é traduzido, reformatado ou reordenado pelo sistema", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-04", "d": "Uma ferramenta só é considerada entregue quando tem verbete de documentação embutida — cobertura é regra, não meta", "s": "F-06", "seal": "🟡", "group": ""}, {"id": "RN-05", "d": "Importação nunca muta projeto existente: o resultado é sempre projeto novo, com identificadores novos e mapeamento relatado (regra herdada do M1, ciclo 004, RF-35)", "s": "F-35", "seal": "🟡", "group": ""}, {"id": "RN-06", "d": "Todo descarte feito pela importação é declarado no relato — descarte silencioso é defeito, mesmo quando é a decisão certa (é o caso do histórico de conversa)", "s": "F-08", "seal": "🟡", "group": ""}, {"id": "RN-07", "d": "Cópia gerenciada pelo provedor no mesmo armazenamento e na mesma conta é conveniência; backup é o que já foi restaurado com sucesso em outro lugar", "s": "F-11", "seal": "🟢", "group": ""}], "ints": [{"id": "INT-01", "d": "O idioma declarado pelo embarque chega pelo envelope <code>ghd.</code> do ciclo 003 (<code>specs/003-esqueleto-federado/spec.md</code>) — a aplicação o lê como dado, nunca como instrução, e continua funcionando quando ele falta (RF-14)", "s": "F-14", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "As telas novas deste ciclo (painel de documentação, tela de importação) entram no registro de telas do ciclo 006 com identificador estável, para o snapshot sanitizado compô-las sem retrabalho", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "Nenhuma ação de catálogo <code>toc.*</code> nasce neste ciclo. Trocar idioma é preferência do titular sobre a própria interface — cabe no item 8 da constituição do projeto (alvo único nomeado pelo gesto, valor literal no controle, reversível na sessão); importar arquivo é mutação de projeto e segue a política por tipo de ação do ciclo 004", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-04", "d": "A matriz de aderência ao APH (<code>docs/integracao/aderencia-aph.md</code>) é re-verificada no pull request deste ciclo: as linhas que ele toca são a do preenchimento estruturado de argumentos (candidata declarada ao ciclo 011) e o registro de telas, e qualquer mudança de estado sai com evidência por caminho", "s": "", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/tocbuilderv3/specs/feat_internationalization_full.md", "rel": "/home/user/tocbuilderv3/specs/feat_internationalization_full.md", "lines": "1-6", "desc": "\"Especificação da Funcionalidade: Internacionalização (i18n)\", data 2024-08-02, status \"Em Andamento\"; objetivo declarado \"Traduzir 100% dos textos estáticos da interface\" — a primeira das duas specs de retrofit — uso: motivação do E8.3, RN-01", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/specs/feat_internationalization_full.md:1-6 — &quot;Especificação da Funcionalidade: Internacionalização (i18n)&quot;, data 2024-08-02, status &quot;Em Andamento&quot;; objetivo declarado &quot;Traduzir 100% dos textos estáticos da interface&quot; — a primeira das duas specs de retrofit — uso: motivação do E8.3, RN-01"}, {"tag": "F-02", "path": "/home/user/tocbuilderv3/specs/feat_internationalization_final_steps.md", "rel": "/home/user/tocbuilderv3/specs/feat_internationalization_final_steps.md", "lines": "1-4", "desc": "\"Conclusão da Internacionalização (Fase 1)\", mesma data — a segunda spec, necessária porque a primeira não terminou. Contagem executada: `ls /home/user/tocbuilderv3/specs/` devolve **5** arquivos, **2** deles de i18n (saída colada em § O quê e por quê) — uso: argumento do \"desde o início\"", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/specs/feat_internationalization_final_steps.md:1-4 — &quot;Conclusão da Internacionalização (Fase 1)&quot;, mesma data — a segunda spec, necessária porque a primeira não terminou. Contagem executada: ls /home/user/tocbuilderv3/specs/ devolve 5 arquivos, 2 deles de i18n (saída colada em § O quê e por quê) — uso: argumento do &quot;desde o início&quot;"}, {"tag": "F-03", "path": "/home/user/tocbuilderv3", "rel": "/home/user/tocbuilderv3", "lines": "", "desc": "medição executada: `find . -name \"*.tsx\" -not -path \"./node_modules/*\" | wc -l` → `51`; `grep -rL \"useI18n\" --include=\"*.tsx\" . | grep -v node_modules | wc -l` → `25`. Vinte e cinco dos cinquenta e um arquivos de componente nunca importaram o mecanismo, duas specs depois — uso: RF-06, RF-07", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3 — medição executada: find . -name &quot;.tsx&quot; -not -path &quot;./node_modules/&quot; | wc -l → 51; grep -rL &quot;useI18n&quot; --include=&quot;.tsx&quot; . | grep -v node_mod
