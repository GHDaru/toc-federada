rage` sob a chave `toc_builder_locale`: escolha presa a um navegador, o mesmo vício do dado (defeito D-07 da visão) aplicado à configuração — uso: RF-13", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/i18n/I18nProvider.tsx:15,23-28 — a preferência de idioma vive em localStorage sob a chave toc_builder_locale: escolha presa a um navegador, o mesmo vício do dado (defeito D-07 da visão) aplicado à configuração — uso: RF-13"}, {"tag": "F-17", "path": "docs/produto/rounds.md", "rel": "docs/produto/rounds.md", "lines": "", "desc": "Round 011: apetite de um ciclo, aptidão executável (nenhuma cadeia fora do dicionário, com contagem; rota de documentação por ferramenta; import legado cria ou recusa campo a campo), \"sai primeiro: o E1.4 avançado\", \"nunca sai: o portão de i18n\" — uso: § O que entra como dado, corte de apetite", "seal": "🟢", "internal": true, "t": "docs/produto/rounds.md — Round 011: apetite de um ciclo, aptidão executável (nenhuma cadeia fora do dicionário, com contagem; rota de documentação por ferramenta; import legado cria ou recusa campo a campo), &quot;sai primeiro: o E1.4 avançado&quot;, &quot;nunca sai: o portão de i18n&quot; — uso: § O que entra como dado, corte de apetite"}, {"tag": "F-18", "path": "", "rel": "", "lines": "", "desc": "`docs/produto/visao.md` §7, pergunta 5 — \"Português primeiro, com inglês desde o início — confirma?\", com a proposta de manter pt/en desde o início e o português como língua-fonte da linguagem ubíqua; e a pergunta 2, que propõe **não** migrar nada automaticamente da linhagem: quem quiser, exporta e importa pelo E1.4 — uso: RN-01, RN-02, RF-25", "seal": "🟢", "internal": false, "t": " — docs/produto/visao.md §7, pergunta 5 — &quot;Português primeiro, com inglês desde o início — confirma?&quot;, com a proposta de manter pt/en desde o início e o português como língua-fonte da linguagem ubíqua; e a pergunta 2, que propõe não migrar nada automaticamente da linhagem: quem quiser, exporta e importa pelo E1.4 — uso: RN-01, RN-02, RF-25"}], "chain": [{"label": "spec.md", "href": "specs/011-fundacoes-da-aplicacao/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/011-fundacoes-da-aplicacao/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/011-fundacoes-da-aplicacao/tasks.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/011-fundacoes-da-aplicacao/qa-report.md", "state": "pending"}, {"label": "código do ciclo 011", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "A restauração ensaiada depende de recursos do provedor (cópia gerenciada e recuperação a um ponto no tempo) cujo plano contratado não está declarado em lugar nenhum deste repositório — assunção: o plano do projeto Neon próprio permite restaurar para um destino separado dentro da janela declarada; se não permitir, o ensaio vira o ADR que decide a alternativa — risco alto (é a diferença entre ter e não ter apólice).", "risco": "alto", "cmds": [], "paths": [], "s": ""}, {"id": "L-02", "d": "O idioma declarado pelo embarque depende de o hospedeiro enviá-lo no envelope <code>ghd.*</code>; a spec 003 não o inclui entre os quatro parâmetros de admissão — assunção: quando ausente, a ordem do RF-12 resolve sem erro (preferência → padrão) e a lacuna vira mensagem ao hospedeiro por <code>mensagens/NNN</code> (P1: relatar e parar) — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-03", "d": "O formato exportado pela quarta geração está medido só nas duas ferramentas que exportavam (ARA e, por composição, a NC); ferramentas que nunca existiram nunca exportaram — assunção: o adaptador cobre o que existe e recusa o resto com relato, em vez de fingir converter — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-04", "d": "O teto de crescimento do pacote inicial pela documentação embutida (RNF-09) é número a fixar na abertura; não há medição própria ainda — assunção: carregamento sob demanda por verbete mantém o custo marginal, e a medição real entra na jornada viva — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-05", "d": "A função de aptidão de literal órfão tem falso positivo conhecido (cadeias de diagnóstico, atributos técnicos) — assunção: a verificação usa lista de exceções declarada com motivo por linha, no mesmo padrão do <code>scripts/check-caminhos.sh</code>, e exceção sem motivo falha o portão — risco médio (uma lista de exceções sem motivo é exatamente como um portão passa a mentir).", "risco": "médio", "cmds": [], "paths": [], "s": ""}]}, {"id": "012", "name": "Jornadas e autodeclaração (ciclo transversal — fechamento da v1)", "specNum": "012", "specPath": "specs/012-jornadas-e-autodeclaracao/spec.md", "modules": [], "rfs": [{"id": "RF-01", "d": "O SISTEMA DE DOCUMENTAÇÃO DEVE regerar todas as capturas de todas as jornadas a partir do build atual, por script versionado, e a regeneração DEVE ser determinística — duas execuções sem mudança de código produzem imagens idênticas", "s": "F-08", "seal": "🟡", "group": "Jornadas vivas consolidadas"}, {"id": "RF-02", "d": "QUANDO uma captura regerada divergir da commitada, O CICLO DEVE tratar a divergência como achado nomeado (qual jornada, qual captura, o que mudou), nunca como atualização silenciosa", "s": "", "seal": "🟡", "group": "Jornadas vivas consolidadas"}, {"id": "RF-03", "d": "O CICLO DEVE entregar uma jornada de travessia de ponta a ponta que atravesse ARA → NC → ARF → APR → AT com a focalização costurando, usando uma única persona sintética do início ao fim", "s": "F-10", "seal": "🟡", "group": "Jornadas vivas consolidadas"}, {"id": "RF-04", "d": "A jornada de travessia DEVE declarar, elo a elo, em que ciclo a tela mostrada nasceu, ligando cada captura à spec do módulo correspondente", "s": "", "seal": "🟡", "group": "Jornadas vivas consolidadas"}, {"id": "RF-05", "d": "O CICLO DEVE produzir uma avaliação heurística datada do conjunto, com quem avaliou, em que contexto, o que não foi avaliado, e cada achado com severidade e destino (corrigido aqui, ou dívida registrada com dono)", "s": "F-08", "seal": "🟡", "group": "Jornadas vivas consolidadas"}, {"id": "RF-06", "d": "O CICLO DEVE manter um índice de jornadas em que cada entrada aponte o ciclo de nascimento, o estágio (protótipo, viva) e as capturas que a sustentam", "s": "F-11", "seal": "🟡", "group": "Jornadas vivas consolidadas"}, {"id": "RF-07", "d": "A CI DEVE falhar quando existir captura não citada por nenhuma jornada, ou jornada citando captura inexistente, imprimindo as duas contagens", "s": "", "seal": "🟡", "group": "Jornadas vivas consolidadas"}, {"id": "RF-08", "d": "O CICLO DEVE preencher a matriz de aderência ao APH de modo que nenhuma célula de evidência fique vazia em linha cujo status seja atendido ou parcial", "s": "F-01", "seal": "🟡", "group": "Matriz de aderência com evidência"}, {"id": "RF-09", "d": "Cada linha atendida DEVE citar caminho de arquivo e o teste, a saída de suíte ou a captura que a sustenta — evidência é caminho, não adjetivo", "s": "", "seal": "🟡", "group": "Matriz de aderência com evidência"}, {"id": "RF-10", "d": "Cada linha parcial DEVE nomear o que falta, e cada linha fora do alvo DEVE declarar a condição de reentrada", "s": "", "seal": "🟡", "group": "Matriz de aderência com evidência"}, {"id": "RF-11", "d": "Cada linha delegada à fundação DEVE declarar a delegação, o ADR que a decide e a metade que continua nossa, com a evidência dessa metade", "s": "F-12", "seal": "🟡", "group": "Matriz de aderência com evidência"}, {"id": "RF-12", "d": "O CICLO DEVE registrar a revisão da matriz no seu próprio registro de revisões (data, o que mudou, por quem) e re-verificá-la no mesmo pull request de qualquer mudança de fronteira", "s": "F-01", "seal": "🟡", "group": "Matriz de aderência com evidência"}, {"id": "RF-13", "d": "O CICLO DEVE executar a suíte de conformidade do Nível 1 do <code>GHDaru/protocolos</code> contra a URL publicada da aplicação, e registrar o relatório integral no repositório", "s": "F-05", "seal": "🟡", "group": "Conformidade executável do Nível 1"}, {"id": "RF-14", "d": "O registro da execução DEVE conter data, versão da norma medida, alvo (endereço), revisão do nosso código, perfil aplicado (se houver) e o veredito como saiu — inclusive quando for &quot;não apto&quot;", "s": "F-07", "seal": "🟡", "group": "Conformidade executável do Nível 1"}, {"id": "RF-15", "d": "QUANDO a nossa superfície divergir do canônico em endereço ou vocabulário, O CICLO DEVE usar perfil de adaptação versionado no nosso repositório, e o relatório DEVE listar cada tradução aplicada", "s": "F-09", "seal": "🟡", "group": "Conformidade executável do Nível 1"}, {"id": "RF-16", "d": "O perfil NÃO DEVE declarar operação ausente para escapar de um check: declarar ausente faz o check falhar, e é assim que ele deve ser usado", "s": "F-09", "seal": "🟡", "group": "Conformidade executável do Nível 1"}, {"id": "RF-17", "d": "Os itens que a caixa-preta não alcança DEVEM ser listados um a um, cada um com a evidência interna (caminho e teste próprio), e NÃO DEVEM ser contados como verificados", "s": "F-06", "seal": "🟡", "group": "Conformidade executável do Nível 1"}, {"id": "RF-18", "d": "QUANDO o veredito da suíte for &quot;não apto&quot;, O CICLO DEVE registrar cada falha com a decisão associada — corrigir neste ciclo, ou declarar a lacuna com dono e prazo —, e a autodeclaração DEVE refletir o estado real", "s": "F-07", "seal": "🟡", "group": "Conformidade executável do Nível 1"}, {"id": "RF-19", "d": "O CICLO DEVE produzir um ADR de autodeclaração de conformidade que declare explicitamente o lado aplicação do Anexo B, citando a cláusula que obriga a declaração por lado", "s": "F-03", "seal": "🟡", "group": "Autodeclaração e site"}, {"id": "RF-20", "d": "A autodeclaração DEVE vir acompanhada da maturidade dos itens experimentais que nos tocam, na forma que a norma exige", "s": "F-04", "seal": "🟡", "group": "Autodeclaração e site"}, {"id": "RF-21", "d": "A autodeclaração DEVE nomear os limites da própria prova: não há suíte executável para o Nível 2, nem para o lado aplicação do Anexo B — e dizer por quê (o canal exige navegador)", "s": "F-02", "seal": "🟡", "group": "Autodeclaração e site"}, {"id": "RF-22", "d": "A autodeclaração DEVE ter uma linha por requisito do alvo declarado, com veredito e evidência, derivada da matriz de aderência — uma fonte, duas apresentações, jamais duas verdades", "s": "", "seal": "🟡", "group": "Autodeclaração e site"}, {"id": "RF-23", "d": "O CICLO DEVE regerar o site de produto pelo gerador versionado e provar que o commitado não diverge do gerado (diferença vazia na CI)", "s": "F-13", "seal": "🟡", "group": "Autodeclaração e site"}, {"id": "RF-24", "d": "Toda contagem exibida no site (requisitos, specs, ciclos, jornadas) DEVE ser derivada dos arquivos pelo gerador, nunca digitada", "s": "F-13", "seal": "🟡", "group": "Autodeclaração e site"}], "ris": [{"id": "RI-01", "d": "O índice de jornadas apresenta as seis jornadas mais a travessia, cada uma com ciclo de nascimento, estágio e número de capturas", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "A jornada de travessia apresenta os elos em ordem narrativa, com uma captura por elo e o nome do ciclo em que a tela nasceu ao lado de cada captura", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "A avaliação heurística apresenta os achados em tabela — severidade, tela, achado, destino —, com o limite da avaliação declarado antes da tabela, não em nota de rodapé", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "O site de produto oferece navegação por módulo, por ciclo e por requisito, com rastreabilidade nos dois sentidos (do requisito à fonte e da fonte aos requisitos que a usam)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "O site expõe uma nota de honestidade: o que está implementado, o que está planejado e o que é lacuna — com a mesma legenda de selos usada nas specs", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "Nenhuma captura de jornada, e nenhuma página do site, contém dado real de pessoa: as telas capturadas exibem exclusivamente a base sintética", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "A regeneração das capturas roda em ambiente controlado e versionado (mesma resolução, mesmo tema, mesma base sintética), para que a diferença detectada seja mudança de produto e não de ambiente", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "O relatório de execução da suíte é registro imutável: medição nova entra como registro novo com data própria; o anterior não é reescrito", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "A execução da suíte NÃO DEVE exigir credencial gravada em arquivo: quando houver autenticação, ela vem de variável de ambiente e o token não é impresso nem versionado (P7)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "A geração do site é determinística: duas execuções sobre o mesmo corpus produzem saída byte-idêntica, o que torna o portão de divergência confiável", "s": "F-13", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "A verificação de captura órfã e a de célula vazia da matriz rodam na CI e imprimem o tamanho do que examinaram (regra R2)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "Nenhum dado real de pessoa em captura, fixture, relatório de execução ou página do site — busca negativa executada na CI (ADR 0006)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "A execução da suíte contra a URL publicada não altera dado de produção: roda contra ambiente ou inquilino de teste com base sintética, e o registro declara contra qual", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "Toda afirmação factual do ADR de autodeclaração — contagem de requisitos, número de checks, veredito — é executada e colada, nunca transcrita (regra R1)", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "Conformidade se declara por lado. Uma declaração que não diga se fala do hospedeiro, da aplicação ou dos dois é declaração vazia — metade das obrigações não é sua", "s": "F-03", "seal": "🟢", "group": ""}, {"id": "RN-02", "d": "Onde existe suíte, ela roda; onde não existe, a evidência é caminho mais teste próprio e o limite é declarado. Nunca se declara verificado o que só foi afirmado", "s": "F-02, F-06", "seal": "🟢", "group": ""}, {"id": "RN-03", "d": "Perfil de adaptação é dicionário, não isenção: traduz endereço e vocabulário, e declarar operação ausente faz o check falhar", "s": "F-09", "seal": "🟢", "group": ""}, {"id": "RN-04", "d": "Veredito negativo é resultado legítimo e entra no repositório como saiu; o que não é legítimo é declarar sem medir", "s": "F-07", "seal": "🟡", "group": ""}, {"id": "RN-05", "d": "Registro de execução e ADR de autodeclaração são história: corrigem-se por acréscimo (registro novo, ADR que sucede), nunca por reescrita — regra R5 e o guarda do método", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-06", "d": "Jornada sem captura de build real é ficção, e captura que não regenera é captura que envelheceu sem testemunha", "s": "F-08", "seal": "🟢", "group": ""}], "ints": [{"id": "INT-01", "d": "A suíte do Nível 1 é executada de fora, contra a URL publicada — o <code>GHDaru/protocolos</code> permanece leitura (P1); nada dele é copiado para cá. O que fica aqui é o perfil (se houver) e o registro da execução", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "A autodeclaração cobre o alvo do ADR 0003 — Nível 2 (Operador), <code>mode: embedded</code>, lado aplicação do Anexo B — e nada além; o lado hospedeiro não é nosso para declarar", "s": "F-03", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "Lacuna encontrada na norma ou na fundação durante a medição não se corrige lá: vira <code>mensagens/NNN-para-&lt;repo&gt;-&lt;assunto&gt;.md</code> com evidência por <code>arquivo:linha</code> e o commit lido (P1: relatar e parar)", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-04", "d": "O site de produto consome as specs, os ADRs e as jornadas como entrada do gerador versionado (ADR 0008); a autodeclaração publicada no site é a mesma do ADR, gerada dele, não redigida de novo", "s": "", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "docs/integracao/aderencia-aph.md", "rel": "docs/integracao/aderencia-aph.md", "lines": "", "desc": "a matriz do lado aplicação, com o estado honesto declarado no cabeçalho (\"Nada foi implementado; nenhuma linha está atendida; toda coluna de evidência está vazia de propósito\"), a legenda de status, a linha `§B.11.3 / §B.12.1` marcada \"planejado — ciclo 012 (autodeclaração em ADR)\" e o registro de revisões — uso: RF-08..RF-12, INT-02", "seal": "🟢", "internal": true, "t": "docs/integracao/aderencia-aph.md — a matriz do lado aplicação, com o estado honesto declarado no cabeçalho (&quot;Nada foi implementado; nenhuma linha está atendida; toda coluna de evidência está vazia de propósito&quot;), a legenda de status, a linha §B.11.3 / §B.12.1 marcada &quot;planejado — ciclo 012 (autodeclaração em ADR)&quot; e o registro de revisões — uso: RF-08..RF-12, INT-02"}, {"tag": "F-02", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "215", "desc": "§B.12.2: o lado do hospedeiro tem verificação executável; o **lado da aplicação não tem**, \"porque o canal exige navegador, e uma suíte que fingisse cobri-lo seria pior que a sua ausência\". Reforçado em `:193` (§B.11.2): \"quem declara o lado da aplicação declara sem suíte\" — uso: RF-21, RN-02", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:215 — §B.12.2: o lado do hospedeiro tem verificação executável; o lado da aplicação não tem, &quot;porque o canal exige navegador, e uma suíte que fingisse cobri-lo seria pior que a sua ausência&quot;. Reforçado em :193 (§B.11.2): &quot;quem declara o lado da aplicação declara sem suíte&quot; — uso: RF-21, RN-02"}, {"tag": "F-03", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "213", "desc": "§B.12.1: \"Quem declara conformidade **DEVE** declarar **por lado**, e a declaração de um lado não fala pelo outro. 'Somos conformes ao Anexo B', sem dizer qual lado, é declaração vazia: metade das obrigações não é sua.\" — uso: RF-19, RN-01, INT-02", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:213 — §B.12.1: &quot;Quem declara conformidade DEVE declarar por lado, e a declaração de um lado não fala pelo outro. &#x27;Somos conformes ao Anexo B&#x27;, sem dizer qual lado, é declaração vazia: metade das obrigações não é sua.&quot; — uso: RF-19, RN-01, INT-02"}, {"tag": "F-04", "path": "/home/user/protocolos/padrao/anexo-b-federacao.md", "rel": "/home/user/protocolos/padrao/anexo-b-federacao.md", "lines": "199", "desc": "§B.11.3: declarar conformidade ao Anexo B \"DEVE vir acompanhada de qual lado se implementou (hospedeiro, aplicação, ou ambos) e da maturidade dos itens 🧪 desta versão, que hoje são pelo menos o §B.6.6 e o §B.6.7\" — uso: RF-20", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-b-federacao.md:199 — §B.11.3: declarar conformidade ao Anexo B &quot;DEVE vir acompanhada de qual lado se implementou (hospedeiro, aplicação, ou ambos) e da maturidade dos itens 🧪 desta versão, que hoje são pelo menos o §B.6.6 e o §B.6.7&quot; — uso: RF-20"}, {"tag": "F-05", "path": "/home/user/protocolos/conformidade/README.md", "rel": "/home/user/protocolos/conformidade/README.md", "lines": "9-12", "desc": "como a suíte roda: `node suite.mjs https://sua-app.exemplo.com`, caixa-preta contra uma URL, \"exit 0 = apto nos itens verificáveis\" — uso: RF-13, INT-01", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/conformidade/README.md:9-12 — como a suíte roda: node suite.mjs https://sua-app.exemplo.com, caixa-preta contra uma URL, &quot;exit 0 = apto nos itens verificáveis&quot; — uso: RF-13, INT-01"}, {"tag": "F-06", "path": "/home/user/protocolos/conformidade/README.md", "rel": "/home/user/protocolos/conformidade/README.md", "lines": "66-78,115", "desc": "contagem executada: `grep -cE \"^\\| \\`[a-z-]+\\` \\| \" README.md` → `11` (os checks executáveis, de `superficie-sessao` a `snapshot-fechado`); e a contagem das entradas de `DECLARADOS` em `suite.mjs` → `12`. O README fecha a conta: \"o Nível 1 completo = 11 verificados + 12 declarados\" — uso: RF-17, RN-02", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/conformidade/README.md:66-78,115 — contagem executada: grep -cE &quot;^\\| \\[a-z-]+\\ \\| &quot; README.md → 11 (os checks executáveis, de superficie-sessao a snapshot-fechado); e a contagem das entradas de DECLARADOS em suite.mjs → 12. O README fecha a conta: &quot;o Nível 1 completo = 11 verificados + 12 declarados&quot; — uso: RF-17, RN-02"}, {"tag": "F-07", "path": "/home/user/protocolos/conformidade/execucoes/2026-08-06-ghdaru.md", "rel": "/home/user/protocolos/conformidade/execucoes/2026-08-06-ghdaru.md", "lines": "11", "desc": "a primeira aplicação real medida pela suíte, a própria fundação: \"**NÃO APTO ao Nível 1 (Observador)** — 8 de 11 checks verificados, 1 aviso, **2 falhas**\". O registro traz data, commit medido e o aviso de que num commit posterior as linhas derivam — \"refaça a medição em vez de supor\" — uso: RF-14, RF-18, RN-04, RNF-02", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/conformidade/execucoes/2026-08-06-ghdaru.md:11 — a primeira aplicação real medida pela suíte, a própria fundação: &quot;NÃO APTO ao Nível 1 (Observador) — 8 de 11 checks verificados, 1 aviso, 2 falhas&quot;. O registro traz data, commit medido e o aviso de que num commit posterior as linhas derivam — &quot;refaça a medição em vez de supor&quot; — uso: RF-14, RF-18, RN-04, RNF-02"}, {"tag": "F-08", "path": "docs/jornadas/README.md", "rel": "docs/ const MODULES = D.modules;
const el = document.getElementById("content");
let specFilter = "all";
let typeFilter = "all";
let searchTerm = "";
const KINDS = [
  {key:"rfs",  id:"RF",  label:"Requisitos funcionais",     cls:"rf",  head:"Requisito funcional (forma EARS)"},
  {key:"ris",  id:"RI",  label:"Requisitos de interface",   cls:"ri",  head:"Requisito de interface (tela, estado, acessibilidade)"},
  {key:"rnfs", id:"RNF", label:"Requisitos não funcionais", cls:"rnf", head:"Requisito não funcional (desempenho, segurança, observabilidade)"},
  {key:"rns",  id:"RN",  label:"Regras de negócio",         cls:"rn",  head:"Regra de negócio da TOC (domínio puro, testável sem rede)"},
  {key:"ints", id:"INT", label:"Integrações",               cls:"int", head:"Integração (fronteira APH: ação do catálogo, tela do registro)"}
];
const KEYS = KINDS.map(k=>k.key);
// "L" não é um tipo de requisito: é a lacuna declarada. Anda junto no mesmo filtro porque
// quem audita rastreabilidade precisa ver, na mesma tela, o que foi prometido e o que
// assumidamente não se sabe.
const LAC = "L";

function activeKeys(){
  if(typeFilter==="all") return KEYS;
  if(typeFilter===LAC) return [];
  return KINDS.filter(k=>k.id===typeFilter).map(k=>k.key);
}
function showLacunas(){ return typeFilter==="all" || typeFilter===LAC; }

function totals(){
  let t = {rf:0, ri:0, rnf:0, rn:0, int:0, src:0, comFonte:0, total:0,
           lac:0, alto:0, medio:0, baixo:0, semRisco:0, lacEvid:0, lacFonte:0};
  MODULES.forEach(m=>{
    t.rf+=m.rfs.length; t.ri+=m.ris.length; t.rnf+=m.rnfs.length;
    t.rn+=m.rns.length; t.int+=m.ints.length; t.src+=m.sources.length;
    KEYS.forEach(k=>m[k].forEach(r=>{ t.total++; if(r.s) t.comFonte++; }));
    (m.lacunas||[]).forEach(l=>{
      t.lac++;
      if(l.risco==="alto") t.alto++;
      else if(l.risco==="médio") t.medio++;
      else if(l.risco==="baixo") t.baixo++;
      else t.semRisco++;
      if((l.cmds&&l.cmds.length)||(l.paths&&l.paths.length)) t.lacEvid++;
      if(l.s) t.lacFonte++;
    });
  });
  return t;
}

function riskPill(l){
  const r = l.risco||"";
  const cls = r==="alto" ? "risk-hi" : r==="médio" ? "risk-mid" : r==="baixo" ? "risk-lo" : "risk-na";
  return `<span class="risk-pill ${cls}" title="risco declarado pela própria spec">${r||"risco não declarado"}</span>`;
}

function lacunaTable(m){
  const ls = m.lacunas||[];
  if(!ls.length){
    return `<div class="req-table lac-table"><div class="rt-head"><span>ID</span><span>Lacunas declaradas — 0 L</span><span class="rt-src">Risco</span></div>`
         + `<div class="lac-empty">Esta spec não declarou nenhuma lacuna. Isso não é ausência de risco — é ausência de declaração, e conta contra a spec, não a favor.</div></div>`;
  }
  const rows = ls.map(l=>{
    const cmd = (l.cmds&&l.cmds.length)
      ? `<div class="lac-ev"><span class="lac-ev-lbl">comando executado</span>${l.cmds.join(" · ")}</div>` : "";
    const ev = (l.paths&&l.paths.length)
      ? `<div class="lac-ev"><span class="lac-ev-lbl">evidência arquivo:linha</span>${l.paths.join(" · ")}</div>` : "";
    const src = l.s
      ? `<div class="lac-src">fonte (backward): ${srcLinks(l, m)}</div>`
      : `<div class="lac-src">fonte (backward): <span class="faint" title="lacuna sem fonte citada: nasce da ausência de precedente, não de um documento lido">—</span></div>`;
    const where = `<span class="lac-where">ciclo ${m.id} · <a href="../../${m.specPath}">${m.specPath}</a></span>`;
    return `<div class="req-row lac"><span class="req-id">🔴 ${l.id}</span>`
         + `<span class="req-desc">${where}${l.d}${cmd}${ev}${src}</span>`
         + `<span class="req-src">${riskPill(l)}</span></div>`;
  }).join("");
  return `<div class="req-table lac-table"><div class="rt-head"><span>ID</span>`
       + `<span>Lacunas declaradas — ${ls.length} L (lacuna · assunção · risco, como a spec escreveu)</span>`
       + `<span class="rt-src">Risco</span></div>${rows}</div>`;
}

function seal(r){
  if(r.seal==="🟢") return '<span class="st-pill ok" title="confirmado com arquivo:linha">🟢</span>';
  if(r.seal==="🔴") return '<span class="st-pill na" title="lacuna">🔴</span>';
  if(r.seal==="🟡") return '<span class="st-pill wip" title="planejado">🟡</span>';
  return '';
}

function srcLinks(r, m){
  if(!r.s) return '<span class="faint" title="requisito sem fonte na linhagem: nasce da norma ou da decisão deste projeto">—</span>';
  return r.s.split(", ").map(tag=>{
    const s = m.sources.find(x=>x.tag===tag);
    if(!s) return tag;
    if(s.internal) return `<a href="../../${s.rel}" title="${s.t}">${tag}</a>`;
    return `<span class="ext" title="${s.t}">${tag}</span>`;
  }).join(" ");
}

function chainRow(m){
  const parts = m.chain.map(c=>{
    const cls = c.state==="todo" ? "fwd-link todo" : (c.state==="pending" ? "fwd-link pending" : "fwd-link");
    return c.href ? `<a class="${cls}" href="../../${c.href}">${c.label}</a>` : `<span class="${cls}">${c.label}</span>`;
  });
  return `<div class="fwd-row"><span class="fwd-label">cadeia forward do ciclo</span> ${parts.join(' <span class="fwd-arrow">→</span> ')} <span class="fwd-ac">↳ a cadeia é do ciclo, não do requisito: nenhum requisito tem código hoje, e fingir granularidade seria mentir</span></div>`;
}

function renderOverview(){
  const t = totals();
  const pct = t.total ? Math.round(t.comFonte/t.total*100) : 0;
  const tiles = `
    <div class="grid grid-3" style="margin-bottom:14px">
      <div class="stat-tile"><div class="num">${t.rf}</div><div class="lbl">Requisitos funcionais</div></div>
      <div class="stat-tile"><div class="num">${t.ri}</div><div class="lbl">Requisitos de interface</div></div>
      <div class="stat-tile"><div class="num">${t.rnf}</div><div class="lbl">Requisitos não funcionais</div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:14px">
      <div class="stat-tile"><div class="num">${t.rn}</div><div class="lbl">Regras de negócio</div></div>
      <div class="stat-tile"><div class="num">${t.int}</div><div class="lbl">Integrações</div></div>
      <div class="stat-tile"><div class="num">${t.total}</div><div class="lbl">Itens de requisito (os 5 tipos)</div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:28px">
      <div class="stat-tile"><div class="num">${t.src}</div><div class="lbl">Fontes declaradas (F-NN)</div></div>
      <div class="stat-tile"><div class="num">${pct}%</div><div class="lbl">Desses, citam uma fonte</div></div>
      <div class="stat-tile"><div class="num">${t.lac}</div><div class="lbl">Lacunas declaradas (L-NN)</div></div>
    </div>`;
  const altas = [];
  MODULES.forEach(m=>(m.lacunas||[]).forEach(l=>{ if(l.risco==="alto") altas.push({m:m, l:l}); }));
  const lacPanel = `
    <div class="lac-panel">
      <h3>O que assumidamente não sabemos — ${t.lac} lacunas declaradas</h3>
      <p class="lac-lede">Uma lacuna (L-NN) é o que a spec <b>não</b> sabe: o buraco, a assunção que se fez no lugar dele e o risco de a assunção estar errada. Está nesta página, e não escondida no fim de cada arquivo, porque uma matriz de rastreabilidade que só mostra o que foi prometido mede metade da verdade. ${t.lacFonte} das ${t.lac} citam uma fonte F-NN; ${t.lacEvid} trazem comando executado ou evidência <code>arquivo:linha</code> colada.</p>
      <div class="lac-bars">
        <div class="lac-bar hi"><div class="n">${t.alto}</div><div class="l">risco alto</div></div>
        <div class="lac-bar mid"><div class="n">${t.medio}</div><div class="l">risco médio</div></div>
        <div class="lac-bar lo"><div class="n">${t.baixo}</div><div class="l">risco baixo</div></div>
        <div class="lac-bar"><div class="n">${t.semRisco}</div><div class="l">sem risco declarado</div></div>
      </div>
      <ul class="lac-top">${altas.map(x=>`<li><span class="tag">${x.m.id} · ${x.l.id}</span>${x.l.d}</li>`).join("")}</ul>
      <button class="filter-chip" onclick="setType('L')">Abrir as ${t.lac} lacunas →</button>
    </div>`;
  const cards = MODULES.map(m=>`
    <div class="card" style="cursor:pointer" onclick="setSpec('${m.id}')">
      <p class="card-title"><span class="pill rf">${m.id}</span> ${m.name}</p>
      <p class="card-sub">${m.rfs.length} RF · ${m.ris.length} RI · ${m.rnfs.length} RNF · ${m.rns.length} RN · ${m.ints.length} INT · ${(m.lacunas||[]).length} L · ${m.sources.length} fontes</p>
      <p class="muted" style="font-size:12px;margin:0">Módulos: ${(m.modules&&m.modules.length)?m.modules.join(", "):"transversal"} · <a href="../../${m.specPath}" onclick="event.stopPropagation()">spec.md</a></p>
    </div>`).join("");
  return `
    <p class="eyebrow">Rastreabilidade</p>
    <h1>Matriz de rastreabilidade</h1>
    <p class="lede">A cadeia inteira, nos dois sentidos. <b>Backward</b>: cada requisito cita as fontes F-NN da sua spec, com <code>arquivo:linha</code> na linhagem TOC-Builder, na norma APH ou na plataforma. <b>Forward</b>: spec → plan → tasks → contratos → qa-report → código do ciclo. Cinco tipos de requisito — RF, RI, RNF, RN e INT — mais as lacunas declaradas. Clique num ciclo para abrir os seus itens.</p>
    <div class="callout">${D.callout}</div>
    ${tiles}
    ${lacPanel}
    <h2>Resumo por ciclo</h2>
    <div class="grid grid-2">${cards}</div>`;
}

function renderModule(m){
  const sources = m.sources.map(s=>{
    return s.internal ? `<a class="src-tag" href="../../${s.rel}" title="${s.t}">${s.tag} ${s.seal||""}</a>`
                      : `<span class="src-tag" title="${s.t}">${s.tag} ${s.seal||""}</span>`;
  }).join("");
  let tables = "";
  for(const k of KINDS){
    if(typeFilter!=="all" && typeFilter!==k.id) continue;
    const rows = m[k.key];
    if(!rows.length) continue;
    let last = "";
    const html = rows.map(r=>{
      const head = (r.group && r.group!==last) ? `<span class="req-group">${r.group}</span>` : "";
      last = r.group || last;
      return `<div class="req-row ${k.cls}"><span class="req-id">${seal(r)}${r.id}</span><span class="req-desc">${head}${r.d}</span><span class="req-src">${srcLinks(r,m)}</span></div>`;
    }).join("");
    tables += `<div class="req-table"><div class="rt-head"><span>ID</span><span>${k.head} — ${rows.length} ${k.id}</span><span class="rt-src">Fonte (backward)</span></div>${html}</div>`;
  }
  if(showLacunas()) tables += lacunaTable(m);
  return `
    <div class="module-section" data-mid="${m.id}">
      <div class="module-header">
        <span class="m-id">${m.id}</span>
        <span class="m-name">${m.name}</span>
        <span class="m-links">
          <span class="st-pill wip">${(m.modules&&m.modules.length)?m.modules.join(" "):"transversal"}</span>
          <a href="../../${m.specPath}">spec.md</a>
        </span>
      </div>
      ${chainRow(m)}
      <div class="source-list"><strong>Fontes consultadas:</strong> ${sources||"—"}</div>
      ${tables||'<div class="callout">Nenhum item deste tipo nesta spec.</div>'}
    </div>`;
}

function renderFiltered(){
  let html = `
    <p class="eyebrow">Rastreabilidade</p>
    <h1>Matriz de rastreabilidade</h1>
    <p class="lede">Requisito → fonte (backward) e ciclo → artefatos (forward). Filtre por tipo ou por ciclo, ou busque por identificador, texto e fonte. O filtro <b>L</b> abre as lacunas declaradas — o que a spec assume sem saber, com o risco que ela mesma nomeou.</p>
    <input class="search-box" id="searchBox" placeholder="Buscar por identificador, texto ou fonte (ex.: UDE, F-06, snapshot, risco alto)..." value="${searchTerm}">
    <div class="filter-bar">
      <button class="filter-chip type" data-type="all">Todos os tipos</button>
      ${KINDS.map(k=>`<button class="filter-chip type" data-type="${k.id}" title="${k.label}">${k.id}</button>`).join("")}
      <button class="filter-chip type" data-type="L" title="Lacunas declaradas (L-NN)">L — lacunas</button>
    </div>
    <div class="filter-bar">
      <button class="filter-chip spec" data-spec="all">Todos os ciclos</button>
      ${MODULES.map(m=>`<button class="filter-chip spec" data-spec="${m.id}">${m.id}</button>`).join("")}
    </div>`;
  let mods = specFilter==="all" ? MODULES : MODULES.filter(m=>m.id===specFilter);
  if(searchTerm){
    const q = searchTerm.toLowerCase();
    const hit = r => r.id.toLowerCase().includes(q) || (r.d||"").toLowerCase().includes(q) || (r.s||"").toLowerCase().includes(q) || (r.group||"").toLowerCase().includes(q) || (r.risco||"").toLowerCase().includes(q);
    mods = mods.map(m=>{
                 const o = {...m};
                 KEYS.forEach(k=>{ o[k] = m[k].filter(hit); });
                 o.lacunas = (m.lacunas||[]).filter(hit);
                 return o;
               })
               .filter(m=>KEYS.some(k=>m[k].length) || m.lacunas.length);
  }
  const ak = activeKeys();
  const shown = mods.reduce((a,m)=>a+ak.reduce((b,k)=>b+m[k].length,0),0);
  const shownLac = showLacunas() ? mods.reduce((a,m)=>a+(m.lacunas||[]).length,0) : 0;
  const parts = [];
  if(ak.length) parts.push(`${shown} requisito(s)`);
  if(showLacunas()) parts.push(`${shownLac} lacuna(s) declarada(s)`);
  html += `<p class="faint" style="font-size:12px">${parts.join(" e ")} em ${mods.length} ciclo(s) — a contagem é do filtro atual, não do repositório inteiro.</p>`;
  if(!mods.length) html += `<div class="callout">Nada encontrado para "${searchTerm}".</div>`;
  else mods.forEach(m=>{ html += renderModule(m); });
  return html;
}

function render(){
  if(specFilter==="all" && typeFilter==="all" && !searchTerm){ el.innerHTML = renderOverview(); }
  else {
    el.innerHTML = renderFiltered();
    const sb = document.getElementById("searchBox");
    if(sb){ sb.addEventListener("input", e=>{ searchTerm=e.target.value; render(); const s2=document.getElementById("searchBox"); if(s2){ s2.focus(); s2.setSelectionRange(s2.value.length,s2.value.length);} }); }
  }
  document.querySelectorAll(".filter-chip.spec").forEach(b=>b.classList.toggle("active", b.dataset.spec===specFilter));
  document.querySelectorAll(".filter-chip.type").forEach(b=>b.classList.toggle("active", b.dataset.type===typeFilter));
  document.querySelectorAll(".filter-chip.spec").forEach(b=>b.addEventListener("click",()=>setSpec(b.dataset.spec)));
  document.querySelectorAll(".filter-chip.type").forEach(b=>b.addEventListener("click",()=>setType(b.dataset.type)));
}
function setSpec(f){ specFilter=f; render(); window.scrollTo(0,0); }
function setType(t){ typeFilter=t; render(); window.scrollTo(0,0); }
render();
</script>
</body>
</html>
