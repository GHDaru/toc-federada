, {"id": "L-03", "d": "A fatia de ações federadas do hospedeiro chama sem credencial ([F-16]) — assunção: nossa borda nasce exigindo autenticação (RF-32); enquanto o F7 do hospedeiro não emitir credencial de serviço, a borda federada só serve <code>risk: read</code> e o alcance fica limitado à execução disparada do harness — a FSM e o catálogo não dependem disso (é o limite aceito no roadmap, ciclo 006) — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": "F-16"}, {"id": "L-04", "d": "APH-9.4b sem laboratório: as capabilities recebidas podem exceder o usuário ([F-14]) — assunção: não pressupomos atenuação do hospedeiro; RF-17/RF-19 re-verificam localmente em todo caso de uso — risco médio (a exposição residual é do lado do hospedeiro, mas o traço é nosso).", "risco": "médio", "cmds": [], "paths": [], "s": "F-14"}, {"id": "L-05", "d": "<code>usage</code> no <code>done</code> depende da porta da fundação — sem provedor próprio (ADR 0007), não medimos tokens; o campo é opcional no fio — assunção: emitimos <code>done</code> sem <code>usage</code> até a fundação repassar o valor — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-06", "d": "<code>endpoints.actions</code> não existe no schema do manifesto (o próprio ADR 0023 do hospedeiro registra o gap e propõe formalização ao <code>protocolos</code> — [F-15], item 5 de lá) — assunção: seguimos a convenção <code>POST {origin}/aph/actions/{action_id}</code> do ADR até a norma formalizar — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": "F-15"}, {"id": "L-07", "d": "Não há baseline de desempenho do wire — assunção: os alvos do RNF-09 são propostos; a primeira medição real os calibra no gate — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}]}, {"id": "007", "name": "Nuvem de Conflito (M3 — Nuvem de Conflito)", "specNum": "007", "specPath": "specs/007-nuvem-de-conflito/spec.md", "modules": ["M3"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE permitir criar projeto do tipo NC, herdando do M1 listagem, tenant/usuário, exclusão suave, restauração e exportação/importação sem reimplementação", "s": "", "seal": "🟡", "group": "Projeto NC de topologia fixa"}, {"id": "RF-02", "d": "QUANDO um projeto NC for criado, O SISTEMA DEVE instanciar a nuvem completa — 5 entidades com papel fixo e texto de exemplo neutro, 7 arestas tipadas, racional vazio — num único ato atômico; não existe nuvem parcial", "s": "F-01, F-02", "seal": "🟡", "group": "Projeto NC de topologia fixa"}, {"id": "RF-03", "d": "O SISTEMA DEVE recusar, no domínio, qualquer operação que crie ou exclua entidade ou aresta da nuvem — o vocabulário de mutação é: editar texto, gerir premissa, gerir injeção, editar racional (RN-01)", "s": "", "seal": "🟡", "group": "Projeto NC de topologia fixa"}, {"id": "RF-04", "d": "QUANDO um projeto NC for excluído, O SISTEMA DEVE aplicar a exclusão suave do M1 arquivando premissas e injeções junto; a restauração devolve tudo", "s": "", "seal": "🟡", "group": "Projeto NC de topologia fixa"}, {"id": "RF-05", "d": "O SISTEMA DEVE permitir editar o texto de cada entidade por manipulação direta no diagrama e pela vista tabular, aplicando na hora com traço — os três testes do item 8 da constituição valem (alvo único nomeado pelo gesto, valor no controle tocado, reversível na sessão)", "s": "F-12", "seal": "🟡", "group": "Edição direta e leitura por extenso"}, {"id": "RF-06", "d": "O SISTEMA DEVE manter o racional do conflito como texto editável do agregado, com evento próprio (<code>RacionalEditado</code>)", "s": "F-01", "seal": "🟡", "group": "Edição direta e leitura por extenso"}, {"id": "RF-07", "d": "O SISTEMA DEVE apresentar a leitura por extenso de cada aresta, montada dos textos atuais das entidades: necessidade (&quot;Para ter &lt;A&gt;, precisamos de &lt;B&gt;&quot;), pré-requisito (&quot;Para ter &lt;B&gt;, devemos &lt;D&gt;&quot;), perigo (&quot;&lt;D&gt; ameaça &lt;C&gt;&quot;) e conflito (&quot;&lt;D&gt; e &lt;D′&gt; não podem coexistir&quot;)", "s": "F-10", "seal": "🟡", "group": "Edição direta e leitura por extenso"}, {"id": "RF-08", "d": "O SISTEMA DEVE cobrir a edição de entidade, premissa e injeção pelo desfazer de sessão herdado do M1, sem exceção nova", "s": "", "seal": "🟡", "group": "Edição direta e leitura por extenso"}, {"id": "RF-09", "d": "O SISTEMA DEVE avaliar, por heurística pura de domínio (sem rede e sem modelo), a forma canônica de cada entidade — A, B, C como substantivo (adjetivo opcional); D e D′ como infinitivo verbal — devolvendo aviso com explicação e exemplo, nunca bloqueio (RN-06)", "s": "F-10", "seal": "🟡", "group": "Apoio à boa formulação"}, {"id": "RF-10", "d": "O SISTEMA DEVE avaliar, por heurística, se D′ nega ou exclui D (marcadores de negação e antonímia simples), devolvendo <code>indeterminado</code> honesto quando não alcançar o caso — indeterminado não gera aviso", "s": "F-10", "seal": "🟡", "group": "Apoio à boa formulação"}, {"id": "RF-11", "d": "O SISTEMA DEVE manter o léxico dessas heurísticas como dado versionado por idioma (pt/en), compartilhando o mecanismo do léxico do M2 — nunca literal espalhado no código", "s": "", "seal": "🟡", "group": "Apoio à boa formulação"}, {"id": "RF-12", "d": "O SISTEMA DEVE permitir registrar, editar, reordenar e arquivar premissas em qualquer uma das 7 arestas — zero ou mais por aresta, ordenadas —, cada mutação com evento e autor", "s": "F-01, F-10", "seal": "🟡", "group": "Premissas por aresta"}, {"id": "RF-13", "d": "O SISTEMA DEVE permitir marcar uma premissa como <code>desafiada</code> com justificativa obrigatória, e reverter para <code>vigente</code> — os dois sentidos com evento", "s": "", "seal": "🟡", "group": "Premissas por aresta"}, {"id": "RF-14", "d": "O SISTEMA DEVE computar a completude da nuvem por função pura: quantas das 7 arestas têm ≥ 1 premissa vigente — e apresentar o resultado como progresso, não como trava (RN-03)", "s": "", "seal": "🟡", "group": "Premissas por aresta"}, {"id": "RF-15", "d": "QUANDO uma premissa for arquivada, O SISTEMA DEVE arquivar junto as injeções que a referenciam, dizendo quantas no ato de confirmar — nunca deixar injeção órfã nem apagar em silêncio (RN-04)", "s": "", "seal": "🟡", "group": "Premissas por aresta"}, {"id": "RF-16", "d": "O SISTEMA DEVE exigir, no domínio, que toda injeção referencie exatamente uma premissa existente e não arquivada do mesmo projeto — não existe construtor de injeção sem premissa (RN-04)", "s": "F-01", "seal": "🟡", "group": "Injeções ligadas a premissas"}, {"id": "RF-17", "d": "O SISTEMA DEVE manter o status da injeção na FSM <code>candidata → escolhida | descartada</code>, com retorno explícito a <code>candidata</code> mediante justificativa (RN-08); a mudança registra autor e data por evento", "s": "", "seal": "🟡", "group": "Injeções ligadas a premissas"}, {"id": "RF-18", "d": "O SISTEMA DEVE permitir classificar qualquer injeção por separação TRIZ (<code>espaco</code> | <code>tempo</code> | <code>partes</code> | <code>grau</code> | <code>condicao</code>), e DEVE apresentar, para o conflito D↯D′, quais das 5 separações ainda não têm injeção (RN-07)", "s": "F-10", "seal": "🟡", "group": "Injeções ligadas a premissas"}, {"id": "RF-19", "d": "O SISTEMA DEVE listar injeções por aresta e por premissa, com filtro por status e por separação TRIZ, no diagrama e na vista tabular", "s": "", "seal": "🟡", "group": "Injeções ligadas a premissas"}, {"id": "RF-20", "d": "QUANDO uma injeção for marcada <code>escolhida</code>, O SISTEMA DEVE registrar a ReferenciaDeSemeadura vazia de destino — pronta para a ARF do ciclo 008 preencher (INT-06) — sem criar nenhuma árvore neste ciclo", "s": "", "seal": "🟡", "group": "Injeções ligadas a premissas"}, {"id": "RF-21", "d": "O SISTEMA DEVE expor <code>toc.generate_conflict_cloud</code> no catálogo governado: entrada é a narrativa (texto livre) mais o estado atual da nuvem; saída é ResultadoDeGeracao estruturado e validado por schema JSON versionado — nunca markdown interpretado por parser (o contraexemplo: F-03, F-04)", "s": "F-03, F-04, F-05, F-06", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-22", "d": "QUANDO o resultado da geração chegar, O SISTEMA DEVE validá-lo contra o schema antes de criar a proposta; resultado que não valida é recusado em falha fechada com erro legível e identificador de traço — nada aplicado, nada meio-aplicado (RN-05)", "s": "", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-23", "d": "O SISTEMA DEVE fazer toda aplicação de geração nascer <code>action_proposal</code> na FSM do servidor (ciclo 006): sobre nuvem vazia, uma proposta de preenchimento completo; sobre nuvem com conteúdo, propostas granulares por seção — nunca sobrescrita direta", "s": "F-12", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-24", "d": "O SISTEMA DEVE garantir que recusar uma proposta de geração deixa o projeto byte a byte intacto — provado por teste que compara o estado serializado antes e depois da recusa (o portão executável do roadmap, ciclo 007)", "s": "", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-25", "d": "QUANDO uma proposta de geração for aceita, O SISTEMA DEVE aplicar as mutações com traço correlacionado ao identificador da proposta, e os eventos resultantes DEVEM declarar a origem (<code>geracao</code>, com a proposta) — distinguível de edição humana para sempre", "s": "", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-26", "d": "O SISTEMA DEVE expor <code>toc.suggest_assumptions</code> (premissas para uma aresta nomeada) e <code>toc.suggest_injections</code> (injeções para uma premissa nomeada) como ações de regeneração granular, cada sugestão nascendo proposta individual", "s": "", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-27", "d": "QUANDO a capability de escrita não estiver presente na introspecção, O SISTEMA DEVE omitir do catálogo as três ações mutadoras deste módulo, mantendo o restante da NC funcional — a lição paga pela irmã, já portão do ciclo 006", "s": "", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-28", "d": "O SISTEMA DEVE funcionar por inteiro nos épicos E3.1, E3.2 e E3.4 com o catálogo ausente ou desligado — a modelagem manual é completa e a assistência é aceleradora, nunca dependência", "s": "", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-29", "d": "O SISTEMA DEVE versionar o schema do ResultadoDeGeracao em <code>contracts/</code> e recusar resultado de versão desconhecida — a evolução do schema é mudança de contrato, com teste, nunca afrouxamento do parse", "s": "", "seal": "🟡", "group": "Geração assistida a partir de narrativa"}, {"id": "RF-30", "d": "O SISTEMA DEVE apresentar a visão espelhada: diagrama do conflito (premissas por aresta) e diagrama de solução (injeções por aresta) sobre a mesma topologia, alternável e lado a lado", "s": "F-07, F-09", "seal": "🟡", "group": "Visão conflito+solução"}, {"id": "RF-31", "d": "O SISTEMA DEVE representar, na visão de solução, as 7 posições de aresta — com as injeções existentes ou a pendência explícita — incluindo D⇸C e D↯D′, as duas que o v3 nunca renderizou (F-07)", "s": "F-07", "seal": "🟡", "group": "Visão conflito+solução"}, {"id": "RF-32", "d": "O SISTEMA DEVE oferecer foco cruzado: selecionar uma injeção na visão de solução foca a premissa referenciada no diagrama do conflito, e vice-versa", "s": "", "seal": "🟡", "group": "Visão conflito+solução"}, {"id": "RF-33", "d": "O SISTEMA DEVE exportar e importar o projeto NC completo pelo E1.4 do M1 — entidades, arestas, premissas (com estado), injeções (com status, TRIZ e referências), racional e referências de origem/semeadura — sem perda em ida e volta", "s": "", "seal": "🟡", "group": "Visão conflito+solução"}, {"id": "RF-34", "d": "O SISTEMA DEVE apresentar na vista tabular do projeto a matriz aresta × premissas × injeções — a &quot;tabela de premissas&quot; e a &quot;tabela de soluções&quot; do método (F-10) como projeções do mesmo dado do diagrama, nunca de dado paralelo", "s": "F-10", "seal": "🟡", "group": "Visão conflito+solução"}], "ris": [{"id": "RI-01", "d": "O diagrama da NC usa o layout canônico da ferramenta — A à esquerda, B/C ao centro, D/D′ à direita, conflito marcado entre D e D′ — com posições fixas: o usuário edita texto, não arruma caixas", "s": "F-08", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "A notação das arestas segue o método: setas de necessidade/pré-requisito cheias, setas de perigo (D⇸C, D′⇸B) tracejadas e distinguíveis também por rótulo textual (nunca só cor ou só traço), e o conflito D↯D′ com o símbolo de raio", "s": "F-03, F-10", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "As premissas de uma aresta são acionáveis na própria aresta (legenda clicável — o acerto do v3, F-08) e abrem a ficha da aresta com premissas e injeções juntas", "s": "F-08", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "A ficha da aresta apresenta a leitura por extenso (RF-07) no topo, as premissas ordenadas com estado, e as injeções agrupadas por premissa — uma superfície, três camadas", "s": "F-07", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "O aviso de formulação (RF-09, RF-10) aparece no próprio nó, com explicação e exemplo ao abrir — pedagógico, não punitivo; some quando o texto muda para forma canônica", "s": "F-09, F-10", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "A proposta de geração apresenta pré-visualização completa em diff — o que cada entidade/aresta ganha — antes de aceitar; aceitar e recusar são ações de mesmo peso visual", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "A bandeja de propostas é a mesma do ciclo 006 (uma bandeja por aplicação, nunca uma por módulo), dizendo de qual ação e proposta cada item veio", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "A visão conflito+solução alterna por controle persistente na sessão; em tela larga, lado a lado com rolagem sincronizada; a pendência de injeção (RF-31) tem representação própria acessível", "s": "F-31", "seal": "🟡", "group": ""}, {"id": "RI-09", "d": "O progresso de completude (RF-14) aparece no cabeçalho do projeto — &quot;5 de 7 arestas com premissa&quot; — com salto direto para as arestas pendentes", "s": "F-14", "seal": "🟡", "group": ""}, {"id": "RI-10", "d": "A vista tabular (RF-34) permite edição das premissas e injeções com paridade de capacidade com o diagrama — sessão de grupo flui na tabela, revisão flui no diagrama", "s": "F-34", "seal": "🟡", "group": ""}, {"id": "RI-11", "d": "Toda superfície do módulo respeita tema do hospedeiro com fallback, modo só-conteúdo e operação por teclado, herdados dos ciclos 002/003; textos por i18n pt/en, inclusive rótulos de papel, avisos de formulação e nomes das separações TRIZ", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "As invariantes da nuvem (5 entidades, 7 arestas, injeção referencia premissa) e a ValidacaoDaNuvem são domínio puro testável sem rede, sem banco e sem modelo — a suíte de domínio roda offline por construção (P3, P4; aptidão do round 007)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "A fronteira hexagonal é verificada por <code>import-linter</code>: o pacote de domínio do M3 não importa framework, HTTP, banco nem cliente de IA — o build falha na violação", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Toda mutação do módulo emite traço OTel correlacionado e log estruturado; mutações originadas de proposta aceita carregam o identificador da proposta (P5, RF-25)", "s": "F-25", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "O schema do ResultadoDeGeracao é validado no servidor da aplicação antes da criação da proposta; o cliente nunca é a única linha de validação (P7)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Abrir um projeto NC completo (7 arestas, até 30 premissas e 50 injeções) renderiza em menos de 1 segundo no percentil 95, medido na jornada viva", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "A recusa de proposta responde em menos de 500 milissegundos e não gera nenhuma escrita no agregado — só o evento <code>GeracaoRecusada</code> no registro de propostas", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "Nenhum prompt, chave ou cliente de provedor no repositório do produto — grep de CI herdado dos ciclos anteriores cobrindo também os padrões do v3 (<code>CONFLICT_CLOUD_PROMPT</code>, <code>GoogleGenAI</code>) (P7, ADR 0007; contraexemplos: F-04, F-05)", "s": "F-04, F-05", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "O léxico das heurísticas de formulação (RF-11) tem corpus sintético próprio de entidades bem e mal formuladas, versionado pt/en — ampliar heurística exige ampliar corpus (o mecanismo do M2, reusado)", "s": "F-11", "seal": "🟡", "group": ""}, {"id": "RNF-09", "d": "Textos de papel, aviso, separação TRIZ e leitura por extenso saem do mecanismo de i18n com chave estável ligada à regra (RN-NN) — rastreabilidade spec ↔ código ↔ tela", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-10", "d": "A fixture de demonstração e a jornada usam exclusivamente o dilema sintético da &quot;Instituição Horizonte&quot; — grep negativo de nome real de pessoa no CI (ADR 0006)", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "A nuvem tem exatamente 5 entidades (A, B, C, D, D′) e 7 arestas (A_B, A_C, B_D, C_D_PRIME, D_C, D_PRIME_B, D_D_PRIME); nascem juntas e não se criam nem se destroem — só se preenchem. 🟢 (estrutura verbatim em <code>types.ts:69</code> e <code>types.ts:73</code>; criação atômica em <code>mockApiService.ts:17-41</code>)", "s": "F-01, F-02", "seal": "", "group": ""}, {"id": "RN-02", "d": "As arestas têm classe derivada da chave: necessidade (B→A, C→A), pré-requisito (D→B, D′→C), perigo (D⇸C, D′⇸B), conflito (D↯D′) — e a leitura por extenso de cada classe é fixa (RF-07). 🟢 (a notação ⇸ e ↯ está na linhagem: <code>parserService.ts:51-53</code>; a semântica é do método — skill, 🟡 na heurística)", "s": "F-07, F-03, F-10", "seal": "", "group": ""}, {"id": "RN-03", "d": "Nuvem modelada é nuvem com as 7 arestas sustentadas por ≥ 1 premissa vigente; a completude informa e prioriza, nunca trava a edição — nuvem sem premissa explícita é desenho de opinião (round 007: &quot;nunca sai&quot;)", "s": "F-11", "seal": "🟡", "group": ""}, {"id": "RN-04", "d": "Injeção sem premissa não existe: toda injeção referencia exatamente uma premissa existente e não arquivada do mesmo projeto; arquivar a premissa arquiva as injeções junto, com aviso quantificado. 🟢 (o dado da linhagem já pareava premissa e solução por aresta: <code>types.ts:72-76</code>; a referência explícita e o arquivamento são 🟡)", "s": "F-01", "seal": "", "group": ""}, {"id": "RN-05", "d": "Conteúdo produzido por modelo só entra no agregado por proposta aceita na FSM do servidor; resultado que não valida contra o schema é recusado em falha fechada antes de virar proposta", "s": "F-12", "seal": "🟡", "group": ""}, {"id": "RN-06", "d": "A forma canônica das entidades — A, B, C substantivo com adjetivo opcional; D e D′ infinitivo verbal; D′ nega ou exclui D — é aviso heurístico, nunca bloqueio: o método educa, o dado obedece ao grupo", "s": "F-10", "seal": "🟡", "group": ""}, {"id": "RN-07", "d": "As 5 separações TRIZ (espaço, tempo, partes, grau, condição) são o mapa de cobertura do conflito D↯D′: o sistema mostra quais faltam, o humano decide se importa", "s": "F-10", "seal": "🟡", "group": ""}, {"id": "RN-08", "d": "Status de injeção segue a FSM <code>candidata → escolhida | descartada</code>, com retorno a <code>candidata</code> mediante justificativa; <code>escolhida</code> é a única que semeia ARF (ciclo 008), e mais de uma injeção pode ser <code>escolhida</code>", "s": "", "seal": "🟡", "group": ""}], "ints": [{"id": "INT-01", "d": "O M3 consome do M1 (ciclo 004) projeto, tenant/usuário, exclusão suave, desfazer, exportação/importação e vista tabular; consome da junta 003 identidade (<code>POST /auth/introspect</code>), isolamento por inquilino e OTel. Nada disso é reimplementado", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "<code>toc.generate_conflict_cloud</code> — catálogo <code>toc.*</code>, mutadora (preenche a nuvem); entrada: narrativa + estado atual da nuvem; saída: ResultadoDeGeracao validado por schema (RF-21..RF-25); toda aplicação nasce <code>action_proposal</code> na FSM do ciclo 006", "s": "F-21, F-25, F-05, F-06", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "<code>toc.suggest_assumptions</code> — mutadora granular; entrada: chave da aresta + contexto da nuvem; saída: propostas de premissa, uma <code>action_proposal</code> por sugestão (RF-26)", "s": "F-26", "seal": "🟡", "group": ""}, {"id": "INT-04", "d": "<code>toc.suggest_injections</code> — mutadora granular; entrada: identificador da premissa + contexto; saída: propostas de injeção ligadas àquela premissa, com separação TRIZ sugerida quando couber (RF-26)", "s": "F-26", "seal": "🟡", "group": ""}, {"id": "INT-05", "d": "Costura com o M2 (execução: ciclo 008, E4.4): promover o dilema por trás de UDEs validados da ARA para um projeto NC novo, preenchendo a ReferenciaDeOrigem. Este ciclo entrega o campo e a leitura (&quot;origem: UDEs …&quot; quando houver); a ação de promover é do 008. [ver <code>../../docs/produto/rounds.md</code>, round 008]", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-06", "d": "Costura com o M4 (execução: ciclo 008, E4.4): a injeção <code>escolhida</code> semeia a ARF, preenchendo a ReferenciaDeSemeadura. Este ciclo entrega o status <code>escolhida</code> (RF-20) e o campo de referência; criar ARF é do 008", "s": "F-20", "seal": "🟡", "group": ""}, {"id": "INT-07", "d": "Telas deste módulo entram no registro de telas do E7.5 com identificador estável (<code>toc.nc_canvas</code>, <code>toc.nc_aresta</code>, <code>toc.nc_solucao</code>, <code>toc.nc_tabela</code>), no formato do ciclo 006; texto de entidade, premissa, injeção e racional marcam <code>ai_visible</code> campo a campo para o snapshot sanitizado — narrativa colada pelo usuário é sempre camada não-confiável (item 7 da constituição)", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-08", "d": "Os prompts das três ações são versionados no servidor e nunca circulam no cliente nem no snapshot (ADR 0007); o prompt de 75 linhas do cliente do v3 (F-05) não é portado — a lógica dele vira contrato de schema e regra desta spec", "s": "F-05", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "68-93", "desc": "a estrutura da NC na linhagem: 5 entidades (`sed -n 69p types.ts | grep -o \"'[A-Z_']*'\" | wc -l` → `5`: `'A' | 'B' | 'C' | 'D' | 'D_PRIME'`), 7 chaves de premissa (`sed -n 73p types.ts | grep -o \"'[A-Z_']*'\" | wc -l` → `7`: `'A_B' | 'A_C' | 'B_D' | 'C_D_PRIME' | 'D_C' | 'D_PRIME_B' | 'D_D_PRIME'`), premissa e solução pareadas por aresta (l.72-76), racional opcional (l.92)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:68-93 — a estrutura da NC na linhagem: 5 entidades (sed -n 69p types.ts | grep -o &quot;&#x27;[A-Z_&#x27;]&#x27;&quot; | wc -l → 5: &#x27;A&#x27; | &#x27;B&#x27; | &#x27;C&#x27; | &#x27;D&#x27; | &#x27;D_PRIME&#x27;), 7 chaves de premissa (sed -n 73p types.ts | grep -o &quot;&#x27;[A-Z_&#x27;]&#x27;&quot; | wc -l → 7: &#x27;A_B&#x27; | &#x27;A_C&#x27; | &#x27;B_D&#x27; | &#x27;C_D_PRIME&#x27; | &#x27;D_C&#x27; | &#x27;D_PRIME_B&#x27; | &#x27;D_D_PRIME&#x27;), premissa e solução pareadas por aresta (l.72-76), racional opcional (l.92)"}, {"tag": "F-02", "path": "/home/user/tocbuilderv3/services/mockApiService.ts", "rel": "/home/user/tocbuilderv3/services/mockApiService.ts", "lines": "17-41", "desc": "o helper `createEmptyConflictCloudData` cria a nuvem **inteira** na origem: 5 entidades com texto de exemplo e as 7 premissas vazias (`sed -n '31,39p' services/mockApiService.ts | grep -c \"emptyAssumption(\"` → `7`) — o acerto que a RN-01 formaliza", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/mockApiService.ts:17-41 — o helper createEmptyConflictCloudData cria a nuvem inteira na origem: 5 entidades com texto de exemplo e as 7 premissas vazias (sed -n &#x27;31,39p&#x27; services/mockApiService.ts | grep -c &quot;emptyAssumption(&quot; → 7) — o acerto que a RN-01 formaliza"}, {"tag": "F-03", "path": "/home/user/tocbuilderv3/services/parserService.ts", "rel": "/home/user/tocbuilderv3/services/parserService.ts", "lines": "", "desc": "o contraexemplo da geração: 5 extrações de entidade (`grep -c \"getEntity(\" services/parserService.ts` → `5`) e 7 pares premissa/solução (`grep -c \"getAssumptionAndSolution('\" services/parserService.ts` → `7`) arrancados de markdown por regex; qualquer variação de formato devolve `null` inteiro (l.67) — a estrutura dependia da **forma** do texto do modelo; a notação ⇸/↯ das arestas de perigo e conf", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/parserService.ts — o contraexemplo da geração: 5 extrações de entidade (grep -c &quot;getEntity(&quot; services/parserService.ts → 5) e 7 pares premissa/solução (grep -c &quot;getAssumptionAndSolution(&#x27;&quot; services/parserService.ts → 7) arrancados de markdown por regex; qualquer variação de formato devolve null inteiro (l.67) — a estrutura dependia da forma do texto do modelo; a notação ⇸/↯ das arestas de perigo e conf"}, {"tag": "F-04", "path": "/home/user/tocbuilderv3/services/geminiService.ts", "rel": "/home/user/tocbuilderv3/services/geminiService.ts", "lines": "173", "desc": "`if (request.type === 'generate_conflict_cloud') return { markdown: textResponse };` — a geração devolvia markdown cru, sem contrato; e a l.16 inicializa o SDK com a chave **no navegador** (`const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });`) — os dois defeitos que RF-21/RF-22 e o ADR 0007 matam", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/geminiService.ts:173 — if (request.type === &#x27;generate_conflict_cloud&#x27;) return { markdown: textResponse }; — a geração devolvia markdown cru, sem contrato; e a l.16 inicializa o SDK com a chave no navegador (const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });) — os dois defeitos que RF-21/RF-22 e o ADR 0007 matam"}, {"tag": "F-05", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "264-338", "desc": "`CONFLICT_CLOUD_PROMPT_TEXT`: 75 linhas (`expr 338 - 264 + 1` → `75`) de regra da ferramenta — papéis, premissas, separações TRIZ — vivendo como prompt no cliente; a lógica vira contrato e regra desta spec, o texto que sobrar é insumo do servidor (INT-08)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts:264-338 — CONFLICT_CLOUD_PROMPT_TEXT: 75 linhas (expr 338 - 264 + 1 → 75) de regra da ferramenta — papéis, premissas, separações TRIZ — vivendo como prompt no cliente; a lógica vira contrato e regra desta spec, o texto que sobrar é insumo do servidor (INT-08)"}, {"tag": "F-06", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "137", "desc": "`'generate_conflict_cloud'` é a 7ª operação do tipo-união de assistência da linhagem (as outras 6 são da ARA — spec 005, F-03 de lá); vira a INT-02 governada", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:137 — &#x27;generate_conflict_cloud&#x27; é a 7ª operação do tipo-união de assistência da linhagem (as outras 6 são da ARA — spec 005, F-03 de lá); vira a INT-02 governada"}, {"tag": "F-07", "path": "/home/user/tocbuilderv3/components/ConflictCloudView.tsx", "rel": "/home/user/tocbuilderv3/components/ConflictCloudView.tsx", "lines": "40,159-169", "desc": "a visão espelhada existia (`Y_OFFSET_SOLUTION = 950`, l.40; nós `SolNode*` l.159-163), mas o diagrama de solução renderizava só **5** nós de injeção (`sed -n '164,185p' components/ConflictCloudView.tsx | grep -c \"Injection\"` → `5`) e `D_C.solution` / `D_D_PRIME.solution` não são renderizadas em lugar nenhum (`grep -n \"D_D_PRIME.solution\\|D_C.solution\" components/ConflictCloudView.tsx` → vazio) — o", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/ConflictCloudView.tsx:40,159-169 — a visão espelhada existia (Y_OFFSET_SOLUTION = 950, l.40; nós SolNode l.159-163), mas o diagrama de solução renderizava só 5 nós de injeção (sed -n &#x27;164,185p&#x27; components/ConflictCloudView.tsx | grep -c &quot;Injection&quot; → 5) e D_C.solution / D_D_PRIME.solution não são renderizadas em lugar nenhum (grep -n &quot;D_D_PRIME.solution\\|D_C.solution&quot; components/ConflictCloudView.tsx → vazio) — o"}, {"tag": "F-08", "path": "/home/user/tocbuilderv3/specs/feat_conflict_cloud.md", "rel": "/home/user/tocbuilderv3/specs/feat_conflict_cloud.md", "lines": "15-25", "desc": "os 10 critérios de aceitação da 4ª geração (`sed -n '15,26p' specs/feat_conflict_cloud.md | grep -c '^[0-9]'` → `10`): layout fixo, legendas de premissa clicáveis, símbolo de conflito — os acertos de UI que RI-01..RI-03 herdam", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/specs/feat_conflict_cloud.md:15-25 — os 10 critérios de aceitação da 4ª geração (sed -n &#x27;15,26p&#x27; specs/feat_conflict_cloud.md | grep -c &#x27;^[0-9]&#x27; → 10): layout fixo, legendas de premissa clicáveis, símbolo de conflito — os acertos de UI que RI-01..RI-03 herdam"}, {"tag": "F-09", "path": "/home/user/tocbuilderv3/specs/feat_conflict_cloud_refactor.md", "rel": "/home/user/tocbuilderv3/specs/feat_conflict_cloud_refactor.md", "lines": "20-23", "desc": "a visão dupla (diagrama do conflito com arestas de perigo + diagrama de solução com injeções) e a persistência por projeto — o desenho que o E3.4 refaz por cima de dado íntegro", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/specs/feat_conflict_cloud_refactor.md:20-23 — a visão dupla (diagrama do conflito com arestas de perigo + diagrama de solução com injeções) e a persistência por projeto — o desenho que o E3.4 refaz por cima de dado íntegro"}, {"tag": "F-10", "path": "", "rel": "", "lines": "", "desc": "skill `toc-evaporating-cloud` (sessão local) — o método da ferramenta: regras de formulação (A ⊇ C ⊇ B; A, B, C substantivo único com adjetivo opcional; D infinitivo verbal; D′ = \"Não {D}\"), a tabela das 7 premissas com a leitura de cada seta, e as 5 separações TRIZ (espaço, tempo, partes, grau, condição) para D↯D′ — fonte técnica; a norma é esta spec", "seal": "🟢", "internal": false, "t": " — skill toc-evaporating-cloud (sessão local) — o método da ferramenta: regras de formulação (A ⊇ C ⊇ B; A, B, C substantivo único com adjetivo opcional; D infinitivo verbal; D′ = &quot;Não {D}&quot;), a tabela das 7 premissas com a leitura de cada seta, e as 5 separações TRIZ (espaço, tempo, partes, grau, condição) para D↯D′ — fonte técnica; a norma é esta spec"}, {"tag": "F-11", "path": "docs/produto/rounds.md", "rel": "docs/produto/rounds.md", "lines": "", "desc": "Round 007: aptidão executável (invariantes por teste de domínio; recusa deixa intacto; jornada sintética), fora (semear ARF — round 008), corte de apetite (\"sai primeiro\" E3.4, \"nunca saem\" as premissas)", "seal": "🟢", "internal": true, "t": "docs/produto/rounds.md — Round 007: aptidão executável (invariantes por teste de domínio; recusa deixa intacto; jornada sintética), fora (semear ARF — round 008), corte de apetite (&quot;sai primeiro&quot; E3.4, &quot;nunca saem&quot; as premissas)"}, {"tag": "F-12", "path": "", "rel": "", "lines": "", "desc": "`docs/governance/constitution.md` linhas 73-94 — itens 4 (verbo mutador nasce proposta, fail-closed), 7 (tela é dado) e 8 (manipulação direta aplica na hora sob três testes; intenção inferida nasce proposta; FSM uma só e do servidor)", "seal": "🟢", "internal": false, "t": " — docs/governance/constitution.md linhas 73-94 — itens 4 (verbo mutador nasce proposta, fail-closed), 7 (tela é dado) e 8 (manipulação direta aplica na hora sob três testes; intenção inferida nasce proposta; FSM uma só e do servidor)"}], "chain": [{"label": "spec.md", "href": "specs/007-nuvem-de-conflito/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/007-nuvem-de-conflito/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/007-nuvem-de-conflito/tasks.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/007-nuvem-de-conflito/qa-report.md", "state": "pending"}, {"label": "código do ciclo 007", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "A multiplicidade de premissas por aresta não tem precedente na linhagem (o v3 fixava exatamente 1 — F-01) nem na skill (que pede 1 por seta). Assunção: zero ou mais, ordenadas, com a completude medindo ≥ 1 vigente (RN-03) — a prática de grupo produz várias crenças por seta e achatá-las perderia informação; risco baixo (voltar a 1 é restrição de dado, não migração).", "risco": "baixo", "cmds": [], "paths": [], "s": "F-01"}, {"id": "L-02", "d": "A granularidade da proposta de geração (RF-23: completa sobre nuvem vazia, granular sobre nuvem preenchida) é desenho nosso sem precedente — o v3 sempre sobrescrevia tudo. Assunção: o corte &quot;vazia × preenchida&quot; cobre os dois usos reais (começar e refinar); o caso híbrido resolve-se com as ações granulares (INT-03, INT-04) — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-03", "d": "O contrato das 3 ações e do schema antecipa o formato que o ciclo 006 fixa para o catálogo. Assunção: declarar com schema versionado custa pouco e dá ao 006 um segundo cliente concreto; divergência custa migração de contrato, não de domínio — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-04", "d": "As heurísticas de formulação (RF-09, RF-10) não têm precedente medido — a linhagem mandava tudo ao modelo. Assunção: aviso não bloqueante com <code>indeterminado</code> honesto não pode causar dano de fluxo (o pior caso é silêncio); o corpus sintético (RNF-08) mede o acerto — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-05", "d": "Os campos ReferenciaDeOrigem e ReferenciaDeSemeadura nascem aqui mas só são preenchidos pelo encadeamento do ciclo 008 — desenho antecipado sem consumidor imediato. Assunção: criar o lugar do dado agora evita migração no 008 e custa duas colunas anuláveis; se o desenho do encadeamento divergir, a migração é pequena e o dado ainda é nulo — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}]}, {"id": "008", "name": "Árvores de Futuro e Implementação (M4 — Árvores de Futuro e Implementação)", "specNum": "008", "specPath": "specs/008-arvores-de-futuro-e-implementacao/spec.md", "modules": ["M4"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE permitir criar projeto do tipo ARF, herdando do M1 canvas, vista tabular, desfazer de sessão, exclusão suave e exportação sem reimplementação", "s": "F-01, F-02", "seal": "🟡", "group": "Projeto ARF e efeitos futuros"}, {"id": "RF-02", "d": "O SISTEMA DEVE tipar cada nó da ARF com o papel <code>injecao</code> ou <code>efeito_futuro</code>, distintos visualmente, e permitir mudar o papel enquanto o nó não tiver vínculo que o proíba (injeção referenciada por ramo tratado não vira efeito)", "s": "", "seal": "🟡", "group": "Projeto ARF e efeitos futuros"}, {"id": "RF-03", "d": "O SISTEMA DEVE apresentar a leitura de suficiência de cada aresta da ARF — &quot;Se &lt;origem&gt;, então &lt;destino&gt;&quot; — e oferecer o exame de elo e o conector E do pacote de suficiência causal compartilhado com a ARA, sem duplicação de regra", "s": "F-11", "seal": "🟡", "group": "Projeto ARF e efeitos futuros"}, {"id": "RF-04", "d": "O SISTEMA DEVE permitir marcar um efeito futuro como ED espelhando um UDE referenciado pela cadeia da análise (RN-03), e DEVE recusar espelhar o mesmo UDE em dois EDs da mesma ARF", "s": "", "seal": "🟡", "group": "Projeto ARF e efeitos futuros"}, {"id": "RF-05", "d": "O SISTEMA DEVE apresentar o resumo de cobertura da ARF: por UDE referenciado, se existe ED espelhado e se há caminho de alguma injeção até ele", "s": "", "seal": "🟡", "group": "Projeto ARF e efeitos futuros"}, {"id": "RF-06", "d": "QUANDO uma ARF nascer por semeadura (RF-38), O SISTEMA DEVE criar a injeção semente como nó do papel <code>injecao</code> com o texto da injeção de origem — editável dali em diante sem quebrar a referência", "s": "F-38", "seal": "🟡", "group": "Projeto ARF e efeitos futuros"}, {"id": "RF-07", "d": "O SISTEMA DEVE permitir ARF criada do zero (sem semeadura), com o espelho de UDE disponível apenas quando houver cadeia que forneça UDEs referenciáveis — sem cadeia, a cobertura declara &quot;sem origem vinculada&quot;", "s": "", "seal": "🟡", "group": "Projeto ARF e efeitos futuros"}, {"id": "RF-08", "d": "O SISTEMA DEVE permitir marcar um nó da ARF como raiz de ramo negativo, com estado inicial <code>aberto</code>, e listar os ramos por estado no painel da ARF", "s": "F-12", "seal": "🟡", "group": "Ramos negativos"}, {"id": "RF-09", "d": "O SISTEMA DEVE permitir transicionar um ramo negativo para <code>tratado</code> somente com referência a uma injeção que o corta, e para <code>aceito</code> somente com justificativa — registrando o evento correspondente com autor (RN-04)", "s": "", "seal": "🟡", "group": "Ramos negativos"}, {"id": "RF-10", "d": "O SISTEMA NÃO DEVE oferecer, neste ciclo, nenhuma rota assistida de identificação ou tratamento de ramos negativos — a marcação é manual por decisão de round (F-12, F-13); a prova é negativa (DoD 8)", "s": "F-12, F-13", "seal": "🟡", "group": "Ramos negativos"}, {"id": "RF-11", "d": "O SISTEMA DEVE computar por função pura de domínio, sem rede e sem modelo, a verificação da ARF: EDs sem caminho desde injeção, injeções sem efeito ligado, ramos negativos abertos e cobertura do espelho UDE → ED", "s": "", "seal": "🟡", "group": "Verificação estrutural da ARF"}, {"id": "RF-12", "d": "O SISTEMA DEVE oferecer, em cada item da verificação, ação de foco que centraliza o elemento no canvas (mesmo mecanismo do M1 e do relatório do M2)", "s": "", "seal": "🟡", "group": "Verificação estrutural da ARF"}, {"id": "RF-13", "d": "O SISTEMA DEVE registrar <code>VerificacaoDaArfGerada</code> com o resumo quantitativo (contagens por seção), para a jornada e o traço mostrarem a maturação da árvore", "s": "", "seal": "🟡", "group": "Verificação estrutural da ARF"}, {"id": "RF-14", "d": "O SISTEMA DEVE permitir criar projeto do tipo APR com exatamente um nó de papel <code>objetivo</code>, criado na origem e indestrutível enquanto o projeto viver — texto editável, papel não", "s": "", "seal": "🟡", "group": "Projeto APR: obstáculos e objetivos intermediários"}, {"id": "RF-15", "d": "O SISTEMA DEVE tipar os demais nós da APR como <code>obstaculo</code> ou <code>objetivo_intermediario</code>, com criação disponível no canvas e na vista tabular", "s": "F-09", "seal": "🟡", "group": "Projeto APR: obstáculos e objetivos intermediários"}, {"id": "RF-16", "d": "O SISTEMA DEVE tratar a aresta da APR como dependência entre OIs (ou OI → objetivo), lida &quot;precisa existir antes de&quot; — e NÃO DEVE apresentar leitura de suficiência nem exame de elo nesse tipo de projeto (RN-05)", "s": "F-09", "seal": "🟡", "group": "Projeto APR: obstáculos e objetivos intermediários"}, {"id": "RF-17", "d": "O SISTEMA DEVE permitir parear cada obstáculo com o OI que o supera (um OI pode superar vários obstáculos), listando como pendência os obstáculos sem OI e os OIs sem obstáculo (RN-09)", "s": "F-09", "seal": "🟡", "group": "Projeto APR: obstáculos e objetivos intermediários"}, {"id": "RF-18", "d": "O SISTEMA DEVE registrar o julgamento do teste de validade de cada par — &quot;Se &lt;OI&gt;, então &lt;obstáculo&gt; não impede mais &lt;objetivo&gt;&quot; — como parecer com autor e data, acumulável e nunca sobrescrito (RN-07; o padrão de parecer do M2)", "s": "F-09", "seal": "🟡", "group": "Projeto APR: obstáculos e objetivos intermediários"}, {"id": "RF-19", "d": "O SISTEMA DEVE permitir agrupar duas ou mais dependências com o mesmo OI de destino numa elipse de simultaneidade, com a leitura conjunta &quot;A e B precisam existir antes de C&quot;, e desfazê-la (RN-06)", "s": "F-09", "seal": "🟡", "group": "Projeto APR: obstáculos e objetivos intermediários"}, {"id": "RF-20", "d": "O SISTEMA DEVE avaliar a verbalização de obstáculo e de OI por função pura de domínio, sem rede e sem modelo, devolvendo avisos com o trecho apontado: verbo de ação (tarefa disfarçada), previsão futura em obstáculo, ausência genérica em vez de condição específica (RN-08)", "s": "F-09", "seal": "🟡", "group": "Verbalização avaliada"}, {"id": "RF-21", "d": "O SISTEMA DEVE tratar o aviso de verbalização como orientação, nunca veto: o registro procede, o aviso persiste visível até o texto mudar, e a reavaliação é automática na edição (RN-08)", "s": "", "seal": "🟡", "group": "Verbalização avaliada"}, {"id": "RF-22", "d": "O SISTEMA DEVE manter o léxico das heurísticas de verbalização como dado versionado por idioma sobre a mesma infraestrutura do léxico do M2, com corpus sintético próprio de obstáculos e OIs bons e maus — devolvendo <code>indeterminado</code> quando a heurística não alcançar o caso", "s": "", "seal": "🟡", "group": "Verbalização avaliada"}, {"id": "RF-23", "d": "O SISTEMA DEVE computar por função pura de domínio o sequenciamento da APR: camadas topológicas dos OIs (quem não depende de nada primeiro), ramos paralelos e elipses de simultaneidade", "s": "F-09", "seal": "🟡", "group": "Sequenciamento por dependência"}, {"id": "RF-24", "d": "QUANDO houver dependência circular entre OIs, O SISTEMA DEVE apontá-la como pendência bloqueante do sequenciamento, listando o ciclo com seus nós — diferente da ARA, onde ciclo é legítimo (RN-06 aqui; RF-29 do M2 lá)", "s": "F-29", "seal": "🟡", "group": "Sequenciamento por dependência"}, {"id": "RF-25", "d": "O SISTEMA DEVE gerar a tabela resumo — obstáculo, OI que o supera, dependências — na ordem das camadas, exibível na vista tabular e incluída na exportação do projeto", "s": "F-09", "seal": "🟡", "group": "Sequenciamento por dependência"}, {"id": "RF-26", "d": "O SISTEMA DEVE registrar <code>SequenciamentoGerado</code> com o resumo quantitativo (camadas, OIs por camada, pendências)", "s": "", "seal": "🟡", "group": "Sequenciamento por dependência"}, {"id": "RF-27", "d": "O SISTEMA DEVE recalcular pendências de pareamento e de sequenciamento a cada mutação relevante (nó, aresta, par, elipse), sem exigir regeneração manual para os contadores do cabeçalho", "s": "", "seal": "🟡", "group": "Sequenciamento por dependência"}, {"id": "RF-28", "d": "O SISTEMA DEVE permitir criar projeto do tipo AT, do zero ou derivado de um OI (RF-40), com nós-passo e arestas de precedência herdando canvas e tabela do M1", "s": "F-40", "seal": "🟡", "group": "Árvore de transição"}, {"id": "RF-29", "d": "O SISTEMA DEVE exigir em cada passo a tripla ação, necessidade e resultado esperado, e apresentar a leitura &quot;Para &lt;necessidade&gt;, &lt;ação&gt;; espero &lt;resultado&gt;&quot; na ficha do passo (RN-10)", "s": "", "seal": "🟡", "group": "Árvore de transição"}, {"id": "RF-30", "d": "O SISTEMA DEVE manter o status de cada passo (<code>pendente</code> | <code>em_execucao</code> | <code>concluido</code> | <code>bloqueado</code>), exigindo motivo no bloqueio e registrando o resultado real na conclusão — divergência entre esperado e real fica no evento, nunca sobrescreve o esperado", "s": "", "seal": "🟡", "group": "Árvore de transição"}, {"id": "RF-31", "d": "O SISTEMA DEVE apresentar o resumo de execução da AT (contagem por status, passos bloqueados com motivo) no cabeçalho do projeto", "s": "", "seal": "🟡", "group": "Árvore de transição"}, {"id": "RF-32", "d": "O SISTEMA DEVE ordenar a leitura da AT pela precedência declarada e apontar passos inalcançáveis (sem caminho desde os passos iniciais) como pendência", "s": "", "seal": "🟡", "group": "Árvore de transição"}, {"id": "RF-33", "d": "O SISTEMA DEVE manter a referência cruzada como agregado próprio com origem e destino tipados (projeto, elemento, papel) e tipo do vínculo (<code>promocao_ude_nc</code> | <code>semeadura_injecao_arf</code> | <code>derivacao_arf_apr</code> | <code>derivacao_oi_at</code>), criada somente por ação nomeada com evento (RN-11)", "s": "F-08", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-34", "d": "O SISTEMA DEVE exibir, na ficha de qualquer elemento encadeado, suas referências de origem e de destino com ação de navegar até a outra ponta", "s": "", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-35", "d": "QUANDO qualquer ponta de uma referência sofrer exclusão suave, O SISTEMA DEVE marcar a referência <code>pendente</code> — visível como tal na vista da cadeia — e reativá-la na restauração; referência nunca é apagada por efeito colateral (RN-12)", "s": "", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-36", "d": "O SISTEMA DEVE permitir promover um ou mais UDEs <code>Validado</code> de uma ARA para uma NC nova, preenchendo a ReferenciaDeOrigem da NC (INT-05 da spec 007) e registrando <code>UdePromovidoParaNc</code> — aplicação direta sob o item 8, com traço", "s": "F-10", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-37", "d": "O SISTEMA DEVE recusar a promoção de UDE que não esteja no status <code>Validado</code> — a cadeia nasce de sintoma auditado, não de rascunho (RN-13)", "s": "", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-38", "d": "O SISTEMA DEVE permitir semear uma ARF a partir de uma injeção <code>escolhida</code>, criando o nó semente (RF-06), preenchendo a ReferenciaDeSemeadura da NC (INT-06 da spec 007) e registrando <code>InjecaoSemeouArf</code>; injeção <code>candidata</code> ou <code>descartada</code> não semeia", "s": "F-06, F-10", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-39", "d": "O SISTEMA DEVE permitir derivar de uma ARF uma APR nova — objetivo proposto do texto do efeito ou injeção escolhido pelo gesto, editável — registrando <code>ArfDerivouApr</code> com a referência", "s": "", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-40", "d": "O SISTEMA DEVE permitir criar uma AT a partir de um OI da APR, com o OI como alvo e <code>OiDerivouAt</code> registrado; o alvo aparece na AT com a referência navegável", "s": "", "seal": "🟡", "group": "Referências cruzadas e promoções"}, {"id": "RF-41", "d": "O SISTEMA DEVE computar por função pura, sobre as referências cruzadas, a travessia completa de uma análise — UDE → NC → injeção → ARF → obstáculo → OI → passo — com estado por elo (<code>ativa</code> | <code>pendente</code>) e nos dois sentidos", "s": "F-08", "seal": "🟡", "group": "Vista da cadeia"}, {"id": "RF-42", "d": "O SISTEMA DEVE oferecer a vista da cadeia navegável a partir de qualquer elemento encadeado, com ação de abrir a ferramenta da outra ponta com o elemento focado", "s": "", "seal": "🟡", "group": "Vista da cadeia"}, {"id": "RF-43", "d": "O SISTEMA DEVE expor as ações <code>toc.suggest_future_effects</code>, <code>toc.suggest_obstacles</code>, <code>toc.suggest_intermediate_objectives</code> e <code>toc.suggest_transition_steps</code> no catálogo governado, cada sugestão mutadora nascendo <code>action_proposal</code> individual — aceitar cria o elemento com traço correlacionado à proposta; recusar não toca o projeto", "s": "F-14", "seal": "🟡", "group": "Assistência via catálogo (executa neste ciclo — a FSM do 006 existe)"}, {"id": "RF-44", "d": "O SISTEMA DEVE anexar às entradas das ações o contexto de domínio já computado — verificação da ARF, pendências de pareamento, sequenciamento — e nunca pedir ao modelo o que a função pura já decide (o padrão fixado pelo RF-33 do M2)", "s": "F-33", "seal": "🟡", "group": "Assistência via catálogo (executa neste ciclo — a FSM do 006 existe)"}, {"id": "RF-45", "d": "QUANDO a capability de escrita não estiver presente na introspecção, O SISTEMA DEVE omitir do catálogo as ações mutadoras do M4, mantendo o módulo inteiro funcional sem assistência — a assistência é aceleradora, nunca dependência", "s": "", "seal": "🟡", "group": "Assistência via catálogo (executa neste ciclo — a FSM do 006 existe)"}], "ris": [{"id": "RI-01", "d": "Os papéis dos nós — injeção e efeito futuro na ARF; objetivo, obstáculo e OI na APR; passo na AT — têm representação visual distinta por forma e por texto, nunca só cor", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "O ED exibe o selo de espelho com o UDE referenciado; o resumo de cobertura fica no cabeçalho da ARF com ação de listar UDEs descobertos", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "Ramos negativos são visíveis no canvas (marcação na raiz e no sub-ramo) e num painel lateral por estado, com a justificativa de <code>aceito</code> e a injeção de <code>tratado</code> a um clique", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "O canvas da APR lê de baixo para cima — camadas de base embaixo, objetivo no topo — e o obstáculo é anotado junto à dependência que ele motiva, a notação canônica da ferramenta (F-09)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "Os avisos de verbalização aparecem inline no texto do obstáculo/OI com o trecho apontado, no mesmo padrão da ficha de validação do M2 (RI-03 de lá)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "O sequenciamento apresenta as camadas como faixas visuais no canvas e como seções na tabela resumo; dependência circular é destacada como pendência bloqueante nos dois lugares", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "A elipse de simultaneidade usa a mesma notação visual do conector E (elipse sobre as arestas), com legenda própria — conjunção de necessidade, não de suficiência", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "A ficha do passo da AT apresenta a tripla como leitura corrida (&quot;Para …, …; espero …&quot;) e como campos editáveis; o status é mudável na ficha e na tabela", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-09", "d": "Todo elemento encadeado exibe selos discretos de origem e destino (ex.: &quot;de: NC · para: APR&quot;) que abrem a vista da cadeia; elo <code>pendente</code> aparece esmaecido com o motivo, nunca oculto", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-10", "d": "A vista da cadeia é uma superfície própria: os elos em sequência com ferramenta, nome e estado, navegável por teclado, com ação de foco que abre a ferramenta da ponta", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-11", "d": "As ações de promover, semear e derivar aparecem no contexto do elemento de origem (UDE validado, injeção escolhida, efeito da ARF, OI) — nunca num menu global sem alvo", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-12", "d": "As propostas das ações assistidas do M4 entram na bandeja de propostas do ciclo 006, com aceitar/recusar por item e a ação de origem declarada", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-13", "d": "Toda superfície do módulo respeita tema do hospedeiro com fallback, modo só-conteúdo e operação por teclado, herdados dos ciclos 002/003; textos por i18n pt/en, inclusive avisos de verbalização e leituras de aresta", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "A verificação da ARF, o sequenciamento da APR, a verbalização avaliada e a vista da cadeia são funções puras testáveis sem rede, sem banco e sem modelo — a suíte de domínio do módulo roda offline por construção (P3, P4)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "A fronteira hexagonal é verificada por <code>import-linter</code>: o pacote de domínio do M4 não importa framework, HTTP, banco nem cliente de IA — o build falha na violação", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Toda mutação do módulo emite traço OTel correlacionado e log estruturado (P5); promoções, semeaduras e derivações carregam no traço o identificador da referência criada — a linha auditável do encadeamento", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "O sequenciamento de uma APR com 100 OIs e 200 dependências computa em menos de 2 segundos no percentil 95 (o teto herdado do M1)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "A vista da cadeia de uma análise com até 50 referências resolve em menos de 1 segundo no percentil 95, medida na jornada viva", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "A verbalização avaliada responde em menos de 100 milissegundos para textos de até 500 caracteres, no mesmo regime da validação formal do M2 (RNF-04 de lá)", "s": "F-04", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "O corpus sintético de obstáculos e OIs é versionado com a mesma função forçante do M2: heurística nova sem caso novo no corpus não entra (RNF-07 de lá)", "s": "F-07", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "Nenhum prompt, chave ou cliente de provedor no repositório do produto — o grep de CI herdado dos ciclos anteriores cobre também os diretórios novos deste módulo (P7, ADR 0007)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-09", "d": "A integridade das referências cruzadas é coberta por teste de propriedade: qualquer sequência de exclusões suaves e restaurações termina com toda referência <code>ativa</code> ou <code>pendente</code> — nunca apontando para elemento inexistente sem estado que o diga", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-10", "d": "A exportação JSON dos três tipos de projeto inclui papéis, fichas, pares, elipses e referências cruzadas, mantendo o determinismo do E1.4 (duas exportações do mesmo estado são idênticas byte a byte — RF-32 do M1)", "s": "F-32", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "A ARF usa lógica de suficiência causal — a mesma da ARA: &quot;se &lt;causa&gt;, então &lt;efeito&gt;&quot; (a distinção suficiência × necessidade está na fonte técnica — F-09)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RN-02", "d": "Injeção é entidade que não existe ainda na realidade — o contraste com o obstáculo da APR, que existe hoje; os papéis não se confundem nem se convertem entre ferramentas (F-09)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RN-03", "d": "ED é efeito futuro que espelha um UDE referenciado pela cadeia; um UDE tem no máximo um ED por ARF; a cobertura da ARF mede UDEs espelhados e alcançados por injeção", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-04", "d": "Ramo negativo transiciona <code>aberto → tratado</code> somente com injeção de corte referenciada, e <code>aberto → aceito</code> somente com justificativa e autor; <code>tratado</code> e <code>aceito</code> reabrem por ação explícita", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-05", "d": "A APR usa lógica de condição necessária: a aresta lê &quot;precisa existir antes de&quot;, nunca &quot;se… então…&quot; — as duas lógicas não se misturam no mesmo projeto (F-09)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RN-06", "d": "O grafo de dependência dos OIs é acíclico: dependência circular é pendência bloqueante do sequenciamento (F-09 — &quot;sequência inválida&quot;); a elipse de simultaneidade agrupa ≥ 2 dependências com o mesmo destino", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RN-07", "d": "O teste de validade do par obstáculo ↔ OI — &quot;Se &lt;OI&gt;, então &lt;obstáculo&gt; não impede mais &lt;objetivo&gt;&quot; — é julgamento registrado como parecer com autor, nunca campo calculado (F-09)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RN-08", "d": "A verbalização avaliada avisa, não veta: obstáculo verbalizado como tarefa ou previsão, e OI verbalizado como ação, geram aviso com trecho apontado; o registro procede e o aviso persiste até o texto mudar (F-09 — regras de Dettmer/Scheinkopf como heurística decidível parcial)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RN-09", "d": "Obstáculo sem OI e OI sem obstáculo são pendências listadas, não proibições de gravação — o levantamento em grupo precisa registrar antes de parear; o sequenciamento só se declara completo com pareamento total (F-09)", "s": "F-09", "seal": "🟡", "group": ""}, {"id": "RN-10", "d": "Todo passo da AT carrega a tripla ação · necessidade · resultado esperado; passo sem necessidade explícita é o que degrada a AT a lista de tarefas — os três campos são obrigatórios na criação", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-11", "d": "Referência cruzada nasce somente por ação nomeada do titular (promover, semear, derivar) ou por proposta aceita — nunca por inferência silenciosa de sistema ou modelo; toda criação tem evento com autor (item 8 da constituição — F-15)", "s": "F-15", "seal": "🟡", "group": ""}, {"id": "RN-12", "d": "Exclusão suave de qualquer ponta suspende a referência (<code>pendente</code>) e restauração a reativa; nenhuma operação do módulo apaga referência como efeito colateral — apagar referência é ação própria, com evento", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-13", "d": "A promoção UDE → NC exige UDE em status <code>Validado</code> (FSM do M2); a semeadura NC → ARF exige injeção em status <code>escolhida</code> (FSM do M3) — a cadeia só avança sobre material auditado", "s": "F-10, F-11", "seal": "🟡", "group": ""}], "ints": [{"id": "INT-01", "d": "O M4 consome do M1 o núcleo (projeto, nó, aresta, canvas, tabela, desfazer, exportação); do M2, o UDE validado e o pacote de suficiência causal (exame de elo, conector E); do M3, a injeção <code>escolhida</code> e os campos de referência; da junta 003, identidade, isolamento por inquilino e OTel; do ciclo 006, a FSM de proposta, o catálogo e o registro de telas. Nenhuma dessas peças é reimplementada aqui", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "Execução do INT-05 da spec 007 (<code>specs/007-nuvem-de-conflito/spec.md</code>): a promoção UDE → NC (RF-36) preenche a ReferenciaDeOrigem da NC na mesma transação que cria a ReferenciaCruzada — a ação prometida lá nasce aqui", "s": "F-36, F-10", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "Execução do INT-06 da spec 007: a semeadura injeção → ARF (RF-38) preenche a ReferenciaDeSemeadura da NC e cria o projeto ARF com o nó semente", "s": "F-38, F-10", "seal": "🟡", "group": ""}, {"id": "INT-04", "d": "As derivações ARF → APR (RF-39) e OI → AT (RF-40) seguem o mesmo regime das promoções: ação direta do titular sob o item 8 — alvo nomeado pelo gesto, reversível por exclusão suave, traço obrigatório — sem tela de confirmação e sem FSM de proposta", "s": "F-39, F-40, F-15", "seal": "🟡", "group": ""}, {"id": "INT-05", "d": "<code>toc.suggest_future_effects</code> — catálogo <code>toc.*</code>, mutadora (cria nós/arestas na ARF); entrada: injeção + grafo + verificação (RF-11) como contexto; saída: propostas de efeito futuro ligado, uma <code>action_proposal</code> por sugestão. Executa neste ciclo pela FSM do 006", "s": "F-11, F-14", "seal": "🟡", "group": ""}, {"id": "INT-06", "d": "<code>toc.suggest_obstacles</code> — mutadora (cria obstáculos na APR); entrada: objetivo + elementos existentes + referência da ARF de origem quando houver; saída: propostas de obstáculo, uma a uma", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-07", "d": "<code>toc.suggest_intermediate_objectives</code> — mutadora (cria OI pareado); entrada: um obstáculo + contexto; saída: propostas de OI com o par pré-preenchido — o julgamento do teste de validade permanece humano (RN-07), nunca vem preenchido pela ação", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-08", "d": "<code>toc.suggest_transition_steps</code> — mutadora (cria passos na AT); entrada: OI alvo + passos existentes; saída: propostas de passo com a tripla completa — proposta sem os três campos é recusada pela validação de schema antes de virar <code>action_proposal</code>", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-09", "d": "Telas deste módulo entram no registro de telas do E7.5 com identificador estável (<code>toc.arf_canvas</code>, <code>toc.apr_canvas</code>, <code>toc.apr_sequencia</code>, <code>toc.at_canvas</code>, <code>toc.cadeia</code>), no formato do ciclo 006; textos de efeito, obstáculo, OI, passo e justificativa marcam <code>ai_visible</code> campo a campo para o snapshot sanitizado", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-10", "d": "A exportação/importação do E1.4 cobre os três tipos de projeto com seus dados anexos e as referências cruzadas (RNF-10) — o portão executável do round 008 (<code>docs/roadmap.md</code>); importar um projeto cujas referências apontam para fora do arquivo relata os elos como <code>pendente</code>, nunca os descarta em silêncio", "s": "F-10, F-13", "seal": "🟡", "group": ""}, {"id": "INT-11", "d": "Os prompts das quatro ações do catálogo são versionados no servidor e nunca circulam no cliente nem no snapshot (ADR 0007); ramo negativo não tem ação de catálogo neste ciclo (RF-10)", "s": "F-10, F-14", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/tocbuilderv3/components/Sidebar.tsx", "rel": "/home/user/tocbuilderv3/components/Sidebar.tsx", "lines": "55-58", "desc": "as três ferramentas como botão cinza na 4ª geração (`grep -n \"disabled: true\" components/Sidebar.tsx` → `55: … view: 'ARF', disabled: true },` · `56: … view: 'APR', disabled: true },` · `57: … view: 'AT', disabled: true },` · `58: … view: 'SNT_TREE', disabled: true },` — a 58 é a S&T, módulo M5) — o D-04 na fonte", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/Sidebar.tsx:55-58 — as três ferramentas como botão cinza na 4ª geração (grep -n &quot;disabled: true&quot; components/Sidebar.tsx → 55: … view: &#x27;ARF&#x27;, disabled: true }, · 56: … view: &#x27;APR&#x27;, disabled: true }, · 57: … view: &#x27;AT&#x27;, disabled: true }, · 58: … view: &#x27;SNT_TREE&#x27;, disabled: true }, — a 58 é a S&amp;T, módulo M5) — o D-04 na fonte"}, {"tag": "F-02", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "249-258", "desc": "o tipo-união `TocTool` inclui `'ARF' | 'APR' | 'AT'`: o **tipo de navegação** existia; nenhum tipo de dado, componente ou prompt existiu para as três (ver F-05..F-07)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:249-258 — o tipo-união TocTool inclui &#x27;ARF&#x27; | &#x27;APR&#x27; | &#x27;AT&#x27;: o tipo de navegação existia; nenhum tipo de dado, componente ou prompt existiu para as três (ver F-05..F-07)"}, {"tag": "F-03", "path": "/home/user/tocbuilderv3/components/Sidebar.tsx", "rel": "/home/user/tocbuilderv3/components/Sidebar.tsx", "lines": "86-88", "desc": "`const araProjectDependentViews: TocTool[] = ['ARF', 'APR', 'AT'];` seguido de `itemIsDisabled = itemIsDisabled || !isProjectLoaded;` — a linhagem **declarou na navegação** que as três dependem de uma ARA carregada, a intenção de encadeamento que nunca chegou ao modelo de dados (F-08)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/Sidebar.tsx:86-88 — const araProjectDependentViews: TocTool[] = [&#x27;ARF&#x27;, &#x27;APR&#x27;, &#x27;AT&#x27;]; seguido de itemIsDisabled = itemIsDisabled || !isProjectLoaded; — a linhagem declarou na navegação que as três dependem de uma ARA carregada, a intenção de encadeamento que nunca chegou ao modelo de dados (F-08)"}, {"tag": "F-04", "path": "", "rel": "", "lines": "", "desc": "/home/user/tocbuilderv3/locales/pt.ts:68-70 e locales/en.ts:70-72 — os nomes: \"Árvore Realidade Futura (ARF)\" / \"Future Reality Tree (FRT)\", \"Árvore de Pré-Requisitos (APR)\" / \"Prerequisite Tree (PRT)\", \"Árvore de Transição (AT)\" / \"Transition Tree (TT)\" — o vocabulário bilíngue desta spec vem da linhagem", "seal": "🟢", "internal": false, "t": " — /home/user/tocbuilderv3/locales/pt.ts:68-70 e locales/en.ts:70-72 — os nomes: &quot;Árvore Realidade Futura (ARF)&quot; / &quot;Future Reality Tree (FRT)&quot;, &quot;Árvore de Pré-Requisitos (APR)&quot; / &quot;Prerequisite Tree (PRT)&quot;, &quot;Árvore de Transição (AT)&quot; / &quot;Transition Tree (TT)&quot; — o vocabulário bilíngue desta spec vem da linhagem"}, {"tag": "F-05", "path": "/home/user/tocbuilderv3/components/", "rel": "/home/user/tocbuilderv3/components/", "lines": "", "desc": "zero componentes das três ferramentas: `ls components/ | grep -icE \"arf|apr|prereq|future|transition\"` → `0`", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/ — zero componentes das três ferramentas: ls components/ | grep -icE &quot;arf|apr|prereq|future|transition&quot; → 0"}, {"tag": "F-06", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "", "desc": "nenhum dos 8 prompts da linhagem menciona as três ferramentas: `grep -n \"ARF\" constants.ts` → 3 linhas (417, 422, 427), todas listas de permissão de perfil (`permissions: ['ARA', 'SNT_TREE', 'NC', 'ARF', 'APR', 'AT', …]`)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts — nenhum dos 8 prompts da linhagem menciona as três ferramentas: grep -n &quot;ARF&quot; constants.ts → 3 linhas (417, 422, 427), todas listas de permissão de perfil (permissions: [&#x27;ARA&#x27;, &#x27;SNT_TREE&#x27;, &#x27;NC&#x27;, &#x27;ARF&#x27;, &#x27;APR&#x27;, &#x27;AT&#x27;, …])"}, {"tag": "F-07", "path": "/home/user/tocbuilderv3", "rel": "/home/user/tocbuilderv3", "lines": "", "desc": "o domínio da APR e do ramo negativo tem **zero** precedente: `grep -rniE \"obstác|obstacle|objetivo intermediário|intermediate objective|negative branch|ramo negativo\" --include=\"*.ts\" --include=\"*.tsx\" . | grep -v node_modules | wc -l` → `0` — tudo neste módulo é 🟡 por construção", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3 — o domínio da APR e do ramo negativo tem zero precedente: grep -rniE &quot;obstác|obstacle|objetivo intermediário|intermediate objective|negative branch|ramo negativo&quot; --include=&quot;.ts&quot; --include=&quot;.tsx&quot; . | grep -v node_modules | wc -l → 0 — tudo neste módulo é 🟡 por construção"}, {"tag": "F-08", "path": "", "rel": "", "lines": "", "desc": "`docs/produto/visao.md` §6, D-04 e D-11 — e a contagem reexecutada nesta spec: `grep -c \"araProjectId\\|sourceUdeId\\|linkedProject\\|crossTool\" types.ts` → `0` — nenhuma referência cruzada entre projetos no modelo da 4ª geração; o E4.4 é a correção", "seal": "🟢", "internal": false, "t": " — docs/produto/visao.md §6, D-04 e D-11 — e a contagem reexecutada nesta spec: grep -c &quot;araProjectId\\|sourceUdeId\\|linkedProject\\|crossTool&quot; types.ts → 0 — nenhuma referência cruzada entre projetos no modelo da 4ª geração; o E4.4 é a correção"}, {"tag": "F-09", "path": "", "rel": "", "lines": "", "desc": "skill toc-prt (sessão local), arquivo de referência prt-methodology.md — a fonte técnica da APR: lógica de condição necessária, distinta da causa suficiente das árvores de realidade (l.21); obstáculo como condição presente, não tarefa nem previsão (l.36-42); OI como estado conquistado (l.53-60); teste IO-Obstáculo (l.72-79); elipses de simultaneidade (l.111); construção em 10 passos de Dettmer e 4", "seal": "🟢", "internal": false, "t": " — skill toc-prt (sessão local), arquivo de referência prt-methodology.md — a fonte técnica da APR: lógica de condição necessária, distinta da causa suficiente das árvores de realidade (l.21); obstáculo como condição presente, não tarefa nem previsão (l.36-42); OI como estado conquistado (l.53-60); teste IO-Obstáculo (l.72-79); elipses de simultaneidade (l.111); construção em 10 passos de Dettmer e 4"}, {"tag": "F-10", "path": "specs/007-nuvem-de-conflito/spec.md", "rel": "specs/007-nuvem-de-conflito/spec.md", "lines": "", "desc": "ReferenciaDeOrigem e ReferenciaDeSemeadura (§ Entidades e modelo de domínio) criadas vazias no ciclo 007, e os INT-05/INT-06 de lá delegando a execução — promoção e semeadura — a este ciclo; o status `escolhida` como o único que semeia (RN-08 de lá)", "seal": "🟢", "internal": true, "t": "specs/007-nuvem-de-conflito/spec.md — ReferenciaDeOrigem e ReferenciaDeSemeadura (§ Entidades e modelo de domínio) criadas vazias no ciclo 007, e os INT-05/INT-06 de lá delegando a execução — promoção e semeadura — a este ciclo; o status escolhida como o único que semeia (RN-08 de lá)"}, {"tag": "F-11", "path": "specs/005-arvore-da-realidade-atual/spec.md", "rel": "specs/005-arvore-da-realidade-atual/spec.md", "lines": "", "desc": "o UDE `Validado` (FSM, RN-10 de lá) que a promoção exige, e o exame de elo + conector E (E2.2) que a ARF reusa como pacote de suficiência causal; o Clarify 3 de lá já antecipava que o ciclo 008 exigiria o conector E de qualquer forma", "seal": "🟢", "internal": true, "t": "specs/005-arvore-da-realidade-atual/spec.md — o UDE Validado (FSM, RN-10 de lá) que a promoção exige, e o exame de elo + conector E (E2.2) que a ARF reusa como pacote de suficiência causal; o Clarify 3 de lá já antecipava que o ciclo 008 exigiria o conector E de qualquer forma"}, {"tag": "F-12", "path": "docs/produto/rounds.md", "rel": "docs/produto/rounds.md", "lines": "", "desc": "Round 008: aptidão executável (teste de domínio que percorre a cadeia inteira e prova a referência de origem em cada elo; as três árvores exportáveis pelo E1.4), fora (ramos negativos assistidos), corte (\"sai primeiro\" a AT; \"nunca sai\" o encadeamento), defeitos D-04 e D-11", "seal": "🟢", "internal": true, "t": "docs/produto/rounds.md — Round 008: aptidão executável (teste de domínio que percorre a cadeia inteira e prova a referência de origem em cada elo; as três árvores exportáveis pelo E1.4), fora (ramos negativos assistidos), corte (&quot;sai primeiro&quot; a AT; &quot;nunca sai&quot; o encadeamento), defeitos D-04 e D-11"}, {"tag": "F-13", "path": "docs/roadmap.md", "rel": "docs/roadmap.md", "lines": "", "desc": "Ciclo 008: os três portões (cadeia, exportação, jornada) e as pré-condições — ciclos 005 e 007 promovidos, decisão registrada sobre ramos negativos manuais nesta v1", "seal": "🟢", "internal": true, "t": "docs/roadmap.md — Ciclo 008: os três portões (cadeia, exportação, jornada) e as pré-condições — ciclos 005 e 007 promovidos, decisão registrada sobre ramos negativos manuais nesta v1"}, {"tag": "F-14", "path": "docs/adr/0007-ia-somente-pela-fundacao.md", "rel": "docs/adr/0007-ia-somente-pela-fundacao.md", "lines": "", "desc": "toda assistência via catálogo de ações governadas; prompts versionados no servidor", "seal": "🟢", "internal": true, "t": "docs/adr/0007-ia-somente-pela-fundacao.md — toda assistência via catálogo de ações governadas; prompts versionados no servidor"}, {"tag": "F-15", "path": "", "rel": "", "lines": "", "desc": "`docs/governance/constitution.md` linhas 64-71 (alcance do P2) e 87-94 (item 8: manipulação direta aplica na hora sob três testes; intenção inferida nasce proposta; FSM uma só e do servidor)", "seal": "🟢", "internal": false, "t": " — docs/governance/constitution.md linhas 64-71 (alcance do P2) e 87-94 (item 8: manipulação direta aplica na hora sob três testes; intenção inferida nasce proposta; FSM uma só e do servidor)"}], "chain": [{"label": "spec.md", "href": "specs/008-arvores-de-futuro-e-implementacao/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/008-arvores-de-futuro-e-implementacao/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/008-arvores-de-futuro-e-implementacao/tasks.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/008-arvores-de-futuro-e-implementacao/qa-report.md", "state": "pending"}, {"label": "código do ciclo 008", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "As três ferramentas não têm nenhum precedente de implementação na linhagem (F-05..F-07) — nem tela, nem tipo, nem prompt. Assunção: o método TOC via fonte técnica (F-09) e a analogia estrutural com M2/M3 (nó tipado + ficha + função pura) bastam para a primeira versão; onde o método admite variação, esta spec decide e declara — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": "F-05, F-07, F-09"}, {"id": "L-02", "d": "As heurísticas de verbalização de obstáculo/OI (RF-20) não têm corpus prévio. Assunção: a infraestrutura do M2 (léxico versionado + <code>indeterminado</code> honesto + corpus sintético como função forçante) transfere para o vocabulário da APR; como aqui o aviso não veta (RN-08), o custo do erro é menor que no M2 — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-03", "d": "O apetite — três ferramentas novas + encadeamento + extração do pacote de suficiência em um ciclo — é a maior aposta do roadmap depois do 003. Assunção: o corte do round (sai primeiro a AT, que é o diagrama de menor risco; nunca sai o encadeamento) absorve o estouro; se a AT sair, as derivações OI → AT (RF-40) saem junto e o RF-33 perde um tipo de vínculo — risco alto.", "risco": "alto", "cmds": [], "paths": [], "s": ""}, {"id": "L-04", "d": "A extração do exame de elo + conector E do M2 para pacote compartilhado (RF-03) refatora código promovido no ciclo 005. Assunção: a suíte do 005 é a rede de proteção (entregável explícito: ela continua verde); se a extração ameaçar o apetite, a ARF duplica temporariamente com dívida declarada em ADR — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-05", "d": "A vista da cadeia (RF-41) assume travessia linear UDE → … → passo, mas análises reais podem ramificar (uma NC com duas injeções escolhidas semeando duas ARFs). Assunção: a v1 apresenta a cadeia como grafo percorrido a partir do elemento de entrada, mostrando ramificações como listas no elo — sem layout de grafo novo; se a jornada mostrar que não basta, a evolução é de UI, não de modelo — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}]}, {"id": "009", "name": "Focalização (M6 — Focalização)", "specNum": "009", "specPath": "specs/009-focalizacao/spec.md", "modules": ["M6"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE permitir criar análise de focalização — sistema analisado (nome, descrição) — herdando do M1 listagem, isolamento por inquilino, exclusão suave, restauração e exportação/importação sem reimplementação", "s": "", "seal": "🟡", "group": "Análise de focalização"}, {"id": "RF-02", "d": "QUANDO uma análise for criada, O SISTEMA DEVE abrir o primeiro ciclo de focalização no passo <code>identificar</code>, com os cinco passos instanciados em sequência canônica — não existe ciclo sem os cinco passos (RN-01)", "s": "", "seal": "🟡", "group": "Análise de focalização"}, {"id": "RF-03", "d": "O SISTEMA DEVE apresentar na listagem de análises o passo atual e a restrição vigente do ciclo aberto de cada uma", "s": "", "seal": "🟡", "group": "Análise de focalização"}, {"id": "RF-04", "d": "QUANDO uma análise for excluída, O SISTEMA DEVE aplicar a exclusão suave do M1 arquivando ciclos, passos, restrições e vínculos juntos; a restauração devolve tudo", "s": "", "seal": "🟡", "group": "Análise de focalização"}, {"id": "RF-05", "d": "O SISTEMA DEVE permitir registrar a restrição do ciclo aberto — descrição, tipo (<code>fisica</code> | <code>politica</code> | <code>de_mercado</code>), justificativa — com autoria por evento; no máximo uma restrição vigente por ciclo (RN-03)", "s": "F-04", "seal": "🟡", "group": "Registro da restrição"}, {"id": "RF-06", "d": "O SISTEMA DEVE permitir registrar a restrição a partir de um nó de causa raiz de uma ARA vinculada, preenchendo a referência de origem — e DEVE permitir registrá-la manualmente, sem ARA nenhuma: a ferramenta ajuda, nunca condiciona (INT-02)", "s": "", "seal": "🟡", "group": "Registro da restrição"}, {"id": "RF-07", "d": "O SISTEMA DEVE permitir editar a descrição e a justificativa da restrição do ciclo aberto com evento; trocar a restrição de alvo não é edição — é recomeço (RN-03, RF-15)", "s": "F-15", "seal": "🟡", "group": "Registro da restrição"}, {"id": "RF-08", "d": "O SISTEMA DEVE recusar, no domínio, a conclusão do passo <code>identificar</code> sem restrição registrada — os demais passos concluem com decisão registrada (RF-09)", "s": "F-09", "seal": "🟡", "group": "Registro da restrição"}, {"id": "RF-09", "d": "O SISTEMA DEVE permitir concluir o passo em andamento registrando a decisão que o encerra (texto, autor, data por evento); a conclusão move o ciclo ao passo seguinte na ordem canônica — avanço é ato explícito, nunca efeito colateral (RN-01)", "s": "", "seal": "🟡", "group": "Passo atual e avanço"}, {"id": "RF-10", "d": "O SISTEMA DEVE permitir reabrir o passo imediatamente anterior do ciclo aberto mediante justificativa, com evento <code>PassoReaberto</code> — sem apagar a decisão que o havia concluído (o histórico de decisões é somente-acréscimo)", "s": "", "seal": "🟡", "group": "Passo atual e avanço"}, {"id": "RF-11", "d": "O SISTEMA DEVE manter notas por passo — texto livre acumulável, com autoria — distintas da decisão de conclusão", "s": "", "seal": "🟡", "group": "Passo atual e avanço"}, {"id": "RF-12", "d": "O SISTEMA DEVE apresentar o mapa da jornada do ciclo aberto: os cinco passos em sequência com estado, decisão registrada ou pendência de cada um, e os vínculos de ferramenta de cada passo — computado por função pura de domínio (JornadaDaAnalise)", "s": "", "seal": "🟡", "group": "Jornada guiada e vínculos de ferramenta"}, {"id": "RF-13", "d": "QUANDO um passo for aberto, O SISTEMA DEVE apresentar o produto herdado dos passos anteriores do mesmo ciclo — a restrição (de identificar) e as decisões já registradas — no topo do painel do passo (F-04: &quot;estado herdado do anterior&quot;)", "s": "F-04", "seal": "🟡", "group": "Jornada guiada e vínculos de ferramenta"}, {"id": "RF-14", "d": "O SISTEMA DEVE permitir criar ou vincular, a partir de um passo, um projeto de outra ferramenta do mesmo tenant — as combinações canônicas por passo (RN-06): <code>identificar</code>→ARA, <code>explorar</code>→NC ou ARF, <code>subordinar</code>→NC, <code>elevar</code>→APR ou AT; vínculo fora do canônico exige justificativa e fica com aviso, nunca bloqueado. O vínculo é navegável nos dois sentidos e mostra o estado do projeto vinculado", "s": "", "seal": "🟡", "group": "Jornada guiada e vínculos de ferramenta"}, {"id": "RF-15", "d": "O SISTEMA DEVE permitir recomeçar a partir do passo <code>recomecar</code>: o ciclo atual fecha (somente leitura), um novo ciclo abre no passo <code>identificar</code> sem restrição — e nada do ciclo anterior é apagado ou sobrescrito (RN-04; o portão executável do roadmap, F-06)", "s": "F-06", "seal": "🟡", "group": "Recomeçar sem inércia"}, {"id": "RF-16", "d": "QUANDO um novo ciclo abrir por recomeço, O SISTEMA DEVE herdar as decisões de exploração e subordinação do ciclo anterior como DecisoesHerdadas com veredito <code>pendente</code>; o passo <code>subordinar</code> do novo ciclo não conclui enquanto houver veredito pendente — cada uma exige <code>mantida</code> ou <code>revogada</code> com justificativa (RN-05)", "s": "", "seal": "🟡", "group": "Recomeçar sem inércia"}, {"id": "RF-17", "d": "O SISTEMA DEVE apresentar a linha do tempo da análise: os ciclos em ordem, cada um com restrição, datas de abertura/fechamento e decisões — o ciclo fechado abre em modo somente leitura", "s": "", "seal": "🟡", "group": "Recomeçar sem inércia"}, {"id": "RF-18", "d": "O SISTEMA DEVE exportar e importar a análise completa pelo E1.4 do M1 — ciclos, passos, restrições, decisões, vínculos (como referências) e vereditos de herança — sem perda em ida e volta; vínculo cujo projeto não exista no destino importa como referência pendente declarada, nunca falha silenciosa", "s": "", "seal": "🟡", "group": "Recomeçar sem inércia"}, {"id": "RF-19", "d": "O SISTEMA DEVE expor <code>toc.suggest_constraint</code> no catálogo governado: entrada é o estado da ARA vinculada ao passo identificar; saída são candidatas a restrição (nó + racional), cada uma nascendo <code>acti
