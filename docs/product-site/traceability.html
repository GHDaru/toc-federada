0", "seal": "🟡", "group": ""}, {"id": "RI-10", "d": "Toda superfície do módulo respeita o tema do hospedeiro (com fallback) e o modo só-conteúdo definidos no ciclo 002/003, funcionando de 420px de largura para cima", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-11", "d": "Toda ação tem rótulo textual acessível (não só ícone), foco visível e operação completa por teclado — inclusive criar aresta sem arrastar (pela tabela)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-12", "d": "Estados de carregamento, erro e recusa de autorização são telas desenhadas com próxima ação clara, não texto cru de exceção", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "Toda mutação de domínio emite traço OTel correlacionado (requisição → caso de uso → repositório) e log estruturado com identificador de correlação — sem traço, a funcionalidade não está pronta (P5)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "O domínio e a aplicação não importam framework, banco ou HTTP; a fronteira é verificada por <code>import-linter</code> que falha o build na violação (P3)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "O isolamento por inquilino é imposto na camada de consulta (toda query filtra por inquilino vindo da introspecção), coberto por teste que tenta ler através da fronteira e falha", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "A autorização usa exclusivamente as capacidades devolvidas pela introspecção — nunca texto produzido por modelo (P2, item 3) — e a recusa é fail-closed", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Abrir um projeto com 200 nós e 300 arestas responde em menos de 2 segundos no percentil 95, medido por teste de carga registrado no qa-report do ciclo", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "A interação de canvas (arrasto, pan, zoom) mantém 30 quadros por segundo ou mais com 200 nós, medida no protótipo de performance antes do aceite", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "A importação limita o payload (tamanho máximo declarado na configuração) e processa a validação sem bloquear o serviço para outros usuários", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "Toda cadeia de caracteres visível ao usuário passa pelo mecanismo de i18n pt/en desde o primeiro commit de interface (E8.3) — nenhum literal solto em componente", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-09", "d": "Migrações de banco (Alembic) são reversíveis: cada migração tem downgrade testado, e a migração da exclusão suave preserva dados existentes", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-10", "d": "Nenhum segredo, chave ou credencial no cliente ou no repositório — a violação canônica da linhagem é o contraexemplo medido (chave do provedor no navegador, D-01 da visão). Verificação por grep no CI (P7)", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "Aresta causal é dirigida e lê-se &quot;Se &lt;origem&gt;, então &lt;destino&gt;&quot; — a semântica de suficiência que todas as ferramentas TOC herdam. 🟢 (a leitura causal está na linhagem: <code>tocbuilderv3/APLICATION_PURPOSE.md:24</code>)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-02", "d": "Auto-laço (aresta de um nó para ele mesmo) é inválido em qualquer ferramenta", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-03", "d": "Aresta duplicada (mesmo par origem→destino) é inválida; a mesma dupla de nós pode ter arestas nos dois sentidos (laços de reforço são legítimos na TOC e a análise deles é de M2, não daqui)", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-04", "d": "O núcleo não conhece semântica TOC: tipo de nó no M1 é <code>generico</code>, e módulos M2–M5 estendem por tipo de projeto — nenhuma regra de UDE, premissa ou injeção entra neste módulo (correção estrutural do D-08, que enterrou regra de negócio em prompt)", "s": "F-15", "seal": "🟡", "group": ""}, {"id": "RN-05", "d": "Exclusão de projeto é sempre suave; exclusão definitiva só de projeto já na lixeira, por confirmação explícita", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-06", "d": "Importação nunca muta projeto existente: o resultado é sempre projeto novo com identificadores novos e mapeamento relatado", "s": "", "seal": "🟡", "group": ""}], "ints": [{"id": "INT-01", "d": "Identidade e autorização pela junta do ciclo 003: token da fundação → <code>POST /auth/introspect</code> → (inquilino, usuário, capacidades). O M1 não implementa introspecção; consome-a. (fronteira APH: E7.1)", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "Nenhuma ação de IA neste ciclo: o catálogo <code>toc.</code> e a FSM de proposta são do ciclo 006. As telas deste módulo, porém, já nascem registráveis — cada tela declara identificador estável para o registro de telas do E7.5, para que o ciclo 006 as componha sem retrabalho", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "A política por tipo de ação (RF-21) usa o mesmo vocabulário de classes de risco do catálogo futuro, para que as ações do M1 entrem no catálogo <code>toc.*</code> do ciclo 006 sem renomear", "s": "F-21", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "9-15", "desc": "`interface Node<T>` genérico (id, position, data, width, height) — a forma de nó que o M1 herda e tipa por módulo", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:9-15 — interface Node&lt;T&gt; genérico (id, position, data, width, height) — a forma de nó que o M1 herda e tipa por módulo"}, {"tag": "F-02", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "17-31", "desc": "`interface Edge` (source, target, handles, estilo) — a aresta causal; a leitura \"Se A... então B...\" está em `APLICATION_PURPOSE.md:24`", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:17-31 — interface Edge (source, target, handles, estilo) — a aresta causal; a leitura &quot;Se A... então B...&quot; está em APLICATION_PURPOSE.md:24"}, {"tag": "F-03", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "55-65", "desc": "`AraProject` com `nodes` e `edges` embutidos no projeto — o agregado que o M1 formaliza", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:55-65 — AraProject com nodes e edges embutidos no projeto — o agregado que o M1 formaliza"}, {"tag": "F-04", "path": "/home/user/tocbuilderv3/services/mockApiService.ts", "rel": "/home/user/tocbuilderv3/services/mockApiService.ts", "lines": "9-14", "desc": "`let projects: AraProject[] = []` e mais dois vetores — toda a \"persistência\" da 4ª geração era memória de processo; recarregar perdia tudo", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/mockApiService.ts:9-14 — let projects: AraProject[] = [] e mais dois vetores — toda a &quot;persistência&quot; da 4ª geração era memória de processo; recarregar perdia tudo"}, {"tag": "F-05", "path": "/home/user/tocbuilderv3/services/mockApiService.ts", "rel": "/home/user/tocbuilderv3/services/mockApiService.ts", "lines": "84-94", "desc": "`deleteProject` remove por `filter` — exclusão destrutiva e imediata, sem lixeira", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/mockApiService.ts:84-94 — deleteProject remove por filter — exclusão destrutiva e imediata, sem lixeira"}, {"tag": "F-06", "path": "/home/user/tocbuilderv3/services/mockApiService.ts", "rel": "/home/user/tocbuilderv3/services/mockApiService.ts", "lines": "521", "desc": "`project.nodes = project.nodes.filter(n => n.id === nodeId);` — o filtro invertido: excluir um nó da S&T mantinha **só** o nó excluído e apagava todos os outros. Verificado nesta leitura; linha colada. É o argumento executável do TDD deste ciclo", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/mockApiService.ts:521 — project.nodes = project.nodes.filter(n =&gt; n.id === nodeId); — o filtro invertido: excluir um nó da S&amp;T mantinha só o nó excluído e apagava todos os outros. Verificado nesta leitura; linha colada. É o argumento executável do TDD deste ciclo"}, {"tag": "F-07", "path": "/home/user/tocbuilderv3/api_specifications.md", "rel": "/home/user/tocbuilderv3/api_specifications.md", "lines": "", "desc": "20 endpoints especificados (`grep -c '^### \\`' api_specifications.md` → `20`), 9 deles do recurso de projetos/nós/ arestas; nenhuma chamada real de rede existe no app (`grep -rn \"fetch(\\|axios\"` sobre `.ts/.tsx`, excluído `node_modules` → vazio, código 1) — especificado 4 vezes, construído zero (D-03)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/api_specifications.md — 20 endpoints especificados (grep -c &#x27;^### \\&#x27; api_specifications.md → 20), 9 deles do recurso de projetos/nós/ arestas; nenhuma chamada real de rede existe no app (grep -rn &quot;fetch(\\|axios&quot; sobre .ts/.tsx, excluído node_modules → vazio, código 1) — especificado 4 vezes, construído zero (D-03)"}, {"tag": "F-08", "path": "/home/user/tocbuilderv3/components/EntitiesPanel.tsx", "rel": "/home/user/tocbuilderv3/components/EntitiesPanel.tsx", "lines": "34,90-114,128-154", "desc": "o painel de entidades: abas nós/arestas com contagem (l.47), tabelas com editar/excluir, foco no canvas (l.106), redimensionável (l.56-60) — a vista tabular que provou valor", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/EntitiesPanel.tsx:34,90-114,128-154 — o painel de entidades: abas nós/arestas com contagem (l.47), tabelas com editar/excluir, foco no canvas (l.106), redimensionável (l.56-60) — a vista tabular que provou valor"}, {"tag": "F-09", "path": "/home/user/tocbuilderv3/App.tsx", "rel": "/home/user/tocbuilderv3/App.tsx", "lines": "34,96", "desc": "`AUTOSAVE_KEY` em `localStorage` — o único paliativo de persistência da linhagem, um snapshot por navegador, só da sessão ARA aberta (D-07)", "seal": §4), evento compensatório (§6)", "seal": "🟢", "internal": false, "t": "/home/user/gestaodeprioridades/docs/adr/0013-desfazer-de-sessao-reverter-de-dominio.md — o padrão pago pela irmã: pilha de sessão sem teto (§1), episódio (§2), recarregar mata a pilha e o que sobra chama-se reverter (§4), evento compensatório (§6)"}, {"tag": "F-14", "path": "docs/produto/rounds.md", "rel": "docs/produto/rounds.md", "lines": "", "desc": "Round 004: apetite, aptidão executável, \"sai primeiro: o desfazer de sessão\", \"nunca sai: a vista tabular\"", "seal": "🟢", "internal": true, "t": "docs/produto/rounds.md — Round 004: apetite, aptidão executável, &quot;sai primeiro: o desfazer de sessão&quot;, &quot;nunca sai: a vista tabular&quot;"}, {"tag": "F-15", "path": "docs/produto/modulos.md", "rel": "docs/produto/modulos.md", "lines": "", "desc": "M1: o job, os épicos E1.1–E1.4, dependências de E8.1/E7.1", "seal": "🟢", "internal": true, "t": "docs/produto/modulos.md — M1: o job, os épicos E1.1–E1.4, dependências de E8.1/E7.1"}, {"tag": "F-16", "path": "/home/user/tocbuilderv3/components/Toolbar.tsx", "rel": "/home/user/tocbuilderv3/components/Toolbar.tsx", "lines": "84", "desc": "\"Exportar a ARA atual para um arquivo JSON\" — a exportação existia na linhagem; o determinismo e o esquema versionado não", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/Toolbar.tsx:84 — &quot;Exportar a ARA atual para um arquivo JSON&quot; — a exportação existia na linhagem; o determinismo e o esquema versionado não"}, {"tag": "F-17", "path": "/home/user/tocbuilderv3", "rel": "/home/user/tocbuilderv3", "lines": "", "desc": "`grep -rni \"undo\\|desfazer\"` sobre `.ts/.tsx`, excluído `node_modules` → `0` ocorrências: desfazer nunca existiu na linhagem", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3 — grep -rni &quot;undo\\|desfazer&quot; sobre .ts/.tsx, excluído node_modules → 0 ocorrências: desfazer nunca existiu na linhagem"}], "chain": [{"label": "spec.md", "href": "specs/004-nucleo-de-diagramas/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/004-nucleo-de-diagramas/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/004-nucleo-de-diagramas/tasks.md", "state": "ok"}, {"label": "data-model.md", "href": "specs/004-nucleo-de-diagramas/data-model.md", "state": "ok"}, {"label": "contracts/rest-api.md", "href": "specs/004-nucleo-de-diagramas/contracts/rest-api.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/004-nucleo-de-diagramas/qa-report.md", "state": "pending"}, {"label": "código do ciclo 004", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "A junta do ciclo 003 (introspecção, banco, OTel) ainda não existe — assunção: o M1 programa contra as portas definidas no 003 e não abre antes de a aptidão &quot;a junta fecha contra a ghdaru real&quot; passar — risco alto (é a dependência inteira do ciclo).", "risco": "alto", "cmds": [], "paths": [], "s": ""}, {"id": "L-02", "d": "O apetite de um ciclo para 4 épicos com TDD é estimativa sem histórico próprio — assunção: o corte declarado no round 004 (sai o desfazer primeiro, nunca a vista tabular) absorve o estouro — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-03", "d": "O identificador estável de tela (INT-02) antecipa um contrato que o ciclo 006 ainda vai fixar — assunção: um <code>data-tela-id</code> por tela custa quase nada e evita renomear; se o 006 decidir outro formato, a migração é mecânica — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-04", "d": "A meta de desempenho (200 nós, RNF-05/06) vem do tamanho típico de ARA na literatura, não de medição própria — assunção: suficiente para v1; medição real na jornada viva — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}]}, {"id": "005", "name": "Árvore da Realidade Atual (M2 — Árvore da Realidade Atual)", "specNum": "005", "specPath": "specs/005-arvore-da-realidade-atual/spec.md", "modules": ["M2"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE permitir criar projeto do tipo ARA, herdando do M1 canvas, vista tabular, desfazer de sessão, exclusão suave e exportação sem reimplementação", "s": "F-10", "seal": "🟡", "group": "UDE como nó tipado da ARA"}, {"id": "RF-02", "d": "O SISTEMA DEVE permitir marcar e desmarcar qualquer nó de projeto ARA como UDE, registrando <code>UdeMarcado</code>/<code>UdeDesmarcado</code>", "s": "F-16", "seal": "🟡", "group": "UDE como nó tipado da ARA"}, {"id": "RF-03", "d": "O SISTEMA DEVE manter, por nó marcado UDE, a FichaDeUde com área impactada, objetivo afetado, evidências observáveis, frequência e impactos estimados — todos opcionais exceto a descrição do próprio nó", "s": "F-04", "seal": "🟡", "group": "UDE como nó tipado da ARA"}, {"id": "RF-04", "d": "O SISTEMA DEVE exibir a contagem de UDEs por status de validação no resumo do projeto, com filtro por status na vista tabular", "s": "", "seal": "🟡", "group": "UDE como nó tipado da ARA"}, {"id": "RF-05", "d": "QUANDO um nó marcado UDE for excluído, O SISTEMA DEVE arquivar a ficha e os pareceres junto ao evento de exclusão — a restauração (M1) devolve tudo", "s": "", "seal": "🟡", "group": "UDE como nó tipado da ARA"}, {"id": "RF-06", "d": "O SISTEMA DEVE avaliar a formulação de um texto de UDE por função pura de domínio, executável sem rede e sem modelo, devolvendo veredito por critério decidível com o trecho que o motivou", "s": "F-01, F-02, F-11", "seal": "🟡", "group": "Validação formal decidível"}, {"id": "RF-07", "d": "O SISTEMA DEVE avaliar como critérios decidíveis, no mínimo: frase completa no tempo presente (RN-01), estado e não ação (RN-02), sem causa embutida por marcador lexical (RN-03), sem solução embutida por marcador lexical (RN-04), neutralidade — sem culpar pessoa ou grupo (RN-05), entidade única (RN-06)", "s": "F-02", "seal": "🟡", "group": "Validação formal decidível"}, {"id": "RF-08", "d": "O SISTEMA DEVE devolver <code>indeterminado</code> — nunca um chute — quando a heurística de um critério decidível não alcançar o caso, e o critério indeterminado DEVE contar como pendência de julgamento, não como reprovação", "s": "", "seal": "🟡", "group": "Validação formal decidível"}, {"id": "RF-09", "d": "O SISTEMA DEVE declarar, em dado versionado do domínio (não em prompt), a classificação de cada um dos 11 critérios da linhagem em decidível × julgamento, e a ficha DEVE exibir essa classe por critério", "s": "F-02, F-11", "seal": "🟡", "group": "Validação formal decidível"}, {"id": "RF-10", "d": "O SISTEMA DEVE reexecutar a validação formal automaticamente quando o texto do nó mudar, invalidando o veredito anterior (o evento guarda os dois)", "s": "", "seal": "🟡", "group": "Validação formal decidível"}, {"id": "RF-11", "d": "O SISTEMA DEVE manter o léxico das heurísticas (marcadores de causa, de solução, de culpa, verbos de ação) como dado versionado por idioma, testável em isolamento — nunca literal espalhado no código", "s": "", "seal": "🟡", "group": "Validação formal decidível"}, {"id": "RF-12", "d": "O SISTEMA DEVE garantir por teste de domínio que os casos canônicos da linhagem decidem como o método manda: &quot;Falta de treinamento causa erros&quot; reprova (causa embutida); &quot;Precisamos de um novo software&quot; reprova (solução embutida); &quot;A taxa de erros no processo X é de 15%&quot; aprova nos critérios decidíveis", "s": "F-02", "seal": "🟡", "group": "Validação formal decidível"}, {"id": "RF-13", "d": "O SISTEMA DEVE registrar parecer de julgamento sobre os critérios não decidíveis, com autor (papel humano, ou ação de catálogo com identificador de proposta), justificativa e data — pareceres se acumulam, nunca se sobrescrevem", "s": "F-04", "seal": "🟡", "group": "Ficha, status e parecer de julgamento"}, {"id": "RF-14", "d": "O SISTEMA DEVE manter o status de validação do UDE na FSM <code>Pendente → Requer Refinamento → Validado | Rejeitado</code>, recusando transição para <code>Validado</code> enquanto qualquer critério decidível estiver reprovado ou sem parecer humano confirmado (RN-10)", "s": "F-04", "seal": "🟡", "group": "Ficha, status e parecer de julgamento"}, {"id": "RF-15", "d": "QUANDO a validação formal reprovar um critério, O SISTEMA DEVE apresentar a explicação e o trecho apontado, e DEVE permitir editar o texto e reavaliar no mesmo fluxo, sem perder a ficha", "s": "F-06", "seal": "🟡", "group": "Ficha, status e parecer de julgamento"}, {"id": "RF-16", "d": "O SISTEMA DEVE registrar quem validou e quando em evento de domínio — nunca em campo editável da ficha (o contraste com a linhagem, onde <code>validado_por</code> era texto devolvido pelo modelo — F-04)", "s": "F-04", "seal": "🟡", "group": "Ficha, status e parecer de julgamento"}, {"id": "RF-17", "d": "O SISTEMA DEVE permitir reabrir um UDE <code>Validado</code> para <code>Requer Refinamento</code> por ação explícita com justificativa, registrando <code>StatusDeValidacaoMudou</code> com o motivo", "s": "", "seal": "🟡", "group": "Ficha, status e parecer de julgamento"}, {"id": "RF-18", "d": "O SISTEMA DEVE permitir adicionar um nó causa já ligado a um efeito existente num único gesto (&quot;adicionar causa a este nó&quot;), no canvas e na tabela", "s": "F-15", "seal": "🟡", "group": "Causas e relações de suficiência"}, {"id": "RF-19", "d": "O SISTEMA DEVE apresentar a leitura de suficiência de cada aresta — &quot;Se &lt;origem&gt;, então &lt;destino&gt;&quot; — na ficha do elo, montada dos textos atuais dos nós", "s": "F-10", "seal": "🟡", "group": "Causas e relações de suficiência"}, {"id": "RF-20", "d": "O SISTEMA DEVE herdar do M1 as invariantes de aresta (sem auto-laço, sem duplicata, nós do mesmo projeto) sem exceção nova para a ARA", "s": "", "seal": "🟡", "group": "Causas e relações de suficiência"}, {"id": "RF-21", "d": "O SISTEMA DEVE permitir que um mesmo nó seja causa de vários efeitos e efeito de várias causas — a ARA é grafo dirigido, não árvore estrita, e o nome não cria invariante falsa", "s": "", "seal": "🟡", "group": "Causas e relações de suficiência"}, {"id": "RF-22", "d": "O SISTEMA DEVE permitir marcar cada aresta com o exame <code>suficiente</code> | <code>insuficiente</code> | <code>com_reserva</code>, com texto de reserva obrigatório nos dois últimos, registrando <code>EloExaminado</code>", "s": "", "seal": "🟡", "group": "Exame de suficiência dos elos"}, {"id": "RF-23", "d": "O SISTEMA DEVE permitir agrupar duas ou mais arestas com o mesmo destino num conector E (conjunção), desenhado como elipse sobre os elos, e desfazê-lo — validando que toda aresta do conector aponta para o mesmo destino (RN-11)", "s": "", "seal": "🟡", "group": "Exame de suficiência dos elos"}, {"id": "RF-24", "d": "O SISTEMA DEVE apresentar a leitura conjunta do conector E — &quot;Se A e B, então C&quot; — na ficha do destino", "s": "", "seal": "🟡", "group": "Exame de suficiência dos elos"}, {"id": "RF-25", "d": "O SISTEMA DEVE distinguir visualmente, no canvas e na tabela, elo não examinado, suficiente, insuficiente e com reserva — o estado do exame é dado de primeira classe, não anotação solta", "s": "", "seal": "🟡", "group": "Exame de suficiência dos elos"}, {"id": "RF-26", "d": "O SISTEMA DEVE computar por função pura de domínio, sem rede e sem modelo, o relatório estrutural: fragmentos (componentes desconexos), nós de entrada (sem antecessor), alcance transitivo de cada entrada sobre os UDEs, elos não examinados e ciclos", "s": "F-05, F-09", "seal": "🟡", "group": "Análise estrutural da árvore"}, {"id": "RF-27", "d": "O SISTEMA DEVE apontar a causa raiz candidata — a entrada que alcança a maior fração dos UDEs marcados — como sugestão nomeada, nunca como conclusão automática (RN-12)", "s": "", "seal": "🟡", "group": "Análise estrutural da árvore"}, {"id": "RF-28", "d": "O SISTEMA DEVE listar no relatório os UDEs não alcançados por nenhuma entrada examinada — a medida de quanto da dor percebida a árvore ainda não explica", "s": "", "seal": "🟡", "group": "Análise estrutural da árvore"}, {"id": "RF-29", "d": "QUANDO houver ciclo, O SISTEMA DEVE listá-lo com seus nós — laços de reforço são legítimos na TOC — e DEVE excluí-los do cálculo de causa raiz candidata, dizendo isso no próprio relatório", "s": "", "seal": "🟡", "group": "Análise estrutural da árvore"}, {"id": "RF-30", "d": "O SISTEMA DEVE oferecer, em cada item do relatório, ação de foco que centraliza o elemento no canvas (mesmo mecanismo do M1)", "s": "", "seal": "🟡", "group": "Análise estrutural da árvore"}, {"id": "RF-31", "d": "O SISTEMA DEVE registrar <code>AnaliseEstruturalGerada</code> com o resumo quantitativo (contagens por seção), para que a jornada e o traço mostrem a evolução da árvore", "s": "", "seal": "🟡", "group": "Análise estrutural da árvore"}, {"id": "RF-32", "d": "O SISTEMA DEVE expor as ações <code>toc.suggest_udes</code>, <code>toc.suggest_causes</code> e <code>toc.suggest_relations</code> no catálogo governado, cada sugestão mutadora nascendo <code>action_proposal</code> individual — aceitar cria o nó/aresta com traço correlacionado à proposta; recusar não toca o projeto", "s": "F-03, F-12", "seal": "🟡", "group": "Assistência via catálogo (contrato — execução no ciclo 006)"}, {"id": "RF-33", "d": "O SISTEMA DEVE expor <code>toc.validate_ude</code> como ação de leitura que devolve parecer apenas sobre os critérios de julgamento; o veredito dos critérios decidíveis é sempre o da função de domínio, anexado pela aplicação — nunca recalculado pelo modelo", "s": "F-03, F-04", "seal": "🟡", "group": "Assistência via catálogo (contrato — execução no ciclo 006)"}, {"id": "RF-34", "d": "QUANDO <code>toc.validate_ude</code> sugerir reformulação do texto, O SISTEMA DEVE apresentá-la como <code>action_proposal</code> de edição do nó — aplicar reexecuta a validação formal (RF-10) sobre o texto novo", "s": "F-10", "seal": "🟡", "group": "Assistência via catálogo (contrato — execução no ciclo 006)"}, {"id": "RF-35", "d": "O SISTEMA DEVE expor <code>toc.analyze_tree</code> como ação de leitura que recebe o grafo e o relatório estrutural (RF-26) como contexto e devolve análise interpretativa; conexão sugerida no corpo da análise vira <code>action_proposal</code> de aresta, uma a uma", "s": "F-26, F-03, F-05", "seal": "🟡", "group": "Assistência via catálogo (contrato — execução no ciclo 006)"}, {"id": "RF-36", "d": "O SISTEMA DEVE recusar, em falha fechada, qualquer caminho em que texto produzido por modelo mute o projeto sem passar pela FSM de proposta — inclusive o &quot;aceitar tudo&quot;, que é lote de propostas, não atalho", "s": "F-13", "seal": "🟡", "group": "Assistência via catálogo (contrato — execução no ciclo 006)"}, {"id": "RF-37", "d": "QUANDO a capability de escrita não estiver presente na introspecção, O SISTEMA DEVE omitir do catálogo as ações mutadoras (<code>toc.suggest_*</code>), mantendo as de leitura — a lição paga pela irmã, já fixada como portão do ciclo 006", "s": "", "seal": "🟡", "group": "Assistência via catálogo (contrato — execução no ciclo 006)"}, {"id": "RF-38", "d": "O SISTEMA DEVE funcionar por inteiro nos épicos E2.1 e E2.2 com o catálogo ausente ou desligado — a assistência é aceleradora, nunca dependência (é o que permite ao round 005 entregar a ARA antes do 006)", "s": "", "seal": "🟡", "group": "Assistência via catálogo (contrato — execução no ciclo 006)"}], "ris": [{"id": "RI-01", "d": "O nó marcado UDE exibe selo distinto no canvas e na tabela, com o status de validação por cor e por texto (nunca só cor)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "A ficha de validação apresenta os critérios em duas seções nomeadas — decidíveis (com veredito e trecho apontado) e julgamento (com pareceres e autores) — substituindo o modal monolítico da linhagem (F-06)", "s": "F-06", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "A reprovação de critério decidível aponta o trecho no próprio texto do UDE (marcação inline), com a explicação ao lado — não em janela separada", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "O fluxo reprovar → editar → reavaliar acontece na mesma superfície, sem fechar a ficha; a reavaliação responde em menos de 1 segundo (RNF-05)", "s": "F-05", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "O exame de elo é acionável na própria aresta (canvas) e na linha (tabela); os quatro estados do exame têm representação visual distinta e acessível", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "O conector E é desenhado como elipse sobre as arestas agrupadas — a notação canônica da TOC — e a ficha do destino mostra a leitura conjunta", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "O relatório estrutural é um painel lateral com seções recolhíveis (fragmentos, entradas, cobertura, elos não examinados, ciclos), cada item com ação de foco", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "As propostas de assistência (E2.3) aparecem numa bandeja de propostas pendentes com aceitar/recusar por item — nunca aplicação silenciosa; a bandeja diz de qual ação e de qual proposta cada item veio", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-09", "d": "O resumo de UDEs por status aparece no cabeçalho do projeto ARA, com filtro de um clique na vista tabular", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-10", "d": "Toda superfície do módulo respeita tema do hospedeiro com fallback, modo só-conteúdo e operação por teclado, herdados dos ciclos 002/003; textos por i18n pt/en (E8.3), inclusive as explicações de critério", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "A validação formal e a análise estrutural são funções puras testáveis sem rede, sem banco e sem modelo — a suíte de domínio deste módulo roda offline por construção (P3, P4; aptidão do round 005)", "s": "F-11", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "A fronteira hexagonal é verificada por <code>import-linter</code>: o pacote de domínio do M2 não importa framework, HTTP, banco nem cliente de IA — o build falha na violação", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Toda mutação do módulo emite traço OTel correlacionado e log estruturado; pareceres e propostas aceitas carregam no traço o identificador da proposta de origem (P5)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "A validação formal de um texto de até 500 caracteres responde em menos de 100 milissegundos no servidor e é utilizável offline no cliente (mesma regra portada ou chamada local — decisão de arquitetura no plan)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "O ciclo editar → reavaliar na ficha responde em menos de 1 segundo no percentil 95, medido na jornada viva", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "A análise estrutural de um projeto com 200 nós e 300 arestas computa em menos de 2 segundos no percentil 95 (o teto herdado do M1, RNF-05 de lá)", "s": "F-05", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "O léxico heurístico por idioma (RF-11) tem cobertura de teste própria com corpus sintético versionado de UDEs bons e maus — ampliar o léxico exige ampliar o corpus", "s": "F-11", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "Nenhum prompt, chave ou cliente de provedor no repositório do produto — grep de CI herdado do M1 estendido aos padrões de prompt (<code>system_prompt</code>, <code>promptText</code>) (P7, ADR 0007; o contraexemplo é F-07/F-08)", "s": "F-07, F-08", "seal": "🟡", "group": ""}, {"id": "RNF-09", "d": "Os textos de critério, explicação e relatório saem do mecanismo de i18n com chave estável — a chave do critério é a mesma da regra de domínio (RN-NN), para a rastreabilidade spec ↔ código ↔ tela", "s": "", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "UDE é frase completa no tempo presente. [F-02, característica 2] 🟢 (critério na linhagem: <code>constants.ts:124</code>; heurística decidível: sujeito + verbo finito no presente, sem forma imperativa/infinitiva inicial — 🟡)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-02", "d": "UDE descreve um estado do sistema, não uma ação nem a falta de uma. [F-02, característica 3] 🟢 (<code>constants.ts:125</code>; heurística: substantivações de ausência — &quot;falta de&quot;, &quot;ausência de&quot; — e verbos de ação sem sujeito-sistema reprovam — 🟡)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-03", "d": "UDE é efeito: não é causa especulada nem embute a própria causa na verbalização. [F-02, características 7 e 10] 🟢 (<code>constants.ts:129,132</code>; decidível por marcador lexical — &quot;porque&quot;, &quot;devido a&quot;, &quot;causa&quot;, &quot;por falta de&quot; — e julgamento no resto — 🟡)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-04", "d": "UDE não é solução oculta. [F-02, característica 8] 🟢 (<code>constants.ts:130</code>; marcadores: &quot;precisamos&quot;, &quot;deveria&quot;, &quot;falta implantar&quot; — 🟡)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-05", "d": "UDE não culpa pessoa nem grupo (neutralidade). [F-02, característica 6] 🟢 (<code>constants.ts:128</code>; marcadores: nome de papel/pessoa como sujeito de verbo de falha — 🟡)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-06", "d": "UDE contém uma única entidade (ideia/fato). [F-02, característica 9] 🟢 (<code>constants.ts:131</code>; heurística: coordenação de orações independentes reprova — 🟡)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-07", "d": "UDE é factual e não subjetivo — julgamento, com parecer. [F-02, característica 11] 🟢 (<code>constants.ts:133</code>)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-08", "d": "UDE está na esfera de influência e algo pode ser feito a respeito — julgamento, com parecer. [F-02, características 4 e 5] 🟢 (<code>constants.ts:126-127</code>)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-09", "d": "UDE de &quot;existência de lacuna&quot; é preferível a UDE de &quot;dificuldade em fechar a lacuna&quot; — julgamento; a ficha registra a distinção. 🟢 (<code>constants.ts:135-137</code>)", "s": "F-02", "seal": "", "group": ""}, {"id": "RN-10", "d": "<code>Validado</code> exige todos os critérios decidíveis em <code>atende</code> e parecer humano confirmado cobrindo os critérios de julgamento e os <code>indeterminado</code>; parecer de IA nunca fecha status sozinho", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-11", "d": "Aresta da ARA é relação de suficiência (&quot;se causa, então efeito&quot;); causas que só em conjunto produzem o efeito agrupam-se em conector E, e toda aresta de um conector aponta para o mesmo destino. 🟢 (a leitura causal está na linhagem: <code>APLICATION_PURPOSE.md:24</code>; o conector E é do método TOC, sem precedente na linhagem — 🟡, ver F-09)", "s": "F-10, F-09", "seal": "", "group": ""}, {"id": "RN-12", "d": "Causa raiz candidata é a entrada (nó sem antecessor, fora de ciclo) com maior alcance transitivo sobre os UDEs marcados; o sistema aponta, o humano conclui — a conclusão é parecer, não campo calculado", "s": "", "seal": "🟡", "group": ""}], "ints": [{"id": "INT-01", "d": "O M2 consome do M1 (ciclo 004) o agregado Projeto, nó, aresta, canvas, tabela, desfazer e exportação; consome da junta 003 identidade (<code>POST /auth/introspect</code>), isolamento por inquilino e OTel. Nenhuma dessas peças é reimplementada aqui", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-02", "d": "<code>toc.suggest_udes</code> — catálogo <code>toc.*</code>, mutadora (risco: cria nós), entrada: descrição do problema + UDEs existentes; saída: propostas de nó UDE, uma <code>action_proposal</code> por sugestão. Execução: ciclo 006 (FSM)", "s": "F-03", "seal": "🟡", "group": ""}, {"id": "INT-03", "d": "<code>toc.suggest_causes</code> — mutadora (cria nó + aresta), entrada: nó alvo + contexto do grafo; saída: propostas de causa ligada", "s": "F-03, F-15", "seal": "🟡", "group": ""}, {"id": "INT-04", "d": "<code>toc.suggest_relations</code> — mutadora (cria arestas), entrada: nós e arestas existentes; saída: propostas de aresta com justificativa", "s": "F-03", "seal": "🟡", "group": ""}, {"id": "INT-05", "d": "<code>toc.validate_ude</code> — leitura com parecer (não muta); a reformulação sugerida chega como <code>action_proposal</code> de edição (RF-34)", "s": "F-34, F-03, F-04", "seal": "🟡", "group": ""}, {"id": "INT-06", "d": "<code>toc.analyze_tree</code> — leitura; recebe grafo + relatório estrutural; conexões sugeridas viram propostas de aresta individuais (RF-35)", "s": "F-35, F-03, F-05", "seal": "🟡", "group": ""}, {"id": "INT-07", "d": "Telas deste módulo entram no registro de telas do E7.5 com identificador estável (<code>toc.ara_canvas</code>, <code>toc.ude_ficha</code>, <code>toc.ara_relatorio</code>, <code>toc.propostas</code>), no formato herdado do M1 (INT-02 de lá); campos da ficha marcam <code>ai_visible</code> campo a campo para o snapshot sanitizado do ciclo 006", "s": "", "seal": "🟡", "group": ""}, {"id": "INT-08", "d": "Os prompts que as ações do catálogo usarem são versionados no servidor e nunca circulam no cliente nem no snapshot (ADR 0007); a tela de administração de prompts da linhagem (F-07) não é portada", "s": "F-07", "seal": "🟡", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md", "rel": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md", "lines": "52-60", "desc": "§3.2 \"Validação e Análise Crítica\": estrutura (frase completa, presente), conteúdo (estado, não ação), foco (efeito, não causa/solução), neutralidade (não culpar), relatório completo e análise da árvore — o mapa dos critérios que esta spec transforma em regra", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md:52-60 — §3.2 &quot;Validação e Análise Crítica&quot;: estrutura (frase completa, presente), conteúdo (estado, não ação), foco (efeito, não causa/solução), neutralidade (não culpar), relatório completo e análise da árvore — o mapa dos critérios que esta spec transforma em regra"}, {"tag": "F-02", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "109-240", "desc": "`VALIDATE_UDE_DETAILED_PROMPT_TEXT`: as 11 características do UDE bem articulado em `constants.ts:123-133` (contadas: `sed -n '123,133p' constants.ts | grep -c '^[0-9]'` → `11`), os tipos lacuna × dificuldade (l.135-137) e os exemplos canônicos (l.162-163) — a regra de negócio inteira dentro de um prompt: o defeito D-08 na fonte", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts:109-240 — VALIDATE_UDE_DETAILED_PROMPT_TEXT: as 11 características do UDE bem articulado em constants.ts:123-133 (contadas: sed -n &#x27;123,133p&#x27; constants.ts | grep -c &#x27;^[0-9]&#x27; → 11), os tipos lacuna × dificuldade (l.135-137) e os exemplos canônicos (l.162-163) — a regra de negócio inteira dentro de um prompt: o defeito D-08 na fonte"}, {"tag": "F-03", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "137", "desc": "o tipo-união das operações de assistência: `'validate_ei' | 'suggest_eis' | 'suggest_relations' | 'analyze_tree' | 'validate_ude_structured' | 'suggest_causes_for_ei' | 'generate_conflict_cloud'` — 7 operações (`sed -n 137p types.ts | grep -o \"'[a-z_]*'\" | wc -l` → `7`), 6 da ARA (a 7ª é da NC, M3); viram as 5 ações INT-02..INT-06 (validação simples e detalhada fundem-se em `toc.validate_ude`)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:137 — o tipo-união das operações de assistência: &#x27;validate_ei&#x27; | &#x27;suggest_eis&#x27; | &#x27;suggest_relations&#x27; | &#x27;analyze_tree&#x27; | &#x27;validate_ude_structured&#x27; | &#x27;suggest_causes_for_ei&#x27; | &#x27;generate_conflict_cloud&#x27; — 7 operações (sed -n 137p types.ts | grep -o &quot;&#x27;[a-z_]&#x27;&quot; | wc -l → 7), 6 da ARA (a 7ª é da NC, M3); viram as 5 ações INT-02..INT-06 (validação simples e detalhada fundem-se em toc.validate_ude)"}, {"tag": "F-04", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "171-213", "desc": "`GeminiUdeValidationResponse`: 13 sub-critérios booleanos (`sed -n '178,201p' types.ts | grep -c boolean` → `13`), status final em `types.ts:207` (`'Pendente' | 'Validado' | 'Rejeitado' | 'Requer Refinamento'`), ficha (área impactada, evidências, frequência, impactos) e `validado_por` como texto do modelo — a estrutura que vira FichaDeUde + ValidacaoFormal + ParecerDeJulgamento + FSM", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:171-213 — GeminiUdeValidationResponse: 13 sub-critérios booleanos (sed -n &#x27;178,201p&#x27; types.ts | grep -c boolean → 13), status final em types.ts:207 (&#x27;Pendente&#x27; | &#x27;Validado&#x27; | &#x27;Rejeitado&#x27; | &#x27;Requer Refinamento&#x27;), ficha (área impactada, evidências, frequência, impactos) e validado_por como texto do modelo — a estrutura que vira FichaDeUde + ValidacaoFormal + ParecerDeJulgamento + FSM"}, {"tag": "F-05", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "83-107", "desc": "`ANALYZE_TREE_PROMPT_TEXT`: pedia à IA fragmentação, redundância, clareza e completude (l.93-96) e sugestões de conexão em formato `CONNECT|fromId=...` parseado do texto (l.100-106) — o estrutural vira o RF-26 (função pura); o que é interpretativo vira `toc.analyze_tree` (INT-06)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts:83-107 — ANALYZE_TREE_PROMPT_TEXT: pedia à IA fragmentação, redundância, clareza e completude (l.93-96) e sugestões de conexão em formato CONNECT|fromId=... parseado do texto (l.100-106) — o estrutural vira o RF-26 (função pura); o que é interpretativo vira toc.analyze_tree (INT-06)"}, {"tag": "F-06", "path": "/home/user/tocbuilderv3/components/UdeValidationModal.tsx", "rel": "/home/user/tocbuilderv3/components/UdeValidationModal.tsx", "lines": "", "desc": "o relatório de validação da linhagem, 206 linhas (`wc -l` → `206 components/UdeValidationModal.tsx`) — a UI existia e provou valor; refeita como ficha com duas seções (RI-02)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/components/UdeValidationModal.tsx — o relatório de validação da linhagem, 206 linhas (wc -l → 206 components/UdeValidationModal.tsx) — a UI existia e provou valor; refeita como ficha com duas seções (RI-02)"}, {"tag": "F-07", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "341-405", "desc": "`INITIAL_SYSTEM_PROMPTS`: 8 prompts como dado do cliente (`grep -c \"promptText:\" constants.ts` → `8`), editáveis pela tela `PROMPT_ADMIN` — regra de negócio editável em produção, sem teste; o contraexemplo que motiva RF-09 e INT-08", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts:341-405 — INITIAL_SYSTEM_PROMPTS: 8 prompts como dado do cliente (grep -c &quot;promptText:&quot; constants.ts → 8), editáveis pela tela PROMPT_ADMIN — regra de negócio editável em produção, sem teste; o contraexemplo que motiva RF-09 e INT-08"}, {"tag": "F-08", "path": "/home/user/tocbuilderv3/services/geminiService.ts", "rel": "/home/user/tocbuilderv3/services/geminiService.ts", "lines": "16", "desc": "`const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });` no código do navegador — a violação canônica do P7 que o ADR 0007 mata", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/services/geminiService.ts:16 — const ai = new GoogleGenAI({ apiKey: process.env.API_KEY }); no código do navegador — a violação canônica do P7 que o ADR 0007 mata"}, {"tag": "F-09", "path": "/home/user/tocbuilderv3", "rel": "/home/user/tocbuilderv3", "lines": "", "desc": "`grep -rni \"sufici\" --include=\"*.ts\" --include=\"*.tsx\" --include=\"*.md\" . | grep -v node_modules | wc -l` → `4`, e **nenhuma** das 4 é análise de suficiência da ARA (uma é o campo de suficiência dos filhos da S&T, duas são usos casuais de \"suficiente\", uma é o critério \"específico o suficiente\" do prompt simples) — o exame de elos e o relatório estrutural (E2.2) não têm precedente na linhagem: são", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3 — grep -rni &quot;sufici&quot; --include=&quot;.ts&quot; --include=&quot;.tsx&quot; --include=&quot;.md&quot; . | grep -v node_modules | wc -l → 4, e nenhuma das 4 é análise de suficiência da ARA (uma é o campo de suficiência dos filhos da S&amp;T, duas são usos casuais de &quot;suficiente&quot;, uma é o critério &quot;específico o suficiente&quot; do prompt simples) — o exame de elos e o relatório estrutural (E2.2) não têm precedente na linhagem: são"}, {"tag": "F-10", "path": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md", "rel": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md", "lines": "20-25", "desc": "§2.1: a ARA como coração da aplicação; a leitura causal \"Se A... então B...\" (l.24); canvas + painel de entidades", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/APLICATION_PURPOSE.md:20-25 — §2.1: a ARA como coração da aplicação; a leitura causal &quot;Se A... então B...&quot; (l.24); canvas + painel de entidades"}, {"tag": "F-11", "path": "docs/produto/rounds.md", "rel": "docs/produto/rounds.md", "lines": "", "desc": "Round 005: aptidão executável (\"critérios decidíveis avaliados por teste de domínio sem rede e sem modelo\"), E2.3 fora (decisão 4, para o round 006), corte de apetite, defeito D-08", "seal": "🟢", "internal": true, "t": "docs/produto/rounds.md — Round 005: aptidão executável (&quot;critérios decidíveis avaliados por teste de domínio sem rede e sem modelo&quot;), E2.3 fora (decisão 4, para o round 006), corte de apetite, defeito D-08"}, {"tag": "F-12", "path": "docs/adr/0007-ia-somente-pela-fundacao.md", "rel": "docs/adr/0007-ia-somente-pela-fundacao.md", "lines": "", "desc": "toda assistência via catálogo de ações governadas; prompts versionados no servidor", "seal": "🟢", "internal": true, "t": "docs/adr/0007-ia-somente-pela-fundacao.md — toda assistência via catálogo de ações governadas; prompts versionados no servidor"}, {"tag": "F-13", "path": "", "rel": "", "lines": "", "desc": "`docs/governance/constitution.md` linhas 64-71 (alcance do P2) e 87-94 (item 8: manipulação direta, intenção inferida nasce proposta, FSM uma só e do servidor)", "seal": "🟢", "internal": false, "t": " — docs/governance/constitution.md linhas 64-71 (alcance do P2) e 87-94 (item 8: manipulação direta, intenção inferida nasce proposta, FSM uma só e do servidor)"}, {"tag": "F-14", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "19-36", "desc": "`VALIDATE_EI_PROMPT_TEXT`: a validação \"simples\" usava **outros** critérios (clareza, especificidade, foco, realidade atual) — duas validações inconsistentes conviviam na mesma geração; o argumento para uma regra única de domínio (RF-06) e uma única ação (`toc.validate_ude`, INT-05)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts:19-36 — VALIDATE_EI_PROMPT_TEXT: a validação &quot;simples&quot; usava outros critérios (clareza, especificidade, foco, realidade atual) — duas validações inconsistentes conviviam na mesma geração; o argumento para uma regra única de domínio (RF-06) e uma única ação (toc.validate_ude, INT-05)"}, {"tag": "F-15", "path": "/home/user/tocbuilderv3/constants.ts", "rel": "/home/user/tocbuilderv3/constants.ts", "lines": "242-262", "desc": "`SUGGEST_CAUSES_FOR_EI_PROMPT_TEXT`: \"uma 'causa' também é um Efeito Indesejável (EI) que simplesmente está em uma posição anterior na cadeia causal\" (l.247) — causa é posição, não tipo (modelo de domínio)", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/constants.ts:242-262 — SUGGEST_CAUSES_FOR_EI_PROMPT_TEXT: &quot;uma &#x27;causa&#x27; também é um Efeito Indesejável (EI) que simplesmente está em uma posição anterior na cadeia causal&quot; (l.247) — causa é posição, não tipo (modelo de domínio)"}, {"tag": "F-16", "path": "/home/user/tocbuilderv3/types.ts", "rel": "/home/user/tocbuilderv3/types.ts", "lines": "34-36", "desc": "`enum NodeType { EI = 'EI' }`: a linhagem só tinha um tipo de nó; o marcador UDE desta spec formaliza a distinção que lá era implícita", "seal": "🟢", "internal": false, "t": "/home/user/tocbuilderv3/types.ts:34-36 — enum NodeType { EI = &#x27;EI&#x27; }: a linhagem só tinha um tipo de nó; o marcador UDE desta spec formaliza a distinção que lá era implícita"}], "chain": [{"label": "spec.md", "href": "specs/005-arvore-da-realidade-atual/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/005-arvore-da-realidade-atual/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/005-arvore-da-realidade-atual/tasks.md", "state": "ok"}, {"label": "qa-report.md", "href": "specs/005-arvore-da-realidade-atual/qa-report.md", "state": "pending"}, {"label": "código do ciclo 005", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "As heurísticas lexicais dos critérios decidíveis (RN-01..RN-06) não têm precedente medido — a linhagem decidia tudo por modelo. Assunção: heurística conservadora com <code>indeterminado</code> honesto (RF-08) + corpus sintético versionado (RNF-07) bastam para o v1; falso <code>indeterminado</code> degrada para julgamento, nunca para veredito errado — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-02", "d": "O exame de suficiência e o relatório estrutural não existem na linhagem (F-09) — são método TOC sem contraparte medida; as CLR completas (reserva de causalidade, de entidade, de tautologia…) ficam fora do v1. Assunção: o subconjunto elo examinado + conector E + relatório estrutural cobre a prática; ampliar para as CLR completas é decisão nova por ADR — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": "F-09"}, {"id": "L-03", "d": "O contrato das ações <code>toc.*</code> (INT-02..INT-06) antecipa o catálogo que o ciclo 006 fixa. Assunção: declarar sem executar (DoD 10) custa pouco e dá ao 006 um primeiro cliente concreto; se o formato do catálogo divergir, a migração é da declaração, não do domínio — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}, {"id": "L-04", "d": "O apetite de um ciclo para E2.1 + E2.2 com TDD e léxico bilíngue é estimativa sem histórico próprio. Assunção: o corte do round 005 (sai o relatório estrutural primeiro, nunca a validação formal) absorve o estouro — risco médio.", "risco": "médio", "cmds": [], "paths": [], "s": ""}, {"id": "L-05", "d": "A distinção decidível × julgamento do RF-09 é decisão nossa sobre os 11 critérios — a linhagem não a fazia (mandava tudo ao modelo). Assunção: a partição desta spec (6 decidíveis com heurística, 5 de julgamento) é o ponto de partida; ela é dado versionado (RF-09), então mover um critério de classe é mudança de dado com teste, não de arquitetura — risco baixo.", "risco": "baixo", "cmds": [], "paths": [], "s": ""}]}, {"id": "006", "name": "Ações governadas e snapshot (M7 — Federação APH)", "specNum": "006", "specPath": "specs/006-acoes-governadas-e-snapshot/spec.md", "modules": ["M7"], "rfs": [{"id": "RF-01", "d": "O SISTEMA DEVE publicar manifesto com <code>app_id: toc</code>, <code>mode: embedded</code>, <code>mount: iframe</code>, telas e ações namespaced <code>toc.*</code>, <code>capabilities_required</code> (<code>toc:read</code>, <code>toc:write</code>), <code>endpoints.introspect</code> e <code>theme.fallback: true</code>, validável sem erros contra o schema normativo do Anexo B (<code>specs/006-acoes-governadas-e-snapshot/contracts/manifesto.json</code>)", "s": "F-18", "seal": "🟡", "group": "F7.3.1 — Manifesto embedded"}, {"id": "RF-02", "d": "Toda tela e toda ação do manifesto DEVE usar o prefixo <code>toc</code> igual ao <code>app_id</code> (forma <code>&lt;ns&gt;.&lt;id&gt;</code> do §B.5.2), e toda rota de tela DEVE viver sob <code>/toc/</code>, em forma canônica (caixa baixa, sem barra final) — o prefixo próprio é a defesa contra colisão de rota que o guia recomenda", "s": "F-27", "seal": "🟡", "group": "F7.3.1 — Manifesto embedded"}, {"id": "RF-03", "d": "QUANDO o catálogo ou as telas mudarem, O SISTEMA DEVE tratar o manifesto como mudança de admissão: nova versão, re-submissão e re-aprovação — nunca deriva silenciosa entre o manifesto publicado e o catálogo servido", "s": "", "seal": "🟡", "group": "F7.3.1 — Manifesto embedded"}, {"id": "RF-04", "d": "As ações do manifesto e as do catálogo servido DEVEM vir da mesma fonte (<code>ActionSpec</code> único); um teste de paridade falha se divergirem", "s": "F-02", "seal": "🟡", "group": "F7.3.1 — Manifesto embedded"}, {"id": "RF-05", "d": "O catálogo DEVE ser derivado das capabilities reais do Principal na composição: sem <code>toc:write</code>, nenhuma ação <code>risk: confirm</code> entra no inventário que o modelo vê (APH-4.3; ausência é melhor fronteira que recusa, §B.7.3)", "s": "F-02, F-13", "seal": "🟡", "group": "F7.3.2 — Catálogo derivado de permissão"}, {"id": "RF-06", "d": "Cada ação DEVE declarar <code>action_id</code>, título, <code>input_schema</code> (JSON Schema) e classe de risco (APH-4.2); ação sem qualquer um dos quatro não entra no catálogo", "s": "F-02", "seal": "🟡", "group": "F7.3.2 — Catálogo derivado de permissão"}, {"id": "RF-07", "d": "O <code>input_schema</code> DEVE ser uma fonte com três projeções: valida os <code>args</code> da proposta no servidor, vira a tool que a fundação entrega ao modelo e entra no manifesto (APH-4.4; §A.5)", "s": "F-02, F-11", "seal": "🟡", "group": "F7.3.2 — Catálogo derivado de permissão"}, {"id": "RF-08", "d": "O SISTEMA DEVE servir <code>GET /aph/catalog</code> já filtrado por permissão (§A.2), e o catálogo DEVE ser a única superfície executável: nenhum endpoint de mutação fora dele é alcançável pelo modelo ou pela borda federada (APH-4.1)", "s": "F-02, F-08", "seal": "🟡", "group": "F7.3.2 — Catálogo derivado de permissão"}, {"id": "RF-09", "d": "QUANDO uma proposta citar <code>action_id</code> fora do catálogo composto para aquele Principal, O SISTEMA DEVE recusá-la com traço, sem executar nada", "s": "F-02, F-03", "seal": "🟡", "group": "F7.3.2 — Catálogo derivado de permissão"}, {"id": "RF-10", "d": "Nenhuma ação DEVE executar no momento em que o modelo a menciona: toda ação nasce proposta com <code>proposal_id</code> próprio (APH-5.1)", "s": "F-01", "seal": "🟡", "group": "F7.4.1 — FSM de proposta"}, {"id": "RF-11", "d": "A FSM DEVE ser <code>proposed → awaiting_approval → confirmed → executing → executed | failed | cancelled | denied | expired</code>, validada em código; transição fora da tabela DEVE falhar com <code>INVALID_TRANSITION</code> (HTTP 409). O estado <code>stale</code> da FSM de referência é 🧪 na norma e não é adotado: contexto divergente encerra a proposta em <code>cancelled</code> com código <code>PROPOSAL_CONTEXT_STALE</code>, o mesmo desenho do laboratório A (§A.8)", "s": "F-01, F-09", "seal": "🟡", "group": "F7.4.1 — FSM de proposta"}, {"id": "RF-12", "d": "A confirmação DEVE ser proporcional ao risco, decidida no servidor e antes da conversa: <code>read</code> executa direto; <code>confirm</code> para no gate humano (APH-5.2). O modelo nunca decide a classe", "s": "F-23", "seal": "🟡", "group": "F7.4.1 — FSM de proposta"}, {"id": "RF-13", "d": "Toda proposta <code>awaiting_approval</code> DEVE ter TTL; vencido, a proposta transiciona a <code>expired</code> e a decisão tardia falha com <code>PROPOSAL_EXPIRED</code>", "s": "F-09, F-23", "seal": "🟡", "group": "F7.4.1 — FSM de proposta"}, {"id": "RF-14", "d": "A decisão DEVE entrar por <code>POST /aph/sessions/{id}/proposals/{proposal_id}</code> com corpo <code>{approved}</code> (§A.6); <code>approved: false</code> encerra em <code>denied</code> com traço", "s": "F-08", "seal": "🟡", "group": "F7.4.1 — FSM de proposta"}, {"id": "RF-15", "d": "QUANDO a confirmação trouxer <code>context_hash</code> e ele divergir do snapshot corrente, O SISTEMA DEVE recusar sem executar, encerrando a proposta com código <code>PROPOSAL_CONTEXT_STALE</code> (APH-5.4 — a substância é comparar e recusar)", "s": "F-23, F-09", "seal": "🟡", "group": "F7.4.1 — FSM de proposta"}, {"id": "RF-16", "d": "Confirmar duas vezes a mesma proposta NÃO DEVE re-executar: a primeira decisão produz o efeito, as seguintes recebem o mesmo resultado (deduplicação — APH-5.3 adotado por desenho)", "s": "F-23", "seal": "🟡", "group": "F7.4.1 — FSM de proposta"}, {"id": "RF-17", "d": "Toda mutação DEVE verificar a capability exigida no caso de uso, não na camada de rota (§B.7.2 — a armadilha do <code>Depends(...)</code> está registrada na norma com três equipes caindo nela); a recusa é fail-closed e deixa traço", "s": "F-13", "seal": "🟡", "group": "F7.4.2 — Autorização por capability nos casos de uso"}, {"id": "RF-18", "d": "Capability DEVE ter a forma <code>recurso:verbo</code> sem curinga (<code>toc:read</code>, <code>toc:write</code>); <code>toc:*</code> e afins DEVEM ser rejeitados na composição (§B.7.1)", "s": "F-13", "seal": "🟡", "group": "F7.4.2 — Autorização por capability nos casos de uso"}, {"id": "RF-19", "d": "O SISTEMA NÃO DEVE pressupor a atenuação de autoridade do hospedeiro (APH-9.4b é 🧪 sem laboratório, e a norma mediu o caso em que as capabilities recebidas excedem quem abriu o embarque): as capabilities da introspecção são teto, nunca dispensa — a verificação local do RF-17 acontece sempre, e decisões sensíveis do domínio (ex.: exclusão) PODEM exigir política própria adicional", "s": "F-14, F-17", "seal": "🟡", "group": "F7.4.2 — Autorização por capability nos casos de uso"}, {"id": "RF-20", "d": "Política de autorização que devolve verdadeiro para tudo é não-conformidade declarada (APH-7.2): a suíte DEVE conter a sabotagem que troca a política por <code>lambda: True</code> e vê os testes de recusa falharem", "s": "F-19", "seal": "🟡", "group": "F7.4.2 — Autorização por capability nos casos de uso"}, {"id": "RF-21", "d": "100% das ações — executadas, negadas, expiradas, recusadas por política ou por contexto divergente — DEVEM deixar traço auditável no servidor e visível na conversa (<code>action_result</code> no stream); ação sem traço DEVE ser rejeitada antes do efeito (APH-5.5)", "s": "F-03", "seal": "🟡", "group": "F7.4.3 — Traço de 100%"}, {"id": "RF-22", "d": "O traço DEVE ser escopado por tenant e usuário (APH-7.4) e correlacionado ao traço OTel do ciclo 003 pelo <code>trace_id</code>", "s": "F-19", "seal": "🟡", "group": "F7.4.3 — Traço de 100%"}, {"id": "RF-23", "d": "O <code>action_result</code> DEVE ser honesto: <code>status</code> do vocabulário fechado do §A.3 (<code>executed | failed | denied | cancelled | expired</code>), nunca um estado inventado", "s": "F-10", "seal": "🟡", "group": "F7.4.3 — Traço de 100%"}, {"id": "RF-24", "d": "Ação que atinge N alvos DEVE ser uma proposta com N alvos nos <code>args</code> (no formato do próprio <code>input_schema</code>), nunca N propostas (APH-5.9; decisão de origem: ADR 0009 da irmã)", "s": "F-05, F-04", "seal": "🟡", "group": "F7.4.4 — Proposta em lote"}, {"id": "RF-25", "d": "A confirmação de lote DEVE mostrar a contagem de alvos antes da decisão (APH-5.9(c))", "s": "F-04", "seal": "🟡", "group": "F7.4.4 — Proposta em lote"}, {"id": "RF-26", "d": "O traço e o <code>action_result</code> de lote DEVEM discriminar o desfecho por alvo (<code>outcomes[]: {target, status}</code> com <code>status</code> em <code>executed | failed | denied | skipped</code> — APH-5.9(b), §A.3)", "s": "F-04, F-10", "seal": "🟡", "group": "F7.4.4 — Proposta em lote"}, {"id": "RF-27", "d": "QUANDO houver <code>outcomes</code>, o <code>status</code> terminal NÃO DEVE afirmar mais sucesso do que eles mostram: com qualquer alvo fora de <code>executed</code>, o estado terminal não é <code>executed</code> (APH-5.9(e) — o schema do fio v0.5 rejeita a combinação)", "s": "F-10", "seal": "🟡", "group": "F7.4.4 — Proposta em lote"}, {"id": "RF-28", "d": "Cada ação desenhada para lote DEVE declarar <code>batch_atomicity</code> (<code>all_or_nothing</code> | <code>per_item</code>) no catálogo servido (§A.5); ação sem o campo não foi desenhada para lote e proposta em lote sobre ela DEVE ser recusada — a declaração no manifesto está bloqueada pelo schema normativo (L-02)", "s": "F-11", "seal": "🟡", "group": "F7.4.4 — Proposta em lote"}, {"id": "RF-29", "d": "A classe de risco de um lote DEVE ser ao menos a mais alta entre as dos seus itens (APH-5.9(d))", "s": "F-04", "seal": "🟡", "group": "F7.4.4 — Proposta em lote"}, {"id": "RF-30", "d": "O SISTEMA DEVE expor <code>POST /aph/actions/{action_id}</code> na convenção do ADR 0023 do hospedeiro: corpo <code>{&quot;params&quot;: …}</code>, resposta 2xx com <code>{&quot;result&quot;: &quot;&lt;string&gt;&quot;}</code> — resposta fora disso o hospedeiro degrada com o prefixo <code>erro:</code>", "s": "F-15", "seal": "🟡", "group": "F7.4.5 — Borda de execução federada"}, {"id": "RF-31", "d": "Os <code>params</code> recebidos DEVEM ser tratados como não-confiáveis e validados contra o <code>input_schema</code> da ação no nosso servidor — o hospedeiro declara que não valida; parâmetro inválido é recusa com traço, nunca execução parcial", "s": "F-16", "seal": "🟡", "group": "F7.4.5 — Borda de execução federada"}, {"id": "RF-32", "d": "A borda DEVE recusar chamada não autenticada, fail-closed com traço — mesmo sabendo que a fatia atual do hospedeiro chama sem credencial (limite de alcance L-03): enquanto não houver credencial verificável, só ações <code>risk: read</code> respondem nesta borda, e toda ação mutadora é recusada", "s": "F-16", "seal": "🟡", "group": "F7.4.5 — Borda de execução federada"}, {"id": "RF-33", "d": "A borda DEVE responder dentro do orçamento de 5 segundos do hospedeiro (acima disso ele degrada); o tempo de resposta é medido por span OTel, e a resposta de falha nunca vaza detalhe interno (só código categorizado)", "s": "F-15", "seal": "🟡", "group": "F7.4.5 — Borda de execução federada"}, {"id": "RF-34", "d": "O SISTEMA DEVE manter um registro de telas versionado, fonte de verdade compartilhada entre frontend e backend, com identidade, rota, campos tipados (<code>ai_visible</code>) e ações (<code>ai_actions</code>) por tela — a IA nunca infere a interface: nada de raspagem de DOM nem captura de tela (APH-3.1)", "s": "F-06", "seal": "🟡", "group": "F7.5.1 — Registro de telas"}, {"id": "RF-35", "d": "Tela com <code>ai_actions: []</code> é sensível: NÃO DEVE entrar em snapshot algum (§B.5.3) — a tela <code>toc.configuracao</code> do manifesto é o caso concreto", "s": "F-12", "seal": "🟡", "group": "F7.5.1 — Registro de telas"}, {"id": "RF-36", "d": "As telas declaradas no manifesto DEVEM ser subconjunto do registro de telas, com paridade testada (mesma fonte que gera os dois)", "s": "", "seal": "🟡", "group": "F7.5.1 — Registro de telas"}, {"id": "RF-37", "d": "Cada mensagem DEVE carregar snapshot estruturado com identidade da tela, rota, campos tipados e entidade selecionada (APH-3.2), no formato do §A.4", "s": "F-06, F-25", "seal": "🟡", "group": "F7.5.2 — Snapshot sanitizado no servidor"}, {"id": "RF-38", "d": "A sanitização DEVE acontecer no servidor, antes do modelo, em três camadas: denylist de segredos, campos sensíveis do registro, e allowlist — campo que não está no registro não passa (APH-3.3)", "s": "F-06", "seal": "🟡", "group": "F7.5.2 — Snapshot sanitizado no servidor"}, {"id": "RF-39", "d": "O schema do snapshot DEVE ser fechado (<code>additionalProperties: false</code> em todos os níveis fechados) com teto declarado abaixo de 32 KB; campo desconhecido ou teto estourado DEVE ser rejeitado na borda com <code>INVALID_CONTEXT</code>, nunca repassado ao modelo (APH-3.5, §A.4)", "s": "F-06, F-25", "seal": "🟡", "group": "F7.5.2 — Snapshot sanitizado no servidor"}, {"id": "RF-40", "d": "O snapshot DEVE entrar no contexto como camada rotulada de sistema, distinta do conteúdo do usuário; tudo que vem da tela é dado, nunca instrução (APH-7.1, APH-7.3)", "s": "F-19", "seal": "🟡", "group": "F7.5.2 — Snapshot sanitizado no servidor"}, {"id": "RF-41", "d": "A resposta da fronteira conversacional DEVE chegar por SSE sobre POST (<code>Content-Type: text/event-stream</code>), cada frame um JSON completo em UTF-8, terminado por <code>done</code> ou <code>error</code> (APH-1.1, §A.1)", "s": "F-8, F-21, F-07", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}, {"id": "RF-42", "d": "Cada evento DEVE carregar <code>{seq, kind, payload}</code> com <code>seq</code> inteiro ≥ 1, monotônico por sessão, atribuído no servidor antes da emissão (APH-1.2)", "s": "F-07", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}, {"id": "RF-43", "d": "O vocabulário de eventos DEVE ser fechado e conter as seis famílias mínimas — conteúdo, raciocínio, ação (<code>action_proposal</code>/<code>action_result</code>), comando de UI, erro e terminador (APH-2.1); a regra de evolução é a do APH-2.2: o consumidor ignora <code>kind</code> desconhecido, o produtor documenta antes de emitir — escrita no contrato, não só praticada", "s": "F-22", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}, {"id": "RF-44", "d": "A sessão DEVE oferecer replay por <code>GET …/events?after=N</code> sem perda nem duplicação, e o cliente DEVE deduplicar por <code>seq</code> (APH-1.3): <code>?after=0</code> devolve tudo, <code>?after=&lt;último&gt;</code> devolve vazio", "s": "F-21, F-08", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}, {"id": "RF-45", "d": "Propostas <code>awaiting_approval</code> DEVEM sobreviver à reconexão: o replay reconstrói os gates pendentes (APH-5.6, adotado por desenho — perder aprovação pendente é perda de governança)", "s": "F-24", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}, {"id": "RF-46", "d": "O cancelamento DEVE ser cooperativo: <code>DELETE …/stream</code>, verificação no laço de emissão, término com <code>error</code> de código <code>STREAM_CANCELLED</code> — nunca em silêncio (APH-1.4)", "s": "F-21, F-08", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}, {"id": "RF-47", "d": "Erro é parte do protocolo: envelope <code>{code, message, details?}</code> com códigos estáveis em <code>MAIUSCULAS_COM_SUBLINHADO</code>; o registro mínimo do §A.7 (7 códigos: 5 ✅ e 2 🧪, contagem executada em) DEVE ser adotado, e códigos próprios (<code>ADMISSAO_*</code>, <code>FUNDACAO_INDISPONIVEL</code> do ciclo 003) DEVEM ser documentados no mesmo contrato", "s": "F-09", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}, {"id": "RF-48", "d": "Comando de UI DEVE ser declarativo, de vocabulário fechado, com executor no host da própria aplicação; o executor DEVE consultar a classe de risco e recusar fail-closed comando mutador — verbo mutador nasce proposta (APH-6.1, 6.2, 6.6; o contraexemplo <code>session.logout</code> do laboratório está registrado na norma)", "s": "F-28", "seal": "🟡", "group": "F7.6 — Wire APH Nível 1"}], "ris": [{"id": "RI-01", "d": "Existe uma superfície de confirmação (<code>proposta-de-acao</code>) para toda ação <code>confirm</code>, venha de humano ou de IA: resumo em português, alterações item a item, contagem de afetados, confirmar e recusar com igual proeminência (herda o ADR 0009 da irmã)", "s": "F-05", "seal": "🟡", "group": ""}, {"id": "RI-02", "d": "A origem da proposta (<code>humano</code> | <code>ia</code>) é exibida como dado e NUNCA muda fluxo, estado ou conteúdo mostrado — no instante em que virar <code>if</code>, as duas telas divergem e a menos testada é a de mais risco", "s": "F-05", "seal": "🟡", "group": ""}, {"id": "RI-03", "d": "Lote: os N alvos listados e contados antes da decisão; depois dela, o desfecho por alvo visível (executado / falhou / pulado), com o motivo por item quando houver", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-04", "d": "O traço é visível na conversa para todo desfecho — inclusive recusa e expiração; recusa silenciosa é defeito", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-05", "d": "Estados da proposta têm apresentação própria: aguardando decisão (com TTL visível), expirada, negada, contexto mudou (<code>PROPOSAL_CONTEXT_STALE</code> — com ação &quot;propor de novo sobre a tela atual&quot;)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-06", "d": "O painel de assistência renderiza <code>kind</code> desconhecido ignorando-o sem quebrar (APH-2.2 no cliente), e nunca renderiza interface serializada gerada pelo modelo — dados estruturados em componentes próprios (APH-6.5)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-07", "d": "Cancelar é visível durante o streaming e o cancelamento se confirma na conversa (o evento <code>error</code> <code>STREAM_CANCELLED</code> vira estado visível, não sumiço)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-08", "d": "Após reconexão, a conversa reconstruída não duplica mensagens e as aprovações pendentes reaparecem no mesmo lugar", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-09", "d": "A superfície de confirmação é acessível: foco vai ao resumo ao abrir, decisão operável por teclado, mudança de estado anunciada por <code>aria-live</code>", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-10", "d": "As superfícies novas seguem o tema do inquilino com fallback completo (mesma régua do ciclo 003) e i18n com português como língua-fonte", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-11", "d": "A jornada viva do ciclo cobre quatro fluxos: proposta simples confirmada, proposta recusada, lote com falha parcial e proposta expirada — capturas geradas por script versionado do build real, avaliação heurística datada (P6)", "s": "", "seal": "🟡", "group": ""}, {"id": "RI-12", "d": "O snapshot enviado é inspecionável pela pessoa (&quot;o que a IA vê desta tela&quot;) — a transparência é a contraparte de tela-é-dado", "s": "", "seal": "🟡", "group": ""}], "rnfs": [{"id": "RNF-01", "d": "Autorização sempre fora do modelo: nenhuma decisão de permissão usa texto de LLM como entrada (APH-7.2); a política é função pura testável", "s": "F-19", "seal": "🟡", "group": ""}, {"id": "RNF-02", "d": "A sanitização tem teste de golden: o campo <code>senha_vazada</code> do contraexemplo normativo nunca alcança prompt, log ou traço", "s": "F-25", "seal": "🟡", "group": ""}, {"id": "RNF-03", "d": "Os eventos emitidos validam contra os schemas normativos do <code>protocolos</code> (<code>evento.schema.json</code>, <code>erro.schema.json</code>, <code>acao-catalogo.schema.json</code>, <code>confirmacao.schema.json</code>, <code>snapshot.schema.json</code>) em teste de CI — golden como gate, não como intenção", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-04", "d": "Fail-closed em toda fronteira nova: exceção não tratada na FSM, na borda federada ou na sanitização resulta em recusa com traço, nunca em execução", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-05", "d": "Nenhum segredo no cliente (P7): a borda <code>/aph/actions</code> e o wire vivem no servidor; o frontend nunca vê credencial nem chave", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-06", "d": "Toda proposta tem span OTel correlacionado (criação → decisão → execução → traço) sob o <code>trace_id</code> da sessão — sem traço técnico, não está pronta (P5)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-07", "d": "Base 100% sintética em fixtures, testes e capturas (ADR 0006) — o portão é o grep de personas proibidas do ciclo 003, reexecutado aqui", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-08", "d": "A borda <code>/aph/actions</code> tem limite de taxa por origem/credencial — é a única rota chamada de fora do nosso frontend, e nasce com proteção", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-09", "d": "Desempenho do wire: primeiro evento do stream em ≤ 2 s sem contar o tempo do provedor da fundação (medido por span próprio); replay de 500 eventos em ≤ 1 s — alvos propostos, calibrados na primeira medição real (L-07)", "s": "", "seal": "🟡", "group": ""}, {"id": "RNF-10", "d": "Logs estruturados de toda a fronteira carregam <code>proposal_id</code>, <code>tenant_id</code> e <code>trace_id</code>; o grant e o conteúdo de snapshot nunca aparecem em log (regra herdada do 003, RNF-01 de lá)", "s": "F-01", "seal": "🟡", "group": ""}], "rns": [{"id": "RN-01", "d": "A taxonomia de risco do catálogo <code>toc.*</code> é a mínima comprovada da norma — <code>read</code> e <code>confirm</code> (§B.5.3): <code>read</code> nunca muta; toda mutação é <code>confirm</code>. Classe nova exige ADR", "s": "F-12", "seal": "🟡", "group": ""}, {"id": "RN-02", "d": "A linha entre executar direto e propor é a reversibilidade, em política do servidor por tipo de ação (APH-6.3) — a tabela de tipos nasce no ciclo 004 e o catálogo a reutiliza; exclusão definitiva não entra no catálogo da IA", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-03", "d": "Sugestão da IA é rascunho até o gate: nenhuma UDE, causa ou aresta sugerida vira nó do diagrama sem confirmação humana — autoria é da Facilitadora, assistência é assistência (consome os critérios formais de UDE do M2 como regra de domínio pura)", "s": "", "seal": "🟡", "group": ""}, {"id": "RN-04", "d": "Lote herda o risco mais alto dos seus itens e nunca mistura ações de <code>action_id</code> distintos numa proposta só", "s": "F-04", "seal": "🟡", "group": ""}, {"id": "RN-05", "d": "Ação sem capability correspondente no Principal não existe para aquele principal: não aparece em catálogo, manifesto composto ou tool — ausência, nunca recusa visível (§B.7.3)", "s": "F-13", "seal": "🟡", "group": ""}], "ints": [{"id": "INT-01", "d": "Manifesto → admissão da fundação — <code>specs/006-acoes-governadas-e-snapshot/contracts/manifesto.json</code> submetido à rota real de administração (o caminho e os bloqueios são os do ciclo 003, INT-03 de lá); <code>url</code>/<code>origin</code> reais entram após o gate do endereço (DÚVIDA 1 do 003)", "s": "", "seal": "", "group": ""}, {"id": "INT-02", "d": "Superfície APH da aplicação — <code>GET /aph/catalog</code> (filtrado por permissão), <code>POST /aph/sessions</code>, <code>POST /aph/sessions/{id}/messages</code> (SSE), <code>GET /aph/sessions/{id}/events?after=N</code>, <code>POST /aph/sessions/{id}/proposals/{pid}</code>, <code>DELETE /aph/sessions/{id}/stream</code> — os caminhos de referência do §A.2, consumidos pela fundação", "s": "F-08", "seal": "", "group": ""}, {"id": "INT-03", "d": "Borda de execução federada — <code>POST /aph/actions/{action_id}</code> chamada pelo adapter remoto do hospedeiro (ADR 0023); contrato de resposta <code>{&quot;result&quot;: string}</code>; autenticação exigida do nosso lado (RF-32, L-03)", "s": "F-15, F-32", "seal": "", "group": ""}, {"id": "INT-04", "d": "Canal <code>ghd. do ciclo 003 — após execução confirmada, a aplicação emite </code>ghd.action_result<code> com payload </code>{}` como palpite de UI (nunca prova de execução — §B.9.1); quem prova é o traço", "s": "", "seal": "", "group": ""}, {"id": "INT-05", "d": "Assistência das ferramentas — primeiro consumidor: E2.3 da ARA (<code>specs/005-arvore-da-realidade-atual/spec.md</code>); M3 (E3.3) e M4 reutilizam o mesmo catálogo nos ciclos 007–008, acrescentando ações <code>toc.*</code> novas por re-admissão de manifesto (RF-03)", "s": "F-03", "seal": "", "group": ""}, {"id": "INT-06", "d": "O que este ciclo NÃO integra (declarado para ninguém procurar): projeção MCP headless (APH-9.3 — decisão futura, fora do alvo Nível 2), slot filling estruturado (APH-6.4 — candidato ao ciclo 011), fila de aprovação por classe (APH-5.7 — YAGNI enquanto só existe uma classe mutadora)", "s": "", "seal": "", "group": ""}], "sources": [{"tag": "F-01", "path": "/home/user/protocolos/padrao/padrao-aph.md", "rel": "/home/user/protocolos/padrao/padrao-aph.md", "lines": "102", "desc": "APH-5.1: toda ação nasce proposta; FSM de referência `proposed → awaiting_approval → confirmed → executing → executed | failed | cancelled | denied | expired | stale`; transições fora da tabela DEVEM falhar; `stale` é a única parte 🧪 — uso: RF-10, RF-11", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/padrao-aph.md:102 — APH-5.1: toda ação nasce proposta; FSM de referência proposed → awaiting_approval → confirmed → executing → executed | failed | cancelled | denied | expired | stale; transições fora da tabela DEVEM falhar; stale é a única parte 🧪 — uso: RF-10, RF-11"}, {"tag": "F-02", "path": "/home/user/protocolos/padrao/padrao-aph.md", "rel": "/home/user/protocolos/padrao/padrao-aph.md", "lines": "95-98", "desc": "§4.4: catálogo é a única superfície executável (APH-4.1), quatro declarações por ação (APH-4.2), derivado das permissões reais (APH-4.3), uma fonte/duas projeções (APH-4.4 🧪) — uso: RF-04..RF-09", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/padrao-aph.md:95-98 — §4.4: catálogo é a única superfície executável (APH-4.1), quatro declarações por ação (APH-4.2), derivado das permissões reais (APH-4.3), uma fonte/duas projeções (APH-4.4 🧪) — uso: RF-04..RF-09"}, {"tag": "F-03", "path": "/home/user/protocolos/padrao/padrao-aph.md", "rel": "/home/user/protocolos/padrao/padrao-aph.md", "lines": "107", "desc": "APH-5.5: traço em 100% das ações, inclusive recusadas; \"ação sem traço é ação não governada, e DEVE ser rejeitada\" — uso: RF-09, RF-21", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/padrao-aph.md:107 — APH-5.5: traço em 100% das ações, inclusive recusadas; &quot;ação sem traço é ação não governada, e DEVE ser rejeitada&quot; — uso: RF-09, RF-21"}, {"tag": "F-04", "path": "/home/user/protocolos/padrao/padrao-aph.md", "rel": "/home/user/protocolos/padrao/padrao-aph.md", "lines": "109-112", "desc": "APH-5.9: proposta em lote é uma proposta com N alvos; as cinco obrigações (a)–(e); procedência cita \"docs/adr/0009-uma-so-tela-de-confirmacao.md da primeira aplicação federada\" — uso: RF-24..RF-29, RN-04", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/padrao-aph.md:109-112 — APH-5.9: proposta em lote é uma proposta com N alvos; as cinco obrigações (a)–(e); procedência cita &quot;docs/adr/0009-uma-so-tela-de-confirmacao.md da primeira aplicação federada&quot; — uso: RF-24..RF-29, is fechados; \"o contraexemplo `senha_vazada` do gate prova a rejeição\"; sanitização e composição no servidor — uso: RF-37, RF-39, RNF-02", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/anexo-a-wire-format.md:80 — §A.4: snapshot com additionalProperties: false em todos os níveis fechados; &quot;o contraexemplo senha_vazada do gate prova a rejeição&quot;; sanitização e composição no servidor — uso: RF-37, RF-39, RNF-02"}, {"tag": "F-26", "path": "", "rel": "", "lines": "", "desc": "`/home/user/protocolos/padrao/padrao-aph.md:17` e `:200` — a suíte de conformidade executável cobre o Nível 1 e o lado hospedeiro da federação; \"o Nível 2 segue sem suíte\" (§8: trabalho futuro) — uso: L-01", "seal": "🟢", "internal": false, "t": " — /home/user/protocolos/padrao/padrao-aph.md:17 e :200 — a suíte de conformidade executável cobre o Nível 1 e o lado hospedeiro da federação; &quot;o Nível 2 segue sem suíte&quot; (§8: trabalho futuro) — uso: L-01"}, {"tag": "F-27", "path": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "rel": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md", "lines": "104-107", "desc": "rotas de módulos do tenant não entram na recusa de admissão; \"Escolher um prefixo próprio (`/toc/…`) é a defesa prática\" — uso: RF-02", "seal": "🟢", "internal": false, "t": "/home/user/ghdaru/docs/integration/guia-desenvolvedor-app-federada.md:104-107 — rotas de módulos do tenant não entram na recusa de admissão; &quot;Escolher um prefixo próprio (/toc/…) é a defesa prática&quot; — uso: RF-02"}, {"tag": "F-28", "path": "/home/user/protocolos/padrao/padrao-aph.md", "rel": "/home/user/protocolos/padrao/padrao-aph.md", "lines": "117-122", "desc": "§4.6: comandos de UI declarativos de vocabulário fechado (APH-6.1), executor no host (APH-6.2), linha da reversibilidade (APH-6.3), executor recusa mutador fail-closed com o contraexemplo `session.logout` vivo no laboratório (APH-6.6 ⚗️) — uso: RF-48, RN-02", "seal": "🟢", "internal": false, "t": "/home/user/protocolos/padrao/padrao-aph.md:117-122 — §4.6: comandos de UI declarativos de vocabulário fechado (APH-6.1), executor no host (APH-6.2), linha da reversibilidade (APH-6.3), executor recusa mutador fail-closed com o contraexemplo session.logout vivo no laboratório (APH-6.6 ⚗️) — uso: RF-48, RN-02"}], "chain": [{"label": "spec.md", "href": "specs/006-acoes-governadas-e-snapshot/spec.md", "state": "ok"}, {"label": "plan.md", "href": "specs/006-acoes-governadas-e-snapshot/plan.md", "state": "ok"}, {"label": "tasks.md", "href": "specs/006-acoes-governadas-e-snapshot/tasks.md", "state": "ok"}, {"label": "contracts/manifesto.json", "href": "specs/006-acoes-governadas-e-snapshot/contracts/manifesto.json", "state": "ok"}, {"label": "qa-report.md", "href": "specs/006-acoes-governadas-e-snapshot/qa-report.md", "state": "pending"}, {"label": "código do ciclo 006", "href": "", "state": "todo"}], "lacunas": [{"id": "L-01", "d": "O Nível 2 não tem suíte de conformidade executável ([F-26]) — assunção: a prova é autodeclaração com evidência por path + os golden dos schemas no nosso CI (RNF-03); a autodeclaração formal é entrega do ciclo 012 — risco médio (sem medição externa, o erro de auto-avaliação é nosso).", "risco": "médio", "cmds": [], "paths": [], "s": "F-26"}, {"id": "L-02", "d": "O schema normativo do manifesto não admite <code>batch_atomicity</code> — verificado: <code>grep -c batch_atomicity federacao-manifesto.schema.json</code> → <code>0</code>, e a sabotagem que o acrescenta a uma ação do manifesto é rejeitada (<code>1 erro</code>, saída no qa-report do 001); o campo existe só no schema do catálogo do fio (§A.5 [F-11]) — assunção: declaramos atomicidade no catálogo servido e não no manifesto; se o gap doer na admissão, vira <code>mensagens/NNN-para-protocolos-</code> (P1: relate e pare) — risco baixo.", "risco": "baixo", "cmds": ["<code>grep -c batch_atomicity federacao-manifesto.schema.json</code>"], "paths": [], "s": "F-11"}
