; Alembic — migrações do serviço toc-api.
;
; A URL do banco NÃO está aqui, e a ausência é a regra P7: cadeia de conexão carrega
; credencial, e arquivo versionado com credencial é o defeito que o princípio proíbe.
; Quem a lê é `src/toc_api/alembic/env.py`, da variável de ambiente `DATABASE_URL`.
[alembic]
script_location = src/toc_api/alembic
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
